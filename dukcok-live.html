const STATUS_LABEL = { scheduled:'예정', attended:'출석완료', absent:'결석', makeup_scheduled:'보강예정', makeup_completed:'보강완료', cancelled:'취소' };
const WD = ['일','월','화','수','목','금','토'];
const OPERATING_HOURS = ['06:00','07:00','08:00','09:00','10:00','11:00','12:00','13:00','14:00','15:00','16:00','17:00','18:00','19:00','20:00','21:00','22:00'];

function pad(n){ return n<10 ? '0'+n : ''+n; }
function toISO(d){ return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
function fromISO(s){ const [y,m,d]=s.split('-').map(Number); return new Date(y,m-1,d); }
function addDays(d,n){ const r=new Date(d); r.setDate(r.getDate()+n); return r; }
function ym(d){ return d.getFullYear()+'-'+pad(d.getMonth()+1); }
function monthLabel(yearMonth){ const [y,m]=yearMonth.split('-'); return y+'년 '+parseInt(m)+'월'; }
function addMonths(yearMonth, n){ let [y,m]=yearMonth.split('-').map(Number); m+=n; while(m>12){m-=12;y++;} while(m<1){m+=12;y--;} return y+'-'+pad(m); }
function monthRange(yearMonth){ const [y,m]=yearMonth.split('-').map(Number); const start=new Date(y,m-1,1); const end=new Date(y,m,0); return [start,end]; }

/* ============================== 행 <-> 상태 매핑 ============================== */
function toCamelKey(k){ return k.replace(/_([a-z0-9])/g, (_,c)=>c.toUpperCase()); }
function toSnakeKey(k){ return k.replace(/[A-Z]/g, c=>'_'+c.toLowerCase()); }
function rowToCamel(row){ if(!row) return row; const o={}; Object.keys(row).forEach(k=>o[toCamelKey(k)]=row[k]); return o; }
function objToSnakeRow(obj){ const o={}; Object.keys(obj).forEach(k=>o[toSnakeKey(k)]=obj[k]); return o; }
function productRowToState(row){
  return { id:row.id, name:row.name, price:row.price, mode:row.registration_mode,
    ruleType: row.session_rule_type, ruleCount: row.session_rule_count,
    capacity: row.capacity, validDays: row.pack_valid_days, status: row.status,
    bundlePrice: row.bundle_price };
}
function templateRowToState(row){
  const o = rowToCamel(row);
  o.startTime = (row.start_time||'').slice(0,5);
  o.endTime = (row.end_time||'').slice(0,5);
  return o;
}
// 코트 배정 템플릿(classTemplates)이 실제로 덮는 시간대들(예: 17:00~22:00 → 17,18,19,20,21시)
function templateHours(t){ return OPERATING_HOURS.filter(h=>h>=t.startTime && h<t.endTime); }
function hourPlusOne(t){ const h = parseInt(t.slice(0,2)); return String(h+1).padStart(2,'0')+':00'; }
function hourMinusOne(t){ const h = parseInt(t.slice(0,2)); return String(Math.max(h-1,0)).padStart(2,'0')+':00'; }
// 같은 상품을 이미 듣고 있는 회원이 하나 더(주2회 등) 등록할 때, 두 슬롯 모두 정가로 기록하고
// 번들 할인액만 따로 계산한다 (예: 12만원+12만원-2만원=22만원) — dukcok-app.html 데모와 동일한 규칙
function computeBundleDiscount(memberId, productId){
  const product = productById(productId);
  if (!product || !product.bundlePrice) return 0;
  const existing = STATE.slots.filter(s=>s.memberId===memberId && s.active && s.productId===productId);
  if (existing.length!==1) return 0;
  return Math.max(product.price*2 - product.bundlePrice, 0);
}
function slotRowToState(row){
  return { id:row.id, memberId: row.member_id, weekday: row.weekday, time: (row.start_time||'').slice(0,5),
    coachId: row.coach_id, productId: row.product_id, courtId: row.court_id,
    active: row.status==='active', forceOverride: row.force_override };
}
function sessionRowToState(row){
  const o = rowToCamel(row);
  o.startTime = (row.start_time||'').slice(0,5);
  return o;
}

/* ============================== 인증 / 세션 부트스트랩 ============================== */
let STATE = null;
let AUTH = { error:'', bootstrap:null, staffNames:null, selectedName:null };

sb.auth.onAuthStateChange((event, session) => {
  if (event === 'SIGNED_OUT') { STATE = null; AUTH = { error:'', bootstrap:null, staffNames:null, selectedName:null }; showAuthScreen(); return; }
  if (session && (event === 'SIGNED_IN' || event === 'INITIAL_SESSION' || event === 'TOKEN_REFRESHED')) {
    if (!STATE) loadAppData(session.user);
  } else if (!session && event === 'INITIAL_SESSION') {
    showAuthScreen();
  }
});

async function logout(){ await sb.auth.signOut(); }

// 로그인 화면을 띄우기 전에 "관리자 계정이 아직 하나도 없는지"부터 확인한다 —
// 없으면 최초 1회 관리자 설정 화면을, 있으면 등록된 이름 탭을 눌러 들어가는 로그인 화면을 보여준다.
async function showAuthScreen(){
  if (AUTH.bootstrap === null) {
    const { data } = await sb.rpc('staff_exists');
    AUTH.bootstrap = !data;
  }
  if (!AUTH.bootstrap && !AUTH.staffNames) {
    const { data } = await sb.rpc('list_staff_names');
    AUTH.staffNames = (data||[]).map(r=>r.name);
  }
  renderAuthScreen();
}

async function submitBootstrapAdmin(){
  const name = (document.getElementById('boot_name').value||'').trim();
  const password = document.getElementById('boot_password').value||'';
  if (!name || !password) { AUTH.error='이름과 비밀번호를 입력하세요'; renderAuthScreen(); return; }
  if (password.length < 6) { AUTH.error='비밀번호는 6자 이상으로 해주세요'; renderAuthScreen(); return; }
  AUTH.error = '';
  const { data, error } = await sb.functions.invoke('create-coach', { body: { name, password } });
  if (error || (data && data.error)) {
    // 계정 생성 응답이 오류를 반환해도 실제로는 계정이 만들어진 경우가 있어(서버 함수 이슈),
    // 이름으로 실제 로그인이 되는지 한 번 더 확인해본 뒤에만 진짜 실패로 처리한다.
    const { data: fallbackEmail } = await sb.rpc('get_login_email_for_name', { p_name: name });
    if (fallbackEmail) {
      const { error: loginErr2 } = await sb.auth.signInWithPassword({ email: fallbackEmail, password });
      if (!loginErr2) return;
    }
    AUTH.error = (data && data.error) || (error && error.message) || '설정 실패';
    renderAuthScreen();
    return;
  }
  const { error: loginErr } = await sb.auth.signInWithPassword({ email: data.email, password });
  if (loginErr) { AUTH.error = '자동 로그인에 실패했습니다. 다시 시도해주세요'; renderAuthScreen(); }
}

function selectLoginName(n){ AUTH.selectedName = n; AUTH.error=''; renderAuthScreen(); }
function backToNameSelect(){ AUTH.selectedName = null; AUTH.error=''; renderAuthScreen(); }

async function submitLogin(){
  const name = AUTH.selectedName;
  const password = document.getElementById('login_password').value||'';
  if (!password) { AUTH.error='비밀번호를 입력하세요'; renderAuthScreen(); return; }
  AUTH.error = '';
  const { data: email, error: rpcErr } = await sb.rpc('get_login_email_for_name', { p_name: name });
  if (rpcErr || !email) { AUTH.error = '등록되지 않은 이름입니다'; renderAuthScreen(); return; }
  const { error } = await sb.auth.signInWithPassword({ email, password });
  if (error) { AUTH.error = '비밀번호가 올바르지 않습니다'; renderAuthScreen(); return; }
}

  const root = document.getElementById('appRoot');
  if (AUTH.bootstrap) {
    root.innerHTML = `

async function loadAppData(user){
  let staffRow = null;
  for (let i=0;i<6 && !staffRow;i++){
    const { data } = await sb.from('staff').select('*').eq('auth_user_id', user.id).maybeSingle();
    if (data) staffRow = data; else await new Promise(r=>setTimeout(r,500));
  }
  if (!staffRow) { toast('계정 정보를 불러오지 못했습니다. 새로고침 해주세요.'); return; }

  const today = new Date();
  STATE = {
    // dbRole: 실제 DB 권한(RLS 기준). role: 화면에 지금 뭘 보여줄지(코치 화면으로 항상 먼저 시작하고,
    // dbRole이 owner인 사람만 "관리자" 버튼으로 본인 비밀번호를 다시 입력해 role을 owner로 바꿀 수 있다)
    dbRole: staffRow.role, role: 'coach', myEmail: user.email,
    myStaffId: staffRow.id, myName: staffRow.name,
    tab: 'timetable', today: toISO(today),
    weekStart: toISO(addDays(today, -today.getDay())),
    selectedDate: toISO(today),
    paymentMonth: addMonths(ym(today), 1),
    reportMonth: ym(today),
    availWeekday: today.getDay(),
    staff: [], courts: [], products: [], members: [], slots: [], packages: [],
    enrollments: [], sessions: [], logs: [], classTemplates: [],
    enrollmentStatusBySlot: {}, packageStatusByMember: {}
  };
  try {
    await refreshAllData();
    render();
  } catch(e) {
    console.error(e);
    toast('데이터를 불러오는 중 오류가 발생했습니다');
  }
}

async function refreshAllData(){
  const [staffRes, courtsRes, productsRes, membersRes, slotsRes, templatesRes] = await Promise.all([
    sb.from('staff').select('*'),
    sb.from('courts').select('*'),
    sb.from('products').select('*'),
    sb.from('members').select('*').neq('status','withdrawn'),
    sb.from('member_slots').select('*').eq('status','active'),
    sb.from('class_templates').select('*')
  ]);
  STATE.staff = (staffRes.data||[]).map(rowToCamel);
  STATE.courts = (courtsRes.data||[]).map(rowToCamel);
  STATE.products = (productsRes.data||[]).map(productRowToState);
  STATE.members = (membersRes.data||[]).map(rowToCamel);
  STATE.slots = (slotsRes.data||[]).map(slotRowToState);
  STATE.classTemplates = (templatesRes.data||[]).map(templateRowToState);

  const rangeStart = toISO(addDays(fromISO(STATE.today), -30));
  const rangeEnd = toISO(addDays(fromISO(STATE.today), 90));
  const sessionsRes = await sb.from('class_sessions').select('*').gte('date', rangeStart).lte('date', rangeEnd);
  STATE.sessions = (sessionsRes.data||[]).map(sessionRowToState);

  if (isOwner()) {
    const [enrRes, pkgRes] = await Promise.all([
      sb.from('monthly_enrollments').select('*'),
      sb.from('lesson_packages').select('*')
    ]);
    STATE.enrollments = (enrRes.data||[]).map(rowToCamel);
    STATE.packages = (pkgRes.data||[]).map(rowToCamel);
    await fetchLogs();
  } else {
    const thisMonth = ym(fromISO(STATE.today));
    const [byslotRes, pkgBulkRes] = await Promise.all([
      sb.rpc('enrollment_status_by_slot', { p_year_month: thisMonth }),
      sb.rpc('package_status_bulk')
    ]);
    STATE.enrollmentStatusBySlot = { [thisMonth]: {} };
    (byslotRes.data||[]).forEach(r=>{ STATE.enrollmentStatusBySlot[thisMonth][r.slot_id] = r.is_registered; });
    STATE.packageStatusByMember = {};
    (pkgBulkRes.data||[]).forEach(r=>{ STATE.packageStatusByMember[r.member_id] = { remainingSessions: r.remaining_sessions, totalSessions: r.total_sessions, pkgStatus: r.pkg_status, defaultCoachId: r.default_coach_id }; });
  }
}

async function fetchLogs(){
  const { data } = await sb.from('change_logs')
    .select('id, actor_role, note, created_at, staff:actor_id(name), members:member_id(name)')
    .order('created_at', { ascending:false }).limit(200);
  STATE.logs = (data||[]).map(r=>({
    id:r.id, actorName: (r.staff&&r.staff.name)||'알수없음', actorRole:r.actor_role,
    memberName: (r.members&&r.members.name)||'', text:r.note, createdAt:(r.created_at||'').replace('T',' ').slice(0,16)
  }));
}

async function refreshMemberSessions(memberId){

}

}
async function refreshPackages(){

function toast(msg){

/* ============================== 조회 헬퍼 ============================== */
function memberById(id){ return STATE.members.find(m=>m.id===id); }
function staffById(id){ return STATE.staff.find(s=>s.id===id); }
// 코치 선택 목록(코트배정/일괄등록/신규등록 등) — 이동선처럼 관리자를 겸임하는 코치도 포함하되(role이 owner여도
// 실제로 수업을 맡는 코치이므로), 로그인 목록에서 숨긴 순수 관리자 계정("관리자")과 삭제(비활성화)된 코치는 제외한다.
function activeCoaches(){ return STATE.staff.filter(s=>!s.hideFromLogin && s.status!=='inactive'); }
function courtById(id){ return STATE.courts.find(c=>c.id===id); }
function productById(id){ return STATE.products.find(p=>p.id===id); }
function sessionById(id){ return STATE.sessions.find(s=>s.id===id); }
function slotById(id){ return STATE.slots.find(s=>s.id===id); }
function slotsOfMember(memberId){ return STATE.slots.filter(s=>s.memberId===memberId && s.active); }
function packageOfMember(memberId){ return STATE.packages.find(p=>p.memberId===memberId && p.status==='active'); }
function sessionsOnDate(dateStr){ return STATE.sessions.filter(s=>s.date===dateStr).sort((a,b)=> a.startTime.localeCompare(b.startTime)); }
function isOwner(){ return STATE.role==='owner'; }

// 코치를 색으로도 구분(텍스트와 항상 병행 — 색상만으로 구분하지 않음). 데모 때부터 써온 이름 기준 고정 배정을
// 그대로 따른다(김종성 연두/유승우 하늘/김다빈 주황/이동선 노랑/김공수 보라) — UUID 정렬 순서로 배정하면 코치가
// 로그인할 때마다 계정이 재생성되어도 안 바뀌긴 하지만, 데모에서 보던 색과 어긋나 보이는 문제가 있었다.
const COACH_COLOR_BY_NAME = { '김종성':'#bfe0b2', '유승우':'#a9d3ee', '김다빈':'#f7b877', '이동선':'#ffe07a', '김공수':'#c5b6e2' };
const COACH_FALLBACK_PALETTE = ['#9fd6d1','#f2a9c4','#b9dd9a','#dcbfa8','#a8bde3'];
function coachColor(coachId){
  const coach = staffById(coachId);
  if (coach && COACH_COLOR_BY_NAME[coach.name]) return COACH_COLOR_BY_NAME[coach.name];
  const others = [...activeCoaches()].filter(c=>!COACH_COLOR_BY_NAME[c.name]).sort((a,b)=>a.id.localeCompare(b.id));
  const idx = others.findIndex(c=>c.id===coachId);
  return COACH_FALLBACK_PALETTE[idx>=0 ? idx % COACH_FALLBACK_PALETTE.length : 0];
}
function coachTextColor(coachId){ return '#334155'; } // 모든 코치색이 파스텔이라 텍스트는 공통으로 짙은 남색계열 사용

// 코치 화면은 결제 원본 테이블에 접근 권한이 없으므로(RLS), 로그인 시 미리 받아둔 안전한 요약값을 쓴다
function getSlotPaidStatus(slotId, yearMonth){
  if (isOwner()) {
    const e = STATE.enrollments.find(x=>x.slotId===slotId && x.yearMonth===yearMonth);
    return e ? e.paymentStatus==='paid' : false;
  }
  return !!(STATE.enrollmentStatusBySlot[yearMonth] && STATE.enrollmentStatusBySlot[yearMonth][slotId]);
}
function memberHasPackage(memberId){
  if (isOwner()) return !!packageOfMember(memberId);
  return !!STATE.packageStatusByMember[memberId];
}
function getPackageDisplay(memberId){
  if (isOwner()) {
    const p = packageOfMember(memberId);
    return p ? { total:p.totalSessions, used:p.usedSessions, remaining:p.totalSessions-p.usedSessions, coachId:p.defaultCoachId, purchasedAt:p.purchasedAt, amount:p.paymentAmount, method:p.paymentMethod } : null;
  }
  const r = STATE.packageStatusByMember[memberId];
  return r ? { total:r.totalSessions, used:r.totalSessions-r.remainingSessions, remaining:r.remainingSessions, coachId:r.defaultCoachId } : null;
}

}

/* ============================== 자동생성 (결제완료 → 시간표 생성) ============================== */
async function completeMonthlyPayment(enrollmentId, amount, method, cardCompany){
  const enr = STATE.enrollments.find(e=>e.id===enrollmentId);
  if (!enr) return;
  const { data, error } = await sb.rpc('complete_monthly_payment', { p_enrollment_id: enrollmentId, p_amount: amount, p_method: method, p_card_company: cardCompany||null });
  if (error) { toast('처리 실패: '+error.message); return; }
  await refreshEnrollments();
  await refreshMemberSessions(enr.memberId);
  const m = memberById(enr.memberId);
  const already = data === 0;
  await addLog(m.id, m.name, `${enr.yearMonth} 결제완료 처리(${amount.toLocaleString()}원)${already?' (이미 생성된 등록)':' → 해당 월 수업 자동생성'}`);
  STATE.tab = 'timetable';
  STATE.timetableMode = 'view';
  render();
  toast(already ? '이미 처리된 등록입니다' : `${m.name} 회원 ${monthLabel(enr.yearMonth)} 수업이 자동 생성되었습니다`);
}

  closeModal(); render();
  toast(`${m.name} 회원 ${monthLabel(yearMonth)} 수업이 자동 생성되었습니다`);
}

async function purchasePackage(memberId, coachId, method){
  const product = STATE.products.find(p=>p.mode==='session_pack');
  const { data, error } = await sb.from('lesson_packages').insert(objToSnakeRow({
    memberId, productId: product.id, defaultCoachId: coachId, totalSessions: product.ruleCount, usedSessions:0,
    purchasedAt: STATE.today, status:'active', paymentAmount: product.price, paymentMethod: method, paymentDate: STATE.today, paidBy: STATE.myStaffId
  })).select().single();

async function bookPackageSession(memberId, date, time, courtId){
  const { error } = await sb.rpc('book_package_session', { p_member_id: memberId, p_date: date, p_start_time: time, p_court_id: courtId });
  if (error) { toast('예약 실패: '+error.message); return; }
  await refreshMemberSessions(memberId);
  if (isOwner()) await refreshPackages();
  const m = memberById(memberId);
  const disp = getPackageDisplay(memberId);
  await addLog(memberId, m.name, `개인레슨 세션 추가 예약 ${date} ${time}${disp?` (잔여 ${disp.remaining}회)`:''}`);
  closeModal(); render();
  toast('레슨이 예약되었습니다');
}

async function setSessionStatus(sessionId, status){
  const s = sessionById(sessionId); if (!s) return;
  const before = STATUS_LABEL[s.status];
  const { error } = await sb.from('class_sessions').update({ status }).eq('id', sessionId);
  if (error) { toast('저장 실패'); return; }
  s.status = status;
  const m = memberById(s.memberId);
  await addLog(m.id, m.name, `${s.date} ${s.startTime} 수업 ${before} → ${STATUS_LABEL[status]}`);
  closeModal(); render();
}

async function confirmMakeup(absentSessionId, date, time, courtId, coachId){
  const orig = sessionById(absentSessionId);
  const finalCoachId = coachId || orig.coachId;
  // 이 코트가 그 날짜·시간에 이미 정원이 찼거나(1:4/1:2) 다른 1:1로 사용 중이면 보강을 잡을 수 없다는 경고를 먼저 보여준다
  const existing = STATE.sessions.filter(s=>s.date===date && s.startTime===time && s.courtId===courtId && s.status!=='cancelled');
  const existingProduct = existing[0] ? productForSession(existing[0]) : null;
  if (existingProduct && existing.length >= existingProduct.capacity) {
    toast(`이 코트는 ${date} ${time}에 이미 정원(${existingProduct.capacity}명)이 찼습니다`);
    return;
  }
  if (!existingProduct && existing.length > 0) {
    toast(`이 코트는 ${date} ${time}에 이미 사용 중입니다`);
    return;
  }

/* ============================== 잔여석 계산 ============================== */
function availabilityForWeekday(weekday){
  const rows = [];
  const grouped = {};
  // 관리자가 미리 배정해둔 코트배정 템플릿을 먼저 0명으로 깔아, 회원이 하나도 없어도
  // "이 코치가 이 코트/시간에 이 상품을 한다"가 바로 보이게 한다.
  STATE.classTemplates.filter(t=>t.weekday===weekday).forEach(t=>{
    templateHours(t).forEach(h=>{
      const key = h+'|'+t.courtId+'|'+t.coachId+'|'+t.productId;
      grouped[key] = (grouped[key]||0)+0;
    });
  });
  STATE.slots.filter(s=>s.weekday===weekday && s.active).forEach(s=>{
    const key = s.time+'|'+s.courtId+'|'+s.coachId+'|'+s.productId;
    grouped[key] = (grouped[key]||0)+1;
  });
  Object.keys(grouped).forEach(key=>{
    const [time,courtId,coachId,productId] = key.split('|');
    const used = grouped[key];
    const product = productById(productId);
    if (!product) return;
    const remaining = product.capacity - used;
    rows.push({time, courtId, coachId, productId, used, capacity: product.capacity, remaining});
  });
  rows.sort((a,b)=> a.time.localeCompare(b.time));
  return rows;
}
// "요일 상관없이 몇시만 되면 되는지" 문의에 답하기 위한, 시간 하나 고정 + 7요일 매트릭스
function availabilityForTimeAcrossWeek(time){
  const result = {};
  for (let wd=0; wd<7; wd++){
    availabilityForWeekday(wd).filter(r=>r.time===time).forEach(r=>{
      result[r.coachId] = result[r.coachId] || {};
      result[r.coachId][r.productId] = result[r.coachId][r.productId] || {};
      result[r.coachId][r.productId][wd] = { remaining: r.remaining };
    });
  }
  return result;
}
// 코치별 보기 — 요일·시간 상관없이 이 코치 한 명의 일주일 전체 정규수업 배정을 한눈에 본다.
function availabilityForCoach(coachId){
  const rows = [];
  for (let wd=0; wd<7; wd++){
    availabilityForWeekday(wd).filter(r=>r.coachId===coachId).forEach(r=>rows.push({...r, weekday:wd}));
  }
  rows.sort((a,b)=> a.weekday-b.weekday || a.time.localeCompare(b.time));
  return rows;
}
function availLabel(remaining){
  if (remaining <= 0) return {text:'마감', bg:'#fef2f2', color:'#b91c1c'};
  if (remaining === 1) return {text:'마감임박', bg:'#fffbeb', color:'#b45309'};
  return {text:'여유', bg:'#f0fdf4', color:'#15803d'};
}

      if (STATE.timetableMode==='add') return (STATE.addClassTab==='hours') ? addClassView() : makeupListView();
      return timetableView();
    case 'availability': return availabilityView();
    case 'members': return membersView();
    case 'history': return historyView();
    case 'settings': return settingsView();
    case 'myinfo': return myInfoView();
    default: return '';
  }
}

/* ---------- 1) 월간 시간표 ---------- */
function setTimetableMode(m){ STATE.timetableMode = m; render(); }
function setAddClassTab(t){ STATE.addClassTab = t; render(); }

function timetableView(){
  const selected = STATE.selectedDate || STATE.today;
  const daySessions = sessionsOnDate(selected);

  const groups = {};
  const seen = new Set();
  daySessions.forEach(s=>{
    const key = s.startTime+'|'+(s.courtId||'_none');
    groups[key] = groups[key] || [];
    groups[key].push(s);
  });

  const coachTimeCourts = {};
  daySessions.filter(s=>s.status!=='cancelled').forEach(s=>{
    const k = s.coachId+'|'+s.startTime;
    coachTimeCourts[k] = coachTimeCourts[k] || new Set();
    if (s.courtId) coachTimeCourts[k].add(s.courtId);
  });

  let warnCount = 0;
  const courtTimeWarn = {};
  const courtTimeWarnDetail = {};
  Object.keys(groups).forEach(key=>{
    const list = groups[key];
    const coaches = new Set(list.map(s=>s.coachId));
    if (coaches.size > 1) { courtTimeWarn[key]='conflict'; courtTimeWarnDetail[key]='코트 중복배정 · 코치 겹침'; warnCount++; }
    const doubleBookedCoach = list.find(s=>{ const k=s.coachId+'|'+s.startTime; return coachTimeCourts[k] && coachTimeCourts[k].size>1; });
    if (doubleBookedCoach && !courtTimeWarn[key]) {
      courtTimeWarn[key]='conflict';
      courtTimeWarnDetail[key] = `${staffById(doubleBookedCoach.coachId).name} 코치가 같은 시간 다른 코트에도 배정됨`;
      warnCount++;
    }
    const product = list[0] ? (productForSession(list[0])) : null;
    if (product && list.length > product.capacity) { courtTimeWarn[key] = courtTimeWarn[key]==='conflict' ? 'conflict' : 'capacity'; warnCount++; }
  });

  let html = `<div style="padding:14px 18px 16px 18px;">
    <div style="font-size:14px;font-weight:800;margin-bottom:8px;">${selected.slice(5).replace('-','월 ')}일(${WD[fromISO(selected).getDay()]}) · ${daySessions.filter(s=>s.status!=='cancelled').length}수업</div>`;

  if (warnCount>0) {
    html += `<div style="display:flex;align-items:center;gap:6px;background:#fef2f2;border:1px solid #fecaca;padding:7px 10px;border-radius:8px;margin-bottom:12px;color:#b91c1c;">
      <span style="display:flex;">${ICONS.warn}</span><span style="font-size:12px;font-weight:700;">경고 ${warnCount}건 — 코트 중복배정/정원초과 확인</span></div>`;
  }

  // 운영시간이 새벽~밤까지 넓어서, 그날 실제 수업이 있는 시간대만 표시한다 (없으면 안내 문구)
  // 수업추가 탭에서 정규 운영시간 밖(예: 05시)에 새로 넣은 수업도 여기 보여야 하므로, OPERATING_HOURS 안쪽만
  // 보지 않고 그날 실제로 잡힌 세션의 시작시간도 함께 모은다.
  const sessionHours = [...new Set(daySessions.map(s=>s.startTime))];
  const activeHours = [...new Set([...OPERATING_HOURS.filter(t=>STATE.courts.some(c=>(groups[t+'|'+c.id]||[]).length>0)), ...sessionHours])].sort();
  if (activeHours.length===0) {
    html += `<div style="text-align:center;padding:40px 0;color:#94a3b8;font-size:13px;">이 날짜엔 등록된 수업이 없습니다.</div>`;
  }
  activeHours.forEach(t=>{
    html += `<div style="font-size:12px;font-weight:700;color:#0f172a;margin:14px 0 6px 0;">${t}</div>
    <div style="display:grid;grid-template-columns:repeat(${STATE.courts.length},1fr);gap:6px;align-items:stretch;">`;
    const weekday = fromISO(selected).getDay();
    STATE.courts.forEach(court=>{
      const key = t+'|'+court.id;
      const list = groups[key] || [];
      list.forEach(s=>seen.add(s.id));
      const warn = courtTimeWarn[key];
      const product = list[0] ? productForSession(list[0]) : null;
      const tpl = list.length===0 ? STATE.classTemplates.find(x=>x.weekday===weekday && x.courtId===court.id && templateHours(x).includes(t)) : null;
      const repCoachId = list[0] ? list[0].coachId : (tpl ? tpl.coachId : null);
      const overCap = !!(product && list.length>product.capacity);
      html += `<div class="m-card" style="padding:8px;height:100%;box-sizing:border-box;margin-top:0;${warn?'border-color:#fca5a5;background:#fffafa;':''}">`;
      if (warn) {
        const txt = warn==='conflict' ? (courtTimeWarnDetail[key] || '코트 중복배정 · 코치 겹침') : `정원초과 ${list.length}/${product?product.capacity:'-'}`;
        html += `<div style="display:flex;align-items:center;gap:3px;background:#fef2f2;border:1px solid #fecaca;border-radius:6px;padding:3px 5px;margin-bottom:6px;color:#b91c1c;">
          <span style="display:flex;flex-shrink:0;">${ICONS.warn}</span><span style="font-size:9px;font-weight:700;line-height:1.3;">${txt}</span></div>`;
      }
      html += `<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:6px;gap:4px;border-radius:6px;overflow:hidden;${repCoachId?`background:${coachColor(repCoachId)};`:''}">
        <div style="min-width:0;overflow:hidden;font-size:11px;font-weight:800;white-space:nowrap;text-overflow:ellipsis;padding:2px 0 2px 7px;${repCoachId?`color:${coachTextColor(repCoachId)};`:'color:#0f172a;'}">${court.name}${repCoachId?' · '+staffById(repCoachId).name:''}</div>
        ${list.length>0 ? `<span class="cap-badge ${overCap?'cap-warn':''}" style="font-size:9px;padding:2px 7px;flex-shrink:0;${repCoachId && !overCap ? `background:transparent;color:${coachTextColor(repCoachId)};` : ''}">${list.length}${product?'/'+product.capacity:''}</span>` : ''}
      </div>`;
      if (list.length===0) {
        html += `<div style="color:#cbd5e1;font-size:11px;font-weight:600;">비어있음</div>`;
      } else {
        list.forEach(s=>{
          const m = memberById(s.memberId);
          html += `<div style="padding:5px 0;border-top:1px solid #f1f5f9;cursor:pointer;display:flex;align-items:center;gap:4px;" onclick="openSessionSheet('${s.id}')">
            <div style="flex:1;min-width:0;font-size:11px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${m?m.name:'(삭제된 회원)'}${s.originType==='package_session'?' <span style=\"color:#0d9488;font-weight:600;\">개인</span>':''}</div>
            <span style="display:flex;align-items:center;gap:3px;flex-shrink:0;">
              ${s.capacityOverride?'<span class="status-badge" style="color:#b45309;background:#fef3c7;border-color:#fde68a;font-size:9px;padding:2px 5px;">강제</span>':''}
              <span class="status-badge st-${s.status}" style="font-size:9px;padding:2px 5px;">${statusIcon(s.status)}${STATUS_LABEL[s.status]}</span>
            </span>
          </div>`;
        });
      }
      html += `</div>`;
    });
    html += `</div>`;
  });

  const leftover = daySessions.filter(s=>!seen.has(s.id));
  if (leftover.length>0) {
    html += `<div style="font-size:12px;font-weight:700;color:#0f172a;margin:14px 0 6px 0;">기타</div><div class="m-card">`;
    leftover.forEach(s=>{
      const m = memberById(s.memberId); const coach = staffById(s.coachId);
      html += `<div style="display:flex;align-items:center;gap:8px;padding:6px 0;cursor:pointer;" onclick="openSessionSheet('${s.id}')">
        <span style="flex:1;font-size:13px;font-weight:600;">${m?m.name:'-'} <span style="font-weight:500;color:#94a3b8;font-size:11px;">${s.startTime} ${coach?'· '+coach.name+' 코치':''}${courtById(s.courtId)?' · '+courtById(s.courtId).name:''}</span></span>
        <span class="status-badge st-${s.status}">${statusIcon(s.status)}${STATUS_LABEL[s.status]}</span>
      </div>`;
    });
    html += `</div>`;
  }

  html += `</div>`;
  return html;
}
function statusIcon(status){
  if (status==='scheduled') return ICONS.clock;
  if (status==='attended' || status==='makeup_completed') return ICONS.check;
  if (status==='absent') return ICONS.x;
  if (status==='makeup_scheduled') return ICONS.refresh;
  if (status==='cancelled') return ICONS.ban;
  return '';
}
function productForSession(s){
  if (s.enrollmentId) { const e = STATE.enrollments.find(e=>e.id===s.enrollmentId); if (e) return productById(e.productId); }
  const slot = STATE.slots.find(sl=>sl.id===s.sourceSlotId);
  if (slot) return productById(slot.productId);
  if (s.packageId) { const prod = STATE.products.find(p=>p.mode==='session_pack'); if (prod) return prod; }
  return null;
}
function shiftWeek(n){ STATE.weekStart = toISO(addDays(fromISO(STATE.weekStart), 7*n)); STATE.selectedDate = toISO(addDays(fromISO(STATE.weekStart), 0)); render(); }
function selectDate(iso){ STATE.selectedDate = iso; render(); }

function openMonthPicker(){
  const base = fromISO(STATE.selectedDate || STATE.today);
  STATE._monthPicker = { year: base.getFullYear(), month: base.getMonth() };
  renderMonthPicker();
}
function shiftMonthPicker(n){
  const mp = STATE._monthPicker;
  let m = mp.month+n, y = mp.year;
  while (m>11){ m-=12; y++; }
  while (m<0){ m+=12; y--; }
  mp.month = m; mp.year = y;
  renderMonthPicker();
}
function pickMonthDate(iso){
  STATE.selectedDate = iso;
  STATE.weekStart = toISO(addDays(fromISO(iso), -fromISO(iso).getDay()));
  closeModal(); render();
}
function renderMonthPicker(){
  const mp = STATE._monthPicker;
  const first = new Date(mp.year, mp.month, 1);
  const startOffset = first.getDay();
  const daysInMonth = new Date(mp.year, mp.month+1, 0).getDate();
  const selected = STATE.selectedDate || STATE.today;
  let cells = '';
  for (let i=0;i<startOffset;i++) cells += `<div></div>`;
  for (let d=1; d<=daysInMonth; d++) {
    const iso = toISO(new Date(mp.year, mp.month, d));
    const has = sessionsOnDate(iso).length>0;
    const sel = iso===selected;
    const isToday = iso===STATE.today;
    cells += `<div onclick="pickMonthDate('${iso}')" style="height:42px;display:flex;flex-direction:column;align-items:center;justify-content:center;border-radius:10px;cursor:pointer;${sel?'background:#4f46e5;':(isToday?'background:#eef0ff;':'')}">
      <span style="font-size:13px;font-weight:${sel?'800':'600'};color:${sel?'#fff':'#0f172a'};">${d}</span>
      <div style="width:4px;height:4px;border-radius:50%;margin-top:2px;background:${has?(sel?'#fff':'#94a3b8'):'transparent'};"></div>
    </div>`;
  }
  const html = `<div class="sheet-handle"></div><div class="sheet-close" onclick="closeModal()">${ICONS.x}</div>
  <div style="padding:6px 20px 20px 20px;">
    <div style="display:flex;align-items:center;justify-content:center;gap:16px;margin-bottom:16px;">
      <span onclick="shiftMonthPicker(-1)" style="cursor:pointer;">${ICONS.chevL}</span>
      <span style="font-size:16px;font-weight:800;">${mp.year}년 ${mp.month+1}월</span>
      <span onclick="shiftMonthPicker(1)" style="cursor:pointer;">${ICONS.chevR}</span>
    </div>
    <div style="display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:6px;">
      ${WD.map((w,i)=>`<div style="text-align:center;font-size:11px;font-weight:700;color:${i===0?'#dc2626':(i===6?'#2563eb':'#94a3b8')};">${w}</div>`).join('')}
    </div>
    <div style="display:grid;grid-template-columns:repeat(7,1fr);gap:4px;">${cells}</div>
    <div class="btn-secondary" style="margin-top:16px;" onclick="pickMonthDate('${STATE.today}')">오늘로 이동</div>
  </div>`;
  openModal(html);
}

/* ---------- 1b) 수업 추가 (보강/개인레슨 배정 전용 — 시간표는 보기 전용으로 분리) ---------- */
// 결석 처리는 됐지만 아직 보강이 안 잡힌 회원들을 모아 보여주고, 여기서 바로 보강을 배정한다
function setMakeupCoachFilter(c){ STATE.makeupCoachFilter = c; render(); }
function makeupListView(){
  const coachFilter = STATE.makeupCoachFilter || 'all';
  const coaches = activeCoaches();
  const allAbsences = STATE.sessions.filter(s=>s.status==='absent' && !STATE.sessions.some(x=>x.linkedSessionId===s.id));
  const unresolvedAbsences = allAbsences.filter(s=>coachFilter==='all' || s.coachId===coachFilter).sort((a,b)=>b.date.localeCompare(a.date));
  let html = `<div style="padding:14px 18px;">
    <div style="font-size:14px;font-weight:800;margin-bottom:4px;">보강자명단</div>
    <div style="font-size:11px;color:#94a3b8;font-weight:600;margin-bottom:10px;">결석 처리됐지만 아직 보강이 안 잡힌 회원 ${unresolvedAbsences.length}명</div>
    <div style="display:flex;gap:6px;margin-bottom:12px;overflow-x:auto;">
      <div class="chip-select ${coachFilter==='all'?'on':''}" style="${coachFilter==='all'?'':'background:#eef0ff;color:#4338ca;'}" onclick="setMakeupCoachFilter('all')">전체 코치</div>
      ${coaches.map(c=>{
        const cnt = allAbsences.filter(s=>s.coachId===c.id).length;
        return `<div class="chip-select ${coachFilter===c.id?'on':''}" style="${coachFilter===c.id?'':`background:${coachColor(c.id)};color:${coachTextColor(c.id)};`}" onclick="setMakeupCoachFilter('${c.id}')">${c.name}${cnt>0?' '+cnt:''}</div>`;
      }).join('')}
    </div>`;
  if (unresolvedAbsences.length===0) {
    html += `<div style="text-align:center;padding:40px 0;color:#94a3b8;font-size:13px;">보강 배정이 필요한 회원이 없습니다.</div>`;
  } else {
    unresolvedAbsences.forEach(s=>{
      const m = memberById(s.memberId);
      const coach = staffById(s.coachId);
      html += `<div class="m-card" style="display:flex;align-items:center;justify-content:space-between;">
        <div style="min-width:0;">
          <div style="font-size:14px;font-weight:700;">${m?m.name:'-'}</div>
          <div style="font-size:11px;color:#94a3b8;font-weight:600;margin-top:2px;">${s.date} ${s.startTime} 결석 · ${coach?coach.name:'-'} 코치</div>
        </div>
        <span style="font-size:12px;font-weight:800;color:#c2410c;cursor:pointer;flex-shrink:0;" onclick="openMakeupPicker('${s.id}')">보강 배정</span>
      </div>`;
    });
  }
  html += `</div>`;
  return html;
}
function addClassView(){
  const selected = STATE.selectedDate || STATE.today;
  const daySessions = sessionsOnDate(selected);
  const weekday = fromISO(selected).getDay();

  const groups = {};
  daySessions.forEach(s=>{
    const key = s.startTime+'|'+(s.courtId||'_none');
    groups[key] = groups[key] || [];
    groups[key].push(s);
  });

  const sessionHours = [...new Set(daySessions.map(s=>s.startTime))];
  const activeHours = OPERATING_HOURS.filter(t=>STATE.courts.some(c=>(groups[t+'|'+c.id]||[]).length>0));
  const templateHoursToday = OPERATING_HOURS.filter(t=>STATE.classTemplates.some(tp=>tp.weekday===weekday && templateHours(tp).includes(t)));
  const manualExtra = [...((STATE._addClassExtraHours && STATE._addClassExtraHours[selected]) || [])];
  let hours = [...new Set([...activeHours, ...templateHoursToday, ...manualExtra, ...sessionHours])].sort();

  let html = `<div style="padding:14px 18px 6px 18px;">
    <div style="font-size:14px;font-weight:800;margin-bottom:4px;">시간 추가</div>
    <div style="font-size:11px;color:#94a3b8;font-weight:600;">${selected.slice(5).replace('-','월 ')}일(${WD[weekday]}) · 빈 칸에 보강·개인레슨을 배정하거나, 새 시간대를 열어서 정규수업을 넣을 수 있습니다</div>
  </div>`;

  html += `<div style="padding:0 18px 10px 18px;">
    <span style="color:#4f46e5;font-size:12px;font-weight:800;cursor:pointer;" onclick="openAddExtraHourPicker()">+ 시간 추가</span>
  </div>`;

  hours.forEach(t=>{
    html += `<div style="padding:0 18px;">
      <div style="font-size:12px;font-weight:700;color:#0f172a;margin:10px 0 6px 0;">${t}</div>
      <div style="display:grid;grid-template-columns:repeat(${STATE.courts.length},1fr);gap:6px;align-items:stretch;">`;
    STATE.courts.forEach(court=>{
      const key = t+'|'+court.id;
      const list = groups[key] || [];
      const product = list[0] ? productForSession(list[0]) : null;
      const tpl = STATE.classTemplates.find(x=>x.weekday===weekday && x.courtId===court.id && templateHours(x).includes(t));
      const repCoachId = list[0] ? list[0].coachId : (tpl ? tpl.coachId : null);
      const activeCount = list.filter(s=>s.status!=='cancelled' && s.status!=='absent').length;
      const canFillMore = list.length===0 || (product && activeCount < product.capacity);
      html += `<div class="m-card" style="padding:8px;height:100%;box-sizing:border-box;margin-top:0;">
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:6px;gap:4px;border-radius:6px;overflow:hidden;${repCoachId?`background:${coachColor(repCoachId)};`:''}">
          <div style="min-width:0;overflow:hidden;font-size:11px;font-weight:800;white-space:nowrap;text-overflow:ellipsis;padding:2px 0 2px 7px;${repCoachId?`color:${coachTextColor(repCoachId)};`:'color:#0f172a;'}">${court.name}${repCoachId?' · '+staffById(repCoachId).name:''}</div>
          ${list.length>0 ? `<span class="cap-badge" style="font-size:9px;padding:2px 7px;flex-shrink:0;${repCoachId?`background:transparent;color:${coachTextColor(repCoachId)};`:''}">${list.length}${product?'/'+product.capacity:''}</span>` : ''}
        </div>`;
      if (canFillMore) {
        html += `<div style="color:#4f46e5;font-size:10px;font-weight:800;cursor:pointer;margin-top:2px;" onclick="openFillSlotPicker('${selected}','${t}','${court.id}',${repCoachId?`'${repCoachId}'`:'null'})">+ 보강 회원 배정</div>`;
      } else {
        html += `<div style="color:#cbd5e1;font-size:11px;font-weight:600;">정원 마감</div>`;
      }
      html += `<div style="color:#0d9488;font-size:10px;font-weight:800;cursor:pointer;margin-top:4px;" onclick="openBookPersonalSlot(${repCoachId?`'${repCoachId}'`:'null'}, ${weekday}, '${t}', '${selected}')">+ 개인레슨 배정</div>`;
      html += `</div>`;
    });
    html += `</div></div>`;
  });
  return html;

// 잔여석 탭에서 자리수(N자리) 배지를 눌렀을 때 그 요일·시간·코치·상품에 실제로 등록된 회원을 보여준다.

function openSlotMembersList(weekday, time, coachId, productId){
  const slots = STATE.slots.filter(sl=>sl.active && sl.weekday===weekday && sl.productId===productId && (coachId===null || sl.coachId===coachId) && (time===null || sl.time===time));
  const rows = slots.map(sl=>({member: memberById(sl.memberId), slot: sl})).filter(r=>r.member).sort((a,b)=>a.slot.time.localeCompare(b.slot.time));
  const product = productById(productId);
  const coach = coachId ? staffById(coachId) : null;
  const html = `<div class="sheet-handle"></div><div class="sheet-close" onclick="closeModal()">${ICONS.x}</div>
  <div style="padding:6px 20px 20px 20px;">
    <div style="font-size:16px;font-weight:800;margin-bottom:4px;">${WD[weekday]}요일 ${time?time+' · ':''}${coach?coach.name+' · ':''}${product?product.name.split(' ')[0]:''}</div>
    <div style="font-size:12px;color:#94a3b8;font-weight:600;margin-bottom:14px;">현재 수강 중인 회원 ${rows.length}명</div>

        <span style="font-size:11px;color:#94a3b8;font-weight:600;">${staffById(r.slot.coachId)?staffById(r.slot.coachId).name+' · ':''}${courtById(r.slot.courtId)?courtById(r.slot.courtId).name:''}</span>
      </div>`).join('')}
    </div>
  </div>`;
  openModal(html);
}
function setAvailWeekday(i){ STATE.availWeekday = i; render(); }
function setAvailMode(m){ STATE.availMode = m; render(); }
function setAvailTime(t){ STATE.availTime = t; render(); }
function setAvailModeCoach(c){ STATE._availModeCoachId = c; render(); }

function openCoachAvailability(coachId){
  STATE._coachAvailMode = STATE._coachAvailMode || 'week';
  STATE._coachAvailMonth = { year: fromISO(STATE.today).getFullYear(), month: fromISO(STATE.today).getMonth() };
  renderCoachAvailability(coachId);
}
function setCoachAvailMode(coachId, m){ STATE._coachAvailMode = m; renderCoachAvailability(coachId); }
function shiftCoachAvailMonth(coachId, n){
  const mp = STATE._coachAvailMonth;
  let mo = mp.month+n, y = mp.year;
  while (mo>11){ mo-=12; y++; }
  while (mo<0){ mo+=12; y--; }
  mp.month = mo; mp.year = y;
  renderCoachAvailability(coachId);
}
function renderCoachAvailability(coachId){
  const coach = staffById(coachId);
  const mode = STATE._coachAvailMode || 'week';
  const html = `<div class="sheet-handle"></div><div class="sheet-close" onclick="closeModal()">${ICONS.x}</div>
  <div style="padding:6px 20px 20px 20px;">
    <div style="font-size:16px;font-weight:800;margin-bottom:4px;">${coach.name} 코치 — 개인레슨 가능 시간</div>
    <div style="display:flex;gap:6px;margin:10px 0 14px 0;">
      <div class="chip-select ${mode==='week'?'on':''}" onclick="setCoachAvailMode('${coachId}','week')">주간 패턴</div>
      <div class="chip-select ${mode==='month'?'on':''}" onclick="setCoachAvailMode('${coachId}','month')">월간 달력</div>
    </div>
    ${mode==='week' ? coachAvailWeekGridHtml(coachId) : coachAvailMonthGridHtml(coachId)}
  </div>`;
  openModal(html);
}
function coachAvailWeekGridHtml(coachId){
  const slots = STATE.slots.filter(s=>s.coachId===coachId && s.active);
  const busy = {};
  slots.forEach(s=>{ busy[s.weekday] = busy[s.weekday]||new Set(); busy[s.weekday].add(s.time); });
  let grid = `<div style="font-size:12px;color:#94a3b8;font-weight:600;margin-bottom:10px;">정규수업이 없는 요일·시간에 1:1을 배정할 수 있어요 (매주 반복 기준) · "가능" 칸을 누르면 바로 회원을 배정합니다</div>
  <div style="display:grid;grid-template-columns:44px repeat(7,1fr);gap:4px;">
    <div></div>${WD.map(w=>`<div style="text-align:center;font-size:10px;font-weight:700;color:#94a3b8;">${w}</div>`).join('')}`;
  OPERATING_HOURS.forEach(t=>{

function coachAvailMonthGridHtml(coachId){
  const mp = STATE._coachAvailMonth;

  const monthStr = String(mp.month+1).padStart(2,'0');
  const bookedByDate = {};
  STATE.sessions.filter(s=>s.coachId===coachId && s.originType==='package_session' && s.status!=='cancelled').forEach(s=>{

  let cells = '';
  for (let i=0;i<startOffset;i++) cells += `<div></div>`;
  for (let d=1; d<=daysInMonth; d++){

    const count = bookedByDate[iso]||0;

    const isToday = iso===STATE.today;
    cells += `<div onclick="${isPast?'':`openCoachDayAvailability('${coachId}','${iso}')`}" style="height:44px;display:flex;flex-direction:column;align-items:center;justify-content:center;border-radius:10px;cursor:${isPast?'default':'pointer'};${isToday?'background:#eef0ff;':''}opacity:${isPast?'0.4':'1'};">

  </div>
  <div style="display:grid;grid-template-columns:repeat(7,1fr);gap:4px;">${cells}</div>`;

function openCoachDayAvailability(coachId, dateIso){
  const coach = staffById(coachId);
  const weekday = fromISO(dateIso).getDay();
  const regularBusy = new Set();
  STATE.slots.filter(s=>s.coachId===coachId && s.active && s.weekday===weekday).forEach(s=>regularBusy.add(s.time));
  const oneOffBusy = new Set();
  STATE.sessions.filter(s=>s.coachId===coachId && s.date===dateIso && s.status!=='cancelled').forEach(s=>oneOffBusy.add(s.startTime));
  let rows = '';
  OPERATING_HOURS.forEach(t=>{
    const isBusy = regularBusy.has(t) || oneOffBusy.has(t);
    rows += `<div style="display:flex;align-items:center;justify-content:space-between;padding:8px 0;border-top:1px solid #f1f5f9;">
      <span style="font-size:13px;font-weight:700;">${t}</span>
      ${isBusy ? `<span style="font-size:11px;color:#94a3b8;font-weight:700;">사용중</span>` : `<span style="font-size:11px;font-weight:800;color:#4f46e5;cursor:pointer;" onclick="closeModal();openBookPersonalSlot('${coachId}', ${weekday}, '${t}', '${dateIso}')">가능 · 배정하기</span>`}
    </div>`;
  });
  const html = `<div class="sheet-handle"></div><div class="sheet-close" onclick="closeModal()">${ICONS.x}</div>
  <div style="padding:6px 20px 20px 20px;">
    <div style="font-size:16px;font-weight:800;margin-bottom:4px;">${coach.name} 코치 · ${dateIso} (${WD[weekday]})</div>
    <div style="font-size:12px;color:#94a3b8;font-weight:600;margin-bottom:10px;">가능한 시간을 눌러 바로 회원을 배정하세요</div>
    ${rows}
  </div>`;
  openModal(html);
}
function nextDateForWeekday(weekday){
  let d = fromISO(STATE.today);
  while (d.getDay() !== weekday) d = addDays(d, 1);
  return toISO(d);
}
function freeCourtFor(date, time){
  const used = new Set();
  STATE.sessions.filter(s=>s.date===date && s.startTime===time && s.status!=='cancelled' && s.courtId).forEach(s=>used.add(s.courtId));
  STATE.slots.filter(s=>s.active && s.time===time && fromISO(date).getDay()===s.weekday && s.courtId).forEach(s=>used.add(s.courtId));
  return STATE.courts.find(c=>!used.has(c.id));
}

function openMyStatList(kind){

    const myMemberIds = new Set(STATE.slots.filter(s=>s.coachId===myId && s.active).map(s=>s.memberId));
    Object.keys(STATE.packageStatusByMember||{}).forEach(mid=>{ if (STATE.packageStatusByMember[mid].defaultCoachId===myId) myMemberIds.add(mid); });
    title = '담당 회원';

    </div>`;

  }
  if (kind==='makeup') {
    const mySessions = STATE.sessions.filter(s=>s.coachId===myId && s.status==='makeup_scheduled' && s.date>=STATE.today).sort((a,b)=>a.date.localeCompare(b.date));
    const html = `<div class="sheet-handle"></div><div class="sheet-close" onclick="closeModal()">${ICONS.x}</div>

          const m = memberById(s.memberId);

            <span style="font-size:13px;font-weight:700;">${m?m.name:'-'}</span>
            <span style="font-size:11px;color:#94a3b8;font-weight:700;">${s.date} ${s.startTime}</span>
          </div>`;
        }).join('')}
      </div>
    </div>`;
    openModal(html);
    return;
  }
  // attended / absent: 이번 달 수업 세션 목록
  const mySessions = STATE.sessions.filter(s=>s.coachId===myId && s.date.slice(0,7)===thisMonth && s.status===kind).sort((a,b)=>a.date.localeCompare(b.date));
  title = kind==='attended' ? '출석 처리한 수업' : '결석 처리한 수업';
  const html = `<div class="sheet-handle"></div><div class="sheet-close" onclick="closeModal()">${ICONS.x}</div>
  <div style="padding:6px 20px 20px 20px;">
    <div style="font-size:16px;font-weight:800;margin-bottom:4px;">${monthLabel(thisMonth)} ${title} ${mySessions.length}건</div>
    <div style="display:flex;flex-direction:column;gap:6px;margin-top:10px;">
      ${mySessions.length===0 ? `<div style="font-size:13px;color:#94a3b8;">해당 내역이 없습니다.</div>` : mySessions.map(s=>{
        const m = memberById(s.memberId);
        return `<div class="m-card" style="display:flex;align-items:center;justify-content:space-between;cursor:pointer;" onclick="closeModal();openMemberSheet('${s.memberId}')">
          <span style="font-size:13px;font-weight:700;">${m?m.name:'-'}</span>

  openModal(html);

/* ---------- 본인 비밀번호 변경 ---------- */
function openChangePasswordModal(){
  STATE._changePw = { next:'', confirm:'', error:'' };
  renderChangePasswordModal();
}
function changePwField(key, el){ STATE._changePw[key] = el.value; }
function renderChangePasswordModal(){
  const c = STATE._changePw;
  const html = `<div class="sheet-handle"></div><div class="sheet-close" onclick="closeModal()">${ICONS.x}</div>
  <div style="padding:6px 20px 20px 20px;">
    <div style="font-size:16px;font-weight:800;margin-bottom:4px;">비밀번호 변경</div>
    <div style="font-size:12px;color:#94a3b8;font-weight:600;margin-bottom:14px;">${STATE.myName} 계정의 비밀번호를 바꿉니다</div>
    <div class="field-label">새 비밀번호</div>
    <input type="password" value="${c.next}" oninput="changePwField('next', this)" placeholder="4자 이상" />
    <div class="field-label" style="margin-top:12px;">새 비밀번호 확인</div>
    <input type="password" value="${c.confirm}" oninput="changePwField('confirm', this)" onkeydown="if(event.key==='Enter')submitChangePassword()" placeholder="다시 입력" />
    ${c.error ? `<div style="font-size:12px;color:#dc2626;font-weight:700;margin-top:8px;">${c.error}</div>` : ''}
    <div class="btn-primary" style="margin-top:16px;" onclick="submitChangePassword()">변경하기</div>
  </div>`;
  openModal(html);
}
async function submitChangePassword(){
  const c = STATE._changePw;
  if (c.next.length < 6) { c.error='비밀번호는 6자 이상으로 해주세요'; renderChangePasswordModal(); return; }
  if (c.next !== c.confirm) { c.error='두 비밀번호가 서로 다릅니다'; renderChangePasswordModal(); return; }
  const { error } = await sb.auth.updateUser({ password: c.next });
  if (error) { c.error = error.message; renderChangePasswordModal(); return; }
  closeModal();
  toast('비밀번호가 변경되었습니다');
}

async function submitAddTemplate(){
  const t = STATE._newTemplate;
  const isEdit = !!t.editId;
  if (!t.coachId) { toast('코치를 선택하세요'); return; }
  if (t.startTime >= t.endTime) { toast('종료 시간이 시작 시간보다 늦어야 합니다'); return; }
  const hours = templateHours(t);
  const conflictTpl = STATE.classTemplates.find(o=>o.id!==t.editId && o.coachId!==t.coachId && o.weekday===t.weekday && o.courtId===t.courtId && templateHours(o).some(h=>hours.includes(h)));
  if (conflictTpl) {
    toast(`${courtById(t.courtId).name}는 ${WD[t.weekday]}요일 그 시간에 이미 ${staffById(conflictTpl.coachId).name} 코치에게 배정되어 있습니다`);
    return;
  }
  const payload = { coach_id:t.coachId, weekday:t.weekday, start_time:t.startTime, end_time:t.endTime, court_id:t.courtId, product_id:t.productId };
  if (isEdit) {
    const { error } = await sb.from('class_templates').update(payload).eq('id', t.editId);
    if (error) { toast('저장 실패: '+error.message); return; }
  } else {
    const { error } = await sb.from('class_templates').insert(payload);
    if (error) { toast('저장 실패: '+error.message); return; }
  }
  await addLog(null, '', `코트 배정 ${isEdit?'수정':'추가'}: ${staffById(t.coachId).name} 코치 · ${WD[t.weekday]} ${t.startTime}~${t.endTime} · ${courtById(t.courtId).name} · ${productById(t.productId).name}`);
  const { data } = await sb.from('class_templates').select('*');
  STATE.classTemplates = (data||[]).map(templateRowToState);
  closeModal(); render();
  toast(isEdit ? '코트 배정이 수정되었습니다' : '코트가 배정되었습니다');
}

async function submitBulkImport(){

  const lines = (b.text||'').split('\n').map(l=>l.trim()).filter(Boolean);
  if (lines.length===0) { toast('회원 명단을 입력하세요'); return; }
  const product = productById(b.productId);
  if (!product) { toast('수강상품을 선택하세요'); return; }
  if (!b.coachId) { toast('담당 코치를 선택하세요'); return; }
  // 코트는 따로 고르지 않고, 관리자가 "코트 배정"에서 이미 이 코치·요일·시간에 배정해둔 코트를 그대로 사용한다
  const tpl = STATE.classTemplates.find(t=>t.coachId===b.coachId && t.weekday===b.weekday && templateHours(t).includes(b.time));
  if (!tpl) { toast('이 코치는 해당 요일·시간에 배정된 코트가 없습니다 — 설정 > 코트 배정에서 먼저 배정해주세요'); return; }
  const courtId = tpl.courtId;
  let success=0, fail=0;
  const yearMonth = ym(fromISO(STATE.today));
  for (const line of lines) {
    const parts = line.split(/\t|,/).map(x=>x.trim()).filter(Boolean);
    if (parts.length===0) continue;
    const name = parts[0];
    const phone = parts[1] || '';
    try {
      const { data: newMember, error: mErr } = await sb.from('members').insert({ name, phone, status:'active', memo:'' }).select().single();
      if (mErr) { fail++; continue; }
      STATE.members.push(rowToCamel(newMember));
      if (b.autoPay) {
        const discount = computeBundleDiscount(newMember.id, b.productId);
        const { error } = await sb.rpc('add_monthly_slot', {
          p_member_id: newMember.id, p_weekday: b.weekday, p_start_time: b.time, p_coach_id: b.coachId,
          p_product_id: b.productId, p_court_id: courtId, p_year_month: yearMonth, p_amount: product.price, p_method: '계좌이체',
          p_discount: discount
        });
        if (error) { fail++; continue; }
      } else {
        const { error } = await sb.from('member_slots').insert({
          member_id: newMember.id, weekday: b.weekday, start_time: b.time, coach_id: b.coachId, product_id: b.productId, court_id: courtId
        });
        if (error) { fail++; continue; }
      }
      success++;
    } catch(e) { fail++; }
  }
  await refreshAllDataQuiet();
  STATE._bulk.text = '';
  render();
  toast(`${success}명 등록 완료${fail>0?`, ${fail}명 실패`:''}`);
}

function reportsView(){
  const reportMonth = STATE.reportMonth || ym(fromISO(STATE.today));
  const paidEnrs = STATE.enrollments.filter(e=>e.yearMonth===reportMonth && e.paymentStatus==='paid');
  const pkgThisMonth = STATE.packages.filter(p=>p.purchasedAt && p.purchasedAt.slice(0,7)===reportMonth);
  const totalRevenue = paidEnrs.reduce((a,e)=>a+(e.paymentAmount||0),0) + pkgThisMonth.reduce((a,p)=>a+(p.paymentAmount||0),0);

  const byCoach = {};
  paidEnrs.forEach(e=>{ const slot=slotById(e.slotId); if(!slot) return; byCoach[slot.coachId]=(byCoach[slot.coachId]||0)+(e.paymentAmount||0); });
  pkgThisMonth.forEach(p=>{ byCoach[p.defaultCoachId]=(byCoach[p.defaultCoachId]||0)+(p.paymentAmount||0); });

  const byProduct = {};
  paidEnrs.forEach(e=>{ byProduct[e.productId]=(byProduct[e.productId]||0)+(e.paymentAmount||0); });
  pkgThisMonth.forEach(p=>{ byProduct[p.productId]=(byProduct[p.productId]||0)+(p.paymentAmount||0); });

  const byMethod = {};
  paidEnrs.forEach(e=>{ const k=e.paymentMethod||'미지정'; byMethod[k]=(byMethod[k]||0)+(e.paymentAmount||0); });
  pkgThisMonth.forEach(p=>{ const k=p.paymentMethod||'미지정'; byMethod[k]=(byMethod[k]||0)+(p.paymentAmount||0); });

  const trend = [];
  for (let i=5;i>=0;i--) {
    const mth = addMonths(ym(fromISO(STATE.today)), -i);
    const amt = STATE.enrollments.filter(e=>e.yearMonth===mth && e.paymentStatus==='paid').reduce((a,e)=>a+(e.paymentAmount||0),0)
              + STATE.packages.filter(p=>p.purchasedAt && p.purchasedAt.slice(0,7)===mth).reduce((a,p)=>a+(p.paymentAmount||0),0);
    trend.push({mth, amt});
  }
  const maxTrend = Math.max(1, ...trend.map(t=>t.amt));

  let html = `<div style="padding:4px 18px 18px 18px;">
    <div style="display:flex;align-items:center;justify-content:center;gap:12px;margin-bottom:14px;">
      <span onclick="shiftReportMonth(-1)" style="cursor:pointer;">${ICONS.chevL}</span>
      <span style="font-size:14px;font-weight:800;">${monthLabel(reportMonth)} 매출</span>
      <span onclick="shiftReportMonth(1)" style="cursor:pointer;">${ICONS.chevR}</span>
    </div>
    <div class="m-card" style="text-align:center;">
      <div style="font-size:11px;font-weight:700;color:#94a3b8;">이 달 총 매출</div>
      <div style="font-size:24px;font-weight:800;margin-top:4px;">${totalRevenue.toLocaleString()}원</div>
    </div>

    <div style="font-size:12px;font-weight:700;color:#94a3b8;margin:16px 0 8px 0;">코치별 매출</div>`;
  const coachEntries = Object.keys(byCoach).sort((a,b)=>byCoach[b]-byCoach[a]);
  if (coachEntries.length===0) html += `<div style="font-size:13px;color:#94a3b8;">이 달 매출 내역이 없습니다.</div>`;
  coachEntries.forEach(cid=>{
    html += `<div class="m-card" style="display:flex;align-items:center;justify-content:space-between;">
      <span style="font-size:13px;font-weight:700;">${staffById(cid)?staffById(cid).name+' 코치':'미지정'}</span>
      <span style="font-size:13px;font-weight:800;">${byCoach[cid].toLocaleString()}원</span>
    </div>`;
  });

  html += `<div style="font-size:12px;font-weight:700;color:#94a3b8;margin:16px 0 8px 0;">수업(상품)별 매출</div>`;
  Object.keys(byProduct).sort((a,b)=>byProduct[b]-byProduct[a]).forEach(pid=>{
    html += `<div class="m-card" style="display:flex;align-items:center;justify-content:space-between;">
      <span style="font-size:13px;font-weight:700;">${productById(pid)?productById(pid).name:'-'}</span>
      <span style="font-size:13px;font-weight:800;">${byProduct[pid].toLocaleString()}원</span>
    </div>`;
  });

  html += `<div style="font-size:12px;font-weight:700;color:#94a3b8;margin:16px 0 8px 0;">결제수단별 내역</div>`;
  Object.keys(byMethod).forEach(k=>{
    html += `<div class="m-card" style="display:flex;align-items:center;justify-content:space-between;">
      <span style="font-size:13px;font-weight:700;">${k}</span>
      <span style="font-size:13px;font-weight:800;">${byMethod[k].toLocaleString()}원</span>
    </div>`;
  });

  html += `<div style="font-size:12px;font-weight:700;color:#94a3b8;margin:16px 0 8px 0;">최근 6개월 추이</div><div class="m-card">`;
  trend.forEach(t=>{
    const pct = Math.round((t.amt/maxTrend)*100);
    html += `<div style="display:flex;align-items:center;gap:10px;padding:5px 0;">
      <div style="font-size:11px;font-weight:700;width:52px;color:#64748b;">${t.mth.slice(5)}월</div>
      <div class="gauge"><div style="width:${pct}%;background:#4f46e5;"></div></div>
      <div style="font-size:11px;font-weight:700;width:76px;text-align:right;">${t.amt.toLocaleString()}원</div>
    </div>`;
  });
  html += `</div></div>`;
  return html;
}

// 회원 상세의 "9월 수업 현황" 통계 타일들 — 총수업/출석/결석/예정/보강예정을 눌렀을 때 그 날짜 목록을 보여준다.
// kind==='makeup'인 경우는 이미 잡힌 보강 날짜뿐 아니라, 아직 보강 배정이 안 된 결석 건도 같이 보여주고 바로 배정할 수 있게 한다.
const MEMBER_STAT_KIND_LABEL = { all:'전체 수업', attended:'출석일', absent:'결석일', scheduled:'예정일', makeup:'보강' };
function openMemberStatDatesList(memberId, kind){
  const m = memberById(memberId);
  const thisMonth = ym(fromISO(STATE.today));
  const monthSessions = STATE.sessions.filter(s=>s.memberId===memberId && s.date.slice(0,7)===thisMonth);
  let html = `<div class="sheet-handle"></div><div class="sheet-close" onclick="closeModal()">${ICONS.x}</div>
  <div style="padding:6px 20px 20px 20px;">
    <div style="font-size:16px;font-weight:800;margin-bottom:4px;">${m?m.name:''} · ${monthLabel(thisMonth)} ${MEMBER_STAT_KIND_LABEL[kind]}</div>`;

  if (kind==='makeup') {
    const scheduled = monthSessions.filter(s=>s.status==='makeup_scheduled').sort((a,b)=>a.date.localeCompare(b.date));
    const unresolved = STATE.sessions.filter(s=>s.memberId===memberId && s.status==='absent' && !STATE.sessions.some(x=>x.linkedSessionId===s.id)).sort((a,b)=>a.date.localeCompare(b.date));
    html += `<div style="font-size:12px;color:#94a3b8;font-weight:600;margin-bottom:14px;">잡힌 보강 ${scheduled.length}건 · 보강 대기 중인 결석 ${unresolved.length}건</div>
    <div style="display:flex;flex-direction:column;gap:6px;">`;
    if (unresolved.length===0 && scheduled.length===0) html += `<div style="font-size:13px;color:#94a3b8;">보강 관련 내역이 없습니다.</div>`;
    unresolved.forEach(s=>{
      html += `<div class="m-card" style="display:flex;align-items:center;justify-content:space-between;">
        <span style="font-size:13px;font-weight:700;">${s.date} (${WD[fromISO(s.date).getDay()]}) ${s.startTime} 결석</span>
        <span style="font-size:12px;font-weight:800;color:#c2410c;cursor:pointer;" onclick="closeModal();openMakeupPicker('${s.id}')">보강 배정</span>
      </div>`;
    });
    scheduled.forEach(s=>{
      html += `<div class="m-card" style="display:flex;align-items:center;justify-content:space-between;">
        <span style="font-size:13px;font-weight:700;">${s.date} (${WD[fromISO(s.date).getDay()]}) ${s.startTime}</span>
        <span class="status-badge st-makeup_scheduled">${statusIcon('makeup_scheduled')}${STATUS_LABEL.makeup_scheduled}</span>
      </div>`;
    });
    html += `</div></div>`;
    openModal(html);
    return;
  }

  const statusFilter = kind==='all' ? null : (kind==='attended' ? 'attended' : (kind==='absent' ? 'absent' : 'scheduled'));
  const dates = (statusFilter ? monthSessions.filter(s=>s.status===statusFilter) : monthSessions).sort((a,b)=>a.date.localeCompare(b.date));
  html += `<div style="font-size:12px;color:#94a3b8;font-weight:600;margin-bottom:14px;">${dates.length}건</div>
  <div style="display:flex;flex-direction:column;gap:6px;">`;
  if (dates.length===0) html += `<div style="font-size:13px;color:#94a3b8;">해당 내역이 없습니다.</div>`;
  dates.forEach(s=>{
    html += `<div class="m-card" style="display:flex;align-items:center;justify-content:space-between;">
      <span style="font-size:13px;font-weight:700;">${s.date} (${WD[fromISO(s.date).getDay()]}) ${s.startTime}</span>
      <span class="status-badge st-${s.status}">${statusIcon(s.status)}${STATUS_LABEL[s.status]}</span>
    </div>`;
  });
  html += `</div></div>`;
  openModal(html);
}

    </div>`;
  });
  html += `</div></div>`;
  openModal(html);

function openMemberSheet(memberId){
  const m = memberById(memberId); const slots = slotsOfMember(memberId); const hasPkg = memberHasPackage(memberId);
  const thisMonth = ym(fromISO(STATE.today));
  const all = STATE.sessions.filter(s=>s.memberId===memberId && s.date.slice(0,7)===thisMonth);
  const attended = all.filter(s=>s.status==='attended').length;
  const absent = all.filter(s=>s.status==='absent').length;
  const scheduled = all.filter(s=>s.status==='scheduled').length;
  const makeupSched = all.filter(s=>s.status==='makeup_scheduled').length;
  const makeupDone = all.filter(s=>s.status==='makeup_completed').length;

  let html = `<div class="sheet-handle"></div><div class="sheet-close" onclick="closeModal()">${ICONS.x}</div>
  <div style="padding:6px 20px 4px 20px;display:flex;align-items:center;gap:12px;">
    <div style="width:48px;height:48px;border-radius:50%;background:#4f46e5;color:#fff;display:flex;align-items:center;justify-content:center;font-size:17px;font-weight:800;">${m.name[0]}</div>
    <div>
      <div style="font-size:17px;font-weight:800;">${m.name}</div>
      <div style="display:flex;align-items:center;gap:6px;margin-top:3px;">${ICONS.phone}<span style="font-size:12px;color:#64748b;font-weight:600;">${m.phone||'-'}</span></div>
    </div>
  </div>
  <div style="padding:14px 20px 20px 20px;">`;

  if (slots.length>0) {
    html += `<div style="font-size:12px;font-weight:700;color:#94a3b8;margin-bottom:8px;">정규수업 등록 ${slots.length}건</div>`;
    slots.forEach(slot=>{
      const coach = staffById(slot.coachId), product = productById(slot.productId);
      const paid = getSlotPaidStatus(slot.id, thisMonth);
      html += `<div class="m-card" style="margin-bottom:10px;">
        <div style="display:flex;align-items:center;justify-content:space-between;">
          <div style="font-size:13px;font-weight:800;">${WD[slot.weekday]} ${slot.time} · ${coach?coach.name:'-'} 코치</div>
          <span class="avail-pill" style="background:${paid?'#f0fdf4':'#fef2f2'};color:${paid?'#15803d':'#b91c1c'};">${paid?'이번달 등록완료':'이번달 미등록'}</span>
        </div>
        <div class="row-label" style="margin-top:6px;">${product?product.name:''}</div>`;
      if (isOwner()) {
        const enr = STATE.enrollments.find(e=>e.slotId===slot.id && e.yearMonth===thisMonth);
        if (enr) {
          html += `<div style="background:#fdf4ff;border:1px solid #f3e8ff;border-radius:10px;padding:10px 12px;margin-top:10px;">
            <div style="display:flex;align-items:center;gap:6px;margin-bottom:6px;">${ICONS.lock}<span style="font-size:10px;font-weight:800;color:#7e22ce;">결제 정보 (관리자 전용)</span></div>
            <div style="display:flex;justify-content:space-between;padding:2px 0;"><span class="row-label">결제금액</span><span class="row-value">${enr.paymentAmount?enr.paymentAmount.toLocaleString()+'원':'-'}${enr.discount?` <span style="color:#dc2626;">-${enr.discount.toLocaleString()}원</span>`:''}</span></div>
            ${enr.discount ? `<div style="display:flex;justify-content:space-between;padding:2px 0;"><span class="row-label">실 결제액</span><span class="row-value" style="color:#7e22ce;">${(enr.paymentAmount-enr.discount).toLocaleString()}원</span></div>` : ''}
            <div style="display:flex;justify-content:space-between;padding:2px 0;"><span class="row-label">결제일</span><span class="row-value">${enr.paymentDate||'-'}</span></div>
            ${enr.paymentMethod ? `<div style="display:flex;justify-content:space-between;padding:2px 0;"><span class="row-label">결제수단</span><span class="row-value">${enr.paymentMethod}${enr.cardCompany?' · '+enr.cardCompany:''}</span></div>` : ''}
          </div>`;
        }
      }
      html += `<div class="btn-secondary" style="margin-top:10px;" onclick="openEditSlotForm('${slot.id}')">이 수업 기본시간 변경</div>
      </div>`;
    });

    html += `<div style="font-size:12px;font-weight:700;color:#94a3b8;margin:14px 0 8px 0;">${monthLabel(thisMonth)} 수업 현황</div>
    <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:8px;">
      <div class="stat-tile" style="cursor:pointer;" onclick="openMemberStatDatesList('${memberId}','all')"><div style="font-size:16px;font-weight:800;">${all.length}</div><div style="font-size:10px;color:#94a3b8;font-weight:700;margin-top:2px;">총 수업</div></div>
      <div class="stat-tile" style="cursor:pointer;" onclick="openMemberStatDatesList('${memberId}','attended')"><div style="font-size:16px;font-weight:800;color:#15803d;">${attended}</div><div style="font-size:10px;color:#94a3b8;font-weight:700;margin-top:2px;">출석</div></div>
      <div class="stat-tile" style="cursor:pointer;" onclick="openMemberStatDatesList('${memberId}','absent')"><div style="font-size:16px;font-weight:800;color:#b91c1c;">${absent}</div><div style="font-size:10px;color:#94a3b8;font-weight:700;margin-top:2px;">결석</div></div>
      <div class="stat-tile" style="cursor:pointer;" onclick="openMemberStatDatesList('${memberId}','scheduled')"><div style="font-size:16px;font-weight:800;color:#1d4ed8;">${scheduled}</div><div style="font-size:10px;color:#94a3b8;font-weight:700;margin-top:2px;">예정</div></div>
      <div class="stat-tile" style="cursor:pointer;" onclick="openMemberStatDatesList('${memberId}','makeup')"><div style="font-size:16px;font-weight:800;color:#c2410c;">${makeupSched}</div><div style="font-size:10px;color:#94a3b8;font-weight:700;margin-top:2px;">보강예정</div></div>
      <div class="stat-tile"><div style="font-size:16px;font-weight:800;color:#0f766e;">${makeupDone}</div><div style="font-size:10px;color:#94a3b8;font-weight:700;margin-top:2px;">보강완료</div></div>
    </div>`;
    if (m.memo) {
      html += `<div style="background:#fffbeb;border:1px solid #fde68a;border-radius:12px;padding:12px 14px;margin-top:14px;">
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:6px;">
          <span style="font-size:11px;font-weight:800;color:#b45309;">특이사항 메모</span>
          ${isOwner() ? `<span style="font-size:11px;font-weight:700;color:#b45309;cursor:pointer;text-decoration:underline;" onclick="openEditMemberMemo('${memberId}')">수정</span>` : ''}
        </div>
        <div style="font-size:13px;color:#78350f;font-weight:500;">${m.memo}</div>
      </div>`;
    } else if (isOwner()) {
      html += `<div style="margin-top:14px;"><div class="btn-secondary" onclick="openEditMemberMemo('${memberId}')">+ 특이사항 메모 추가</div></div>`;
    }
    html += `<div style="display:flex;gap:8px;margin-top:16px;">
      ${isOwner() ? `<div class="btn-secondary" style="flex:1;" onclick="closeModal();openAddSlotForm('${memberId}')">정규수업 추가 등록</div>
      <div class="btn-secondary" style="flex:1;" onclick="openMemberFullHistory('${memberId}')">전체 이력 보기</div>` : ''}
    </div>`;
  } else if (hasPkg) {
    const disp = getPackageDisplay(memberId);
    const coach = staffById(disp.coachId);
    html += `<div style="display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap;">
      <span class="avail-pill" style="background:#f0fdfa;color:#0f766e;">개인레슨 · ${coach?coach.name:'-'}</span>
      <span class="avail-pill" style="background:#eef0ff;color:#4338ca;">잔여 ${disp.remaining}/${disp.total}회</span>
    </div>`;
    if (isOwner()) {
      html += `<div style="background:#fdf4ff;border:1px solid #f3e8ff;border-radius:12px;padding:12px 14px;margin-top:6px;">
        <div style="display:flex;align-items:center;gap:6px;margin-bottom:8px;">${ICONS.lock}<span style="font-size:11px;font-weight:800;color:#7e22ce;">결제 정보 (관리자 전용)</span></div>
        <div style="display:flex;justify-content:space-between;padding:3px 0;"><span class="row-label">결제금액</span><span class="row-value">${disp.amount?disp.amount.toLocaleString()+'원':'-'}</span></div>
        <div style="display:flex;justify-content:space-between;padding:3px 0;"><span class="row-label">결제수단</span><span class="row-value">${disp.method||'-'}</span></div>
      </div>`;
    }
    html += `<div class="btn-primary" style="margin-top:16px;" onclick="closeModal();openPackageBookingPicker('${memberId}')">레슨 세션 추가 예약</div>`;
  } else {
    html += `<div style="font-size:13px;color:#94a3b8;">등록된 수업이 없습니다.</div>`;
  }
  html += `</div>`;
  openModal(html);
}

  const disp = getPackageDisplay(memberId);
  let html = `<div class="sheet-handle"></div><div class="sheet-close" onclick="closeModal()">${ICONS.x}</div>
  <div style="padding:6px 20px 20px 20px;">
    <div style="font-size:16px;font-weight:800;margin-bottom:14px;">개인레슨 세션 추가 (잔여 ${disp?disp.remaining:'-'}회)</div>
    <div class="field-label">날짜</div>
    <input type="date" id="pk_date" value="${toISO(addDays(fromISO(STATE.today),1))}" />

    <select id="pk_time"><option>18:00</option><option selected>19:00</option><option>20:00</option><option>21:00</option></select>

function openEditSlotForm(slotId){
  const slot = slotById(slotId);
  STATE._slotEdit = {slotId, weekday: slot.weekday, time: slot.time, coachId: slot.coachId, courtId: slot.courtId};
  renderSlotEditor();
}
function slotEditField(key, val){ STATE._slotEdit[key] = val; renderSlotEditor(); }
function renderSlotEditor(){
  const se = STATE._slotEdit;
  const coaches = activeCoaches();
  const html = `<div class="sheet-handle"></div><div class="sheet-close" onclick="closeModal()">${ICONS.x}</div>
  <div style="padding:6px 20px 20px 20px;">
    <div style="font-size:16px;font-weight:800;margin-bottom:14px;">기본 수업시간 변경</div>
    <div class="field-label">요일</div>
    <div style="display:flex;gap:6px;flex-wrap:wrap;">${WD.map((d,i)=>`<div class="chip-select ${se.weekday===i?'on':''}" onclick="slotEditField('weekday',${i})">${d}</div>`).join('')}</div>
    <div class="field-label" style="margin-top:12px;">시간</div>
    <div style="display:flex;gap:6px;flex-wrap:wrap;">${OPERATING_HOURS.map(t=>`<div class="chip-select ${se.time===t?'on':''}" onclick="slotEditField('time','${t}')">${t}</div>`).join('')}</div>
    <div class="field-label" style="margin-top:12px;">담당 코치</div>
    <div style="display:flex;gap:6px;flex-wrap:wrap;">${coaches.map(c=>`<div class="chip-select ${se.coachId===c.id?'on':''}" onclick="slotEditField('coachId','${c.id}')">${c.name}</div>`).join('')}</div>
    <div class="field-label" style="margin-top:12px;">코트</div>
    <select onchange="slotEditField('courtId', this.value)">${STATE.courts.map(c=>`<option value="${c.id}" ${c.id===se.courtId?'selected':''}>${c.name}</option>`).join('')}</select>
    <div style="background:#fffbeb;border:1px solid #fde68a;border-radius:12px;padding:12px;font-size:11px;color:#92400e;margin-top:14px;line-height:1.6;">
      앞으로 계속 이 요일·시간·코치로 바뀝니다. 이미 생성된 이번 달 수업은 그대로 유지되고, 다음 결제완료 시부터 새 시간으로 생성됩니다.

    <div class="btn-primary" style="margin-top:16px;" onclick="updateSlotDefaults('${se.slotId}', ${se.weekday}, '${se.time}', '${se.coachId}', '${se.courtId}')">기본 수업시간 저장</div>
  </div>`;
  openModal(html);
}

function openAddSlotForm(memberId){
  STATE._addSlot = {memberId, weekday:2, time:'19:00', coachId:(activeCoaches()[0]||{}).id, productId:(STATE.products.find(p=>p.mode==='monthly')||{}).id, courtId: STATE.courts[0]?.id};
  renderAddSlotForm();
}
function addSlotField(key, val){ STATE._addSlot[key]=val; renderAddSlotForm(); }
