  const a = STATE._addSlot;
  const m = memberById(a.memberId);
  const coaches = activeCoaches();
  const products = STATE.products.filter(p=>p.mode==='monthly');
  const html = `<div class="sheet-handle"></div><div class="sheet-close" onclick="closeModal()">${ICONS.x}</div>
  <div style="padding:6px 20px 20px 20px;">
    <div style="font-size:16px;font-weight:800;margin-bottom:4px;">정규수업 추가 등록</div>
    <div style="font-size:12px;color:#94a3b8;font-weight:600;margin-bottom:14px;">${m.name} 회원 — 이미 있는 등록과 별개로 새 슬롯이 추가됩니다</div>
    <div class="field-label">요일</div>
    <div style="display:flex;gap:6px;flex-wrap:wrap;">${WD.map((d,i)=>`<div class="chip-select ${a.weekday===i?'on':''}" onclick="addSlotField('weekday',${i})">${d}</div>`).join('')}</div>
    <div class="field-label" style="margin-top:12px;">시간</div>
    <div style="display:flex;gap:6px;flex-wrap:wrap;">${OPERATING_HOURS.map(t=>`<div class="chip-select ${a.time===t?'on':''}" onclick="addSlotField('time','${t}')">${t}</div>`).join('')}</div>
    <div class="field-label" style="margin-top:12px;">담당 코치</div>
    <div style="display:flex;gap:6px;flex-wrap:wrap;">${coaches.map(c=>`<div class="chip-select ${a.coachId===c.id?'on':''}" onclick="addSlotField('coachId','${c.id}')">${c.name}</div>`).join('')}</div>
    <div class="field-label" style="margin-top:12px;">수강상품</div>
    <div style="display:flex;flex-direction:column;gap:8px;">${products.map(p=>{
      const disc = computeBundleDiscount(a.memberId, p.id);
      return `<div class="choice-card ${a.productId===p.id?'picked':''}" style="padding:12px 14px;" onclick="addSlotField('productId','${p.id}')">
        <div style="flex:1;"><div style="font-size:13px;font-weight:800;">${p.name}</div><div style="font-size:12px;color:#64748b;font-weight:600;margin-top:2px;">${p.price.toLocaleString()}원 / 월${disc?` <span style="color:#dc2626;">-${disc.toLocaleString()}원 주2회할인</span>`:''}</div></div>
        ${a.productId===p.id?ICONS.check.replace(/width="12" height="12"/,'width="16" height="16"').replace('currentColor','#4f46e5'):''}
      </div>`;}).join('')}</div>
    <div class="field-label" style="margin-top:12px;">코트</div>
    <select onchange="addSlotField('courtId', this.value)">${STATE.courts.map(c=>`<option value="${c.id}" ${c.id===a.courtId?'selected':''}>${c.name}</option>`).join('')}</select>
    <div class="btn-primary" style="margin-top:18px;" onclick="addMonthlySlot('${a.memberId}', ${a.weekday}, '${a.time}', '${a.coachId}', '${a.productId}', '${a.courtId}')">결제완료 처리 → 시간표 자동 등록</div>
  </div>`;
  openModal(html);
}

/* ---------- 신규회원 등록 위저드 (관리자 전용) ---------- */
function openNewMemberWizard(){
  const defaultCoachId = (!isOwner() && STATE.myStaffId) ? STATE.myStaffId : (activeCoaches()[0]||{}).id;
  STATE._wizard = {step:1, mode:'monthly', name:'', phone:'', weekday:2, time:'19:00',
    coachId:defaultCoachId, productId:(STATE.products.find(p=>p.mode==='monthly')||{}).id, courtId: STATE.courts[0]?.id,
    packageCoachId:defaultCoachId, paid:false, payMethod:'계좌이체', cardCompany:'', expectedReceivedBy:defaultCoachId, expectedTransferName:''};
  renderWizard();
}
function wz(){ return STATE._wizard; }
function wizardNext(){ if (wz().step===1 && !wz().name.trim()) return; wz().step++; renderWizard(); }
function wizardBack(){ wz().step--; if (wz().step<1){ closeModal(); return; } renderWizard(); }
function wizardSetMode(mode){ wz().mode = mode; renderWizard(); }
function wizardField(key, val){ wz()[key] = val; renderWizard(); }
function wizardInput(key, el){
  wz()[key] = el.value;
  const id = el.id, pos = el.selectionStart;
  renderWizard();
  const ne = document.getElementById(id);
  if (ne) { ne.focus(); try { ne.selectionStart = ne.selectionEnd = pos; } catch(e){} }
}

function renderWizard(){
  const w = wz();
  const dots = `<div style="display:flex;align-items:center;gap:6px;"><span class="step-dot ${w.step>=1?'done':''}"></span><span class="step-dot ${w.step>=2?'done':''}"></span><span class="step-dot ${w.step>=3?'done':''}"></span><span style="font-size:11px;color:#94a3b8;font-weight:700;margin-left:6px;">${w.step} / 3</span></div>`;
  let body = '';
  if (w.step===1) {
    body = `
    <div>
      <div class="field-label">이름</div>
      <input id="wz_name" type="text" value="${w.name}" oninput="wizardInput('name', this)" placeholder="예: 김하늘" />
    </div>
    <div style="margin-top:12px;">
      <div class="field-label">연락처</div>
      <input id="wz_phone" type="tel" value="${w.phone}" oninput="wizardInput('phone', this)" placeholder="010-0000-0000" />
    </div>
    <div style="margin-top:18px;">
      <div class="field-label" style="margin-bottom:10px;">수업 방식을 선택하세요</div>
      <div style="display:flex;flex-direction:column;gap:10px;">
        <div class="choice-card ${w.mode==='monthly'?'picked':''}" onclick="wizardSetMode('monthly')">
          ${ICONS.calendar.replace('currentColor', w.mode==='monthly'?'#4f46e5':'#64748b')}
          <div style="flex:1;"><div style="font-size:14px;font-weight:800;">정규수업 (월정기)</div><div style="font-size:12px;color:#64748b;margin-top:3px;">매주 같은 요일·시간 · 1:4 / 1:2 레슨</div></div>
          ${w.mode==='monthly'?ICONS.check.replace(/width="12" height="12"/,'width="18" height="18"').replace('currentColor','#4f46e5'):''}
        </div>
        <div class="choice-card ${w.mode==='package'?'picked':''}" onclick="wizardSetMode('package')">
          ${ICONS.ticket.replace('currentColor', w.mode==='package'?'#4f46e5':'#64748b')}
          <div style="flex:1;"><div style="font-size:14px;font-weight:800;">개인레슨 (1:1)</div><div style="font-size:12px;color:#64748b;margin-top:3px;">고정 요일 없이 회차권 구매 · 건별 예약</div></div>
          ${w.mode==='package'?ICONS.check.replace(/width="12" height="12"/,'width="18" height="18"').replace('currentColor','#4f46e5'):''}
        </div>
      </div>
    </div>`;
  } else if (w.step===2 && w.mode==='monthly') {
    const coaches = activeCoaches();
    const products = STATE.products.filter(p=>p.mode==='monthly');
    body = `
    <div class="field-label">기본 요일</div>
    <div style="display:flex;gap:6px;flex-wrap:wrap;">${WD.map((d,i)=>`<div class="chip-select ${w.weekday===i?'on':''}" onclick="wizardField('weekday',${i})">${d}</div>`).join('')}</div>
    <div class="field-label" style="margin-top:14px;">기본 시간</div>
    <div style="display:flex;gap:6px;flex-wrap:wrap;">${OPERATING_HOURS.map(t=>`<div class="chip-select ${w.time===t?'on':''}" onclick="wizardField('time','${t}')">${t}</div>`).join('')}</div>
    <div class="field-label" style="margin-top:14px;">담당 코치</div>
    <div style="display:flex;gap:6px;flex-wrap:wrap;">${coaches.map(c=>`<div class="chip-select ${w.coachId===c.id?'on':''}" onclick="wizardField('coachId','${c.id}')">${c.name}</div>`).join('')}</div>
    <div class="field-label" style="margin-top:14px;">코트</div>
    <select onchange="wizardField('courtId', this.value)">${STATE.courts.map(c=>`<option value="${c.id}" ${c.id===w.courtId?'selected':''}>${c.name}</option>`).join('')}</select>
    <div class="field-label" style="margin-top:14px;">수강상품</div>
    <div style="display:flex;flex-direction:column;gap:8px;">${products.map(p=>`
      <div class="choice-card ${w.productId===p.id?'picked':''}" style="padding:12px 14px;" onclick="wizardField('productId','${p.id}')">
        <div style="flex:1;"><div style="font-size:13px;font-weight:800;">${p.name}</div><div style="font-size:12px;color:#64748b;font-weight:600;margin-top:2px;">${p.price.toLocaleString()}원 / 월</div></div>
        ${w.productId===p.id?ICONS.check.replace(/width="12" height="12"/,'width="16" height="16"').replace('currentColor','#4f46e5'):''}
      </div>`).join('')}</div>`;
  } else if (w.step===2 && w.mode==='package') {
    const coaches = activeCoaches();
    const product = STATE.products.find(p=>p.mode==='session_pack');
    body = `
    <div class="field-label">담당 코치</div>
    <div style="display:flex;gap:6px;flex-wrap:wrap;">${coaches.map(c=>`<div class="chip-select ${w.packageCoachId===c.id?'on':''}" onclick="wizardField('packageCoachId','${c.id}')">${c.name}</div>`).join('')}</div>
    <div class="field-label" style="margin-top:14px;">상품</div>
    ${product ? `<div class="choice-card picked" style="padding:12px 14px;">
      <div style="flex:1;"><div style="font-size:13px;font-weight:800;">${product.name}</div><div style="font-size:12px;color:#64748b;font-weight:600;margin-top:2px;">${product.price.toLocaleString()}원</div></div>
      ${ICONS.check.replace(/width="12" height="12"/,'width="16" height="16"').replace('currentColor','#4f46e5')}
    </div>` : `<div style="font-size:13px;color:#94a3b8;">개인레슨 상품이 아직 없습니다. 설정 &gt; 상품 관리에서 먼저 추가해주세요.</div>`}`;
  } else if (w.step===3) {
    const isMonthly = w.mode==='monthly';
    const product = isMonthly ? productById(w.productId) : STATE.products.find(p=>p.mode==='session_pack');
    const coach = isMonthly ? staffById(w.coachId) : staffById(w.packageCoachId);
    body = `
    <div class="m-card">
      <div style="display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid #f1f5f9;"><span class="row-label">이름</span><span class="row-value">${w.name||'-'}</span></div>
      ${isMonthly ? `<div style="display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid #f1f5f9;"><span class="row-label">요일/시간</span><span class="row-value">${WD[w.weekday]} ${w.time}</span></div>` : ''}
      <div style="display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid #f1f5f9;"><span class="row-label">담당코치</span><span class="row-value">${coach?coach.name:'-'}</span></div>
      <div style="display:flex;justify-content:space-between;padding:6px 0;${isMonthly?'border-bottom:1px solid #f1f5f9;':''}"><span class="row-label">상품</span><span class="row-value">${product?product.name:'-'}</span></div>
      ${isMonthly ? `<div style="display:flex;justify-content:space-between;padding:6px 0;"><span class="row-label">금액</span><span class="row-value">${product?product.price.toLocaleString():0}원</span></div>` : ''}
    </div>
    ${isMonthly ? (isOwner() ? `
    <div class="field-label" style="margin-top:14px;">입금 상태</div>
    <div style="display:flex;gap:6px;">
      <div class="chip-select ${!w.paid?'on':''}" onclick="wizardField('paid', false)">미입금 (입금대기중)</div>
      <div class="chip-select ${w.paid?'on':''}" onclick="wizardField('paid', true)">입금완료</div>
    </div>
    ${w.paid ? `
    <div class="field-label" style="margin-top:12px;">결제수단</div>
    <div style="display:flex;gap:6px;flex-wrap:wrap;">
      <div class="chip-select ${w.payMethod==='계좌이체'?'on':''}" onclick="wizardField('payMethod','계좌이체')">계좌이체</div>
      <div class="chip-select ${w.payMethod==='카드'?'on':''}" onclick="wizardField('payMethod','카드')">카드결제</div>
      <div class="chip-select ${w.payMethod==='현장결제'?'on':''}" onclick="wizardField('payMethod','현장결제')">현장결제</div>
    </div>
    ${w.payMethod==='카드' ? `
    <div class="field-label" style="margin-top:12px;">카드사</div>
    <select onchange="wizardField('cardCompany', this.value)">
      <option value="">선택 안함</option>
      ${CARD_COMPANIES.map(c=>`<option value="${c}" ${w.cardCompany===c?'selected':''}>${c}</option>`).join('')}
    </select>` : ''}
    ` : ''}
    <div style="font-size:11px;color:#94a3b8;margin-top:10px;line-height:1.6;">${w.paid ? `결제완료 처리 즉시 ${ym(fromISO(STATE.today))} 시간표에 자동 등록됩니다` : '가등록으로 자리는 지금 바로 배정되고, 시간표 생성은 결제관리에서 입금 확인 후 처리됩니다'}</div>`
    : `
    <div class="field-label" style="margin-top:14px;">예상 결제수단</div>
    <div style="display:flex;gap:6px;flex-wrap:wrap;">
      <div class="chip-select ${w.payMethod==='계좌이체'?'on':''}" onclick="wizardField('payMethod','계좌이체')">계좌이체</div>
      <div class="chip-select ${w.payMethod==='카드'?'on':''}" onclick="wizardField('payMethod','카드')">카드결제</div>
      <div class="chip-select ${w.payMethod==='현장결제'?'on':''}" onclick="wizardField('payMethod','현장결제')">현장결제</div>
    </div>
    ${w.payMethod==='카드' ? `
    <div class="field-label" style="margin-top:12px;">결제 카드사</div>
    <select onchange="wizardField('cardCompany', this.value)">
      <option value="">선택 안함</option>
      ${CARD_COMPANIES.map(c=>`<option value="${c}" ${w.cardCompany===c?'selected':''}>${c}</option>`).join('')}
    </select>` : ''}
    ${w.payMethod==='현장결제' ? `
    <div class="field-label" style="margin-top:12px;">받은 사람</div>
    <select onchange="wizardField('expectedReceivedBy', this.value)">
      ${STATE.staff.map(s=>`<option value="${s.id}" ${w.expectedReceivedBy===s.id?'selected':''}>${s.name}</option>`).join('')}
    </select>` : ''}
    ${w.payMethod==='계좌이체' ? `
    <div class="field-label" style="margin-top:12px;">입금자명</div>
    <input type="text" value="${w.expectedTransferName||''}" oninput="wz().expectedTransferName=this.value" placeholder="예금주와 다른 경우 실제 입금자 이름" />` : ''}
    <div style="background:#f8fafc;border:1px solid #e2e8f0;border-radius:12px;padding:12px 14px;margin-top:12px;font-size:11px;color:#64748b;line-height:1.6;">가등록으로 자리만 바로 배정되고, 입금 확인은 관리자가 결제관리에서 처리합니다. (위에서 고른 결제수단은 관리자에게 미리 안내되어 확인이 빨라집니다)</div>`)
                : `<div style="background:#fffbeb;border:1px solid #fde68a;border-radius:12px;padding:12px 14px;margin-top:12px;font-size:11px;color:#92400e;line-height:1.6;">개인레슨(회차권)은 자동 시간표 생성이 없습니다. 결제완료 후 회원목록에서 "레슨 세션 추가"로 건별 예약하세요.</div>`}
    `;
  }

  const canNext = w.step===1 ? (w.name.trim().length>0) : true;
  const footer = w.step<3
    ? `<div class="btn-primary ${canNext?'':'disabled'}" onclick="wizardNext()">다음</div>`
    : `<div class="btn-primary" onclick="submitWizard()">${w.mode==='monthly'?(isOwner()?(w.paid?'결제완료 처리 → 시간표 자동 등록':'가등록 (자리만 우선 배정)'):'가등록 (자리만 우선 배정)'):'결제완료 처리 → 회차권 발급'}</div>`;

  const html = `<div class="sheet-handle"></div><div class="sheet-close" onclick="closeModal()">${ICONS.x}</div>
  <div style="padding:6px 20px 20px 20px;">
    <div style="display:flex;align-items:center;gap:10px;margin-bottom:14px;">
      ${w.step>1?`<span onclick="wizardBack()" style="cursor:pointer;">${ICONS.back}</span>`:''}
      <div style="font-size:16px;font-weight:800;">신규 회원 등록</div>
    </div>
    ${dots}
    <div style="margin-top:16px;display:flex;flex-direction:column;gap:2px;">${body}</div>
    <div style="margin-top:20px;">${footer}</div>
  </div>`;
  openModal(html);
}

function submitWizard(){
  const w = wz();
  if (w.mode==='monthly') {
    const paid = isOwner() && !!w.paid;
    createNewMember({mode:'monthly', name:w.name||'신규회원', phone:w.phone||'', weekday:w.weekday, time:w.time, coachId:w.coachId, productId:w.productId, courtId: w.courtId||STATE.courts[0]?.id, yearMonth: ym(fromISO(STATE.today)), amount: productById(w.productId).price,
      method: w.payMethod, cardCompany: w.cardCompany, paid,
      expectedReceivedBy: w.payMethod==='현장결제'?w.expectedReceivedBy:null, expectedTransferName: w.payMethod==='계좌이체'?w.expectedTransferName:null});
  } else {
    createNewMember({mode:'package', name:w.name||'신규회원', phone:w.phone||'', coachId:w.packageCoachId, method:'카드'});
  }
}

/* ============================== 시작 ============================== */
showAuthScreen();
</script>
</body>
</html>
