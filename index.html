  .fab { position: fixed; left: 50%; transform: translateX(200px) translateX(-70px); bottom: 96px; width: 52px; height: 52px; border-radius: 16px; background: #0f172a; display: flex; align-items: center; justify-content: center; box-shadow: 0 10px 24px rgba(15,23,42,0.28); cursor: pointer; z-index: 25; }

  .sheet-overlay { position: fixed; inset: 0; background: rgba(15,23,42,0.45); z-index: 90; display: flex; align-items: flex-end; justify-content: center; }
  .sheet { width: 100%; max-width: 480px; background: #fff; border-radius: 22px 22px 0 0; max-height: 88vh; overflow-y: auto; padding-bottom: 24px; }

  .sheet-close { position: absolute; top: 14px; right: 16px; width: 28px; height: 28px; border-radius: 8px; background: #f1f5f9; display: flex; align-items: center; justify-content: center; cursor: pointer; }

};
const STATUS_LABEL = { scheduled:'예정', attended:'출석완료', absent:'결석', makeup_scheduled:'보강예정', makeup_completed:'보강완료', cancelled:'취소' };
const WD = ['일','월','화','수','목','금','토'];
const OPERATING_HOURS = ['06:00','07:00','08:00','09:00','10:00','11:00','12:00','13:00','14:00','15:00','16:00','17:00','18:00','19:00','20:00','21:00','22:00'];

function pad(n){ return n<10 ? '0'+n : ''+n; }
function toISO(d){ return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
function fromISO(s){ const [y,m,d]=s.split('-').map(Number); return new Date(y,m-1,d); }
function addDays(d,n){ const r=new Date(d); r.setDate(r.getDate()+n); return r; }
function ym(d){ return d.getFullYear()+'-'+pad(d.getMonth()+1); }
function monthLabel(yearMonth){ const [y,m]=yearMonth.split('-'); return y+'년 '+parseInt(m)+'월'; }
function addMonths(yearMonth, n){ let [y,m]=yearMonth.split('-').map(Number); m+=n; while(m>12){m-=12;y++;} while(m<1){m+=12;y--;} return y+'-'+pad(m); }
function monthRange(yearMonth){ const [y,m]=yearMonth.split('-').map(Number); const start=new Date(y,m-1,1); const end=new Date(y,m,0); return [start,end]; }

/* ============================== 행 <-> 상태 매핑 ============================== */
function toCamelKey(k){ return k.replace(/_([a-z0-9])/g, (_,c)=>c.toUpperCase()); }
function toSnakeKey(k){ return k.replace(/[A-Z]/g, c=>'_'+c.toLowerCase()); }
function rowToCamel(row){ if(!row) return row; const o={}; Object.keys(row).forEach(k=>o[toCamelKey(k)]=row[k]); return o; }
function objToSnakeRow(obj){ const o={}; Object.keys(obj).forEach(k=>o[toSnakeKey(k)]=obj[k]); return o; }
function productRowToState(row){
  return { id:row.id, name:row.name, price:row.price, mode:row.registration_mode,
    ruleType: row.session_rule_type, ruleCount: row.session_rule_count,
    capacity: row.capacity, validDays: row.pack_valid_days, status: row.status,
    bundlePrice: row.bundle_price, sortOrder: row.sort_order };
}
function templateRowToState(row){
  const o = rowToCamel(row);
  o.startTime = (row.start_time||'').slice(0,5);
  o.endTime = (row.end_time||'').slice(0,5);
  return o;
}
// 코트 배정 템플릿(classTemplates)이 실제로 덮는 시간대들(예: 17:00~22:00 → 17,18,19,20,21시)
function templateHours(t){ return OPERATING_HOURS.filter(h=>h>=t.startTime && h<t.endTime); }
// 특정 날짜의 코트/시간 칸에 적용되는 템플릿을 찾는다 — specificDate가 있으면(개인레슨/기타, 1회성)
// 그 날짜에만, 없으면(정규수업) 매주 그 요일에 적용된다.
function templateForCell(courtId, t, weekday, dateISO){
  return STATE.classTemplates.find(x=>x.courtId===courtId && templateHours(x).includes(t) &&
    (x.specificDate ? x.specificDate===dateISO : x.weekday===weekday));
}
// 수업관리 목록(요일별)에서는 1회성(개인레슨/기타) 수업도 그 날짜가 속한 요일 탭에 함께 보여준다.
function templateWeekdayFor(t){ return t.specificDate ? fromISO(t.specificDate).getDay() : t.weekday; }
function hourPlusOne(t){ const h = parseInt(t.slice(0,2)); return String(h+1).padStart(2,'0')+':00'; }
function hourMinusOne(t){ const h = parseInt(t.slice(0,2)); return String(Math.max(h-1,0)).padStart(2,'0')+':00'; }
// 같은 상품을 이미 듣고 있는 회원이 하나 더(주2회 등) 등록할 때, 두 슬롯 모두 정가로 기록하고
// 번들 할인액만 따로 계산한다 (예: 12만원+12만원-2만원=22만원) — dukcok-app.html 데모와 동일한 규칙
function computeBundleDiscount(memberId, productId){
  const product = productById(productId);
  if (!product || !product.bundlePrice) return 0;
  const existing = STATE.slots.filter(s=>s.memberId===memberId && s.active && s.productId===productId);
  if (existing.length!==1) return 0;
  return Math.max(product.price*2 - product.bundlePrice, 0);
}
function slotRowToState(row){
  return { id:row.id, memberId: row.member_id, weekday: row.weekday, time: (row.start_time||'').slice(0,5),
    coachId: row.coach_id, productId: row.product_id, courtId: row.court_id,
    active: row.status==='active', forceOverride: row.force_override };
}
function sessionRowToState(row){
  const o = rowToCamel(row);
  o.startTime = (row.start_time||'').slice(0,5);
  return o;
}

/* ============================== 인증 / 세션 부트스트랩 ============================== */
let STATE = null;
let AUTH = { error:'', bootstrap:null, staffNames:null, selectedName:null };

sb.auth.onAuthStateChange((event, session) => {
  if (event === 'SIGNED_OUT') { STATE = null; AUTH = { error:'', bootstrap:null, staffNames:null, selectedName:null }; showAuthScreen(); return; }
  if (session && (event === 'SIGNED_IN' || event === 'INITIAL_SESSION' || event === 'TOKEN_REFRESHED')) {
    if (!STATE) loadAppData(session.user);
  } else if (!session && event === 'INITIAL_SESSION') {
    showAuthScreen();
  }
});

async function logout(){ await sb.auth.signOut(); }

// 로그인 화면을 띄우기 전에 "관리자 계정이 아직 하나도 없는지"부터 확인한다 —
// 없으면 최초 1회 관리자 설정 화면을, 있으면 등록된 이름 탭을 눌러 들어가는 로그인 화면을 보여준다.
async function showAuthScreen(){
  if (AUTH.bootstrap === null) {
    const { data } = await sb.rpc('staff_exists');
    AUTH.bootstrap = !data;
  }
  if (!AUTH.bootstrap && !AUTH.staffNames) {
    const { data } = await sb.rpc('list_staff_names');
    AUTH.staffNames = (data||[]).map(r=>r.name);
  }
  renderAuthScreen();
}

async function submitBootstrapAdmin(){
  const name = (document.getElementById('boot_name').value||'').trim();
  const password = document.getElementById('boot_password').value||'';
  if (!name || !password) { AUTH.error='이름과 비밀번호를 입력하세요'; renderAuthScreen(); return; }
  if (password.length < 6) { AUTH.error='비밀번호는 6자 이상으로 해주세요'; renderAuthScreen(); return; }
  AUTH.error = '';
  const { data, error } = await sb.functions.invoke('create-coach', { body: { name, password } });
  if (error || (data && data.error)) {
    // 계정 생성 응답이 오류를 반환해도 실제로는 계정이 만들어진 경우가 있어(서버 함수 이슈),
    // 이름으로 실제 로그인이 되는지 한 번 더 확인해본 뒤에만 진짜 실패로 처리한다.
    const { data: fallbackEmail } = await sb.rpc('get_login_email_for_name', { p_name: name });
    if (fallbackEmail) {
      const { error: loginErr2 } = await sb.auth.signInWithPassword({ email: fallbackEmail, password });
      if (!loginErr2) return;
    }
    AUTH.error = (data && data.error) || (error && error.message) || '설정 실패';
    renderAuthScreen();
    return;
  }
  const { error: loginErr } = await sb.auth.signInWithPassword({ email: data.email, password });
  if (loginErr) { AUTH.error = '자동 로그인에 실패했습니다. 다시 시도해주세요'; renderAuthScreen(); }
}

function selectLoginName(n){ AUTH.selectedName = n; AUTH.error=''; renderAuthScreen(); }
function backToNameSelect(){ AUTH.selectedName = null; AUTH.error=''; renderAuthScreen(); }

async function submitLogin(){
  const name = AUTH.selectedName;
  const password = document.getElementById('login_password').value||'';
  if (!password) { AUTH.error='비밀번호를 입력하세요'; renderAuthScreen(); return; }
  AUTH.error = '';
  const { data: email, error: rpcErr } = await sb.rpc('get_login_email_for_name', { p_name: name });
  if (rpcErr || !email) { AUTH.error = '등록되지 않은 이름입니다'; renderAuthScreen(); return; }

  if (error) { AUTH.error = '비밀번호가 올바르지 않습니다'; renderAuthScreen(); return; }
}

async function loadAppData(user){
  let staffRow = null;
  for (let i=0;i<6 && !staffRow;i++){
    const { data } = await sb.from('staff').select('*').eq('auth_user_id', user.id).maybeSingle();
    if (data) staffRow = data; else await new Promise(r=>setTimeout(r,500));
  }
  if (!staffRow) { toast('계정 정보를 불러오지 못했습니다. 새로고침 해주세요.'); return; }

  const today = new Date();
  STATE = {
    // dbRole: 실제 DB 권한(RLS 기준). role: 화면에 지금 뭘 보여줄지(코치 화면으로 항상 먼저 시작하고,
    // dbRole이 owner인 사람만 "관리자" 버튼으로 본인 비밀번호를 다시 입력해 role을 owner로 바꿀 수 있다)
    dbRole: staffRow.role, role: 'coach', myEmail: user.email,
    myStaffId: staffRow.id, myName: staffRow.name,
    tab: 'timetable', today: toISO(today),
    weekStart: toISO(addDays(today, -today.getDay())),
    selectedDate: toISO(today),
    paymentMonth: addMonths(ym(today), 1),
    reportMonth: ym(today),
    availWeekday: today.getDay(),
    staff: [], courts: [], products: [], members: [], slots: [], packages: [],
    enrollments: [], sessions: [], logs: [], classTemplates: [],
    enrollmentStatusBySlot: {}, packageStatusByMember: {}  };
  try {
    await refreshAllData();
    render();
  } catch(e) {
    console.error(e);
    toast('데이터를 불러오는 중 오류가 발생했습니다');
  }
}

async function refreshAllData(){
  const [staffRes, courtsRes, productsRes, membersRes, slotsRes, templatesRes] = await Promise.all([
    sb.from('staff').select('*'),
    sb.from('courts').select('*'),
    sb.from('products').select('*').order('sort_order', { ascending: true, nullsFirst: false }),
    sb.from('members').select('*').neq('status','withdrawn'),
    sb.from('member_slots').select('*').eq('status','active'),
    sb.from('class_templates').select('*')
  ]);
  STATE.staff = (staffRes.data||[]).map(rowToCamel);
  STATE.courts = (courtsRes.data||[]).map(rowToCamel);
  STATE.products = (productsRes.data||[]).map(productRowToState);
  STATE.members = (membersRes.data||[]).map(rowToCamel);
  STATE.slots = (slotsRes.data||[]).map(slotRowToState);
  STATE.classTemplates = (templatesRes.data||[]).map(templateRowToState);

  const rangeStart = toISO(addDays(fromISO(STATE.today), -30));
  const rangeEnd = toISO(addDays(fromISO(STATE.today), 90));
  const sessionsRes = await sb.from('class_sessions').select('*').gte('date', rangeStart).lte('date', rangeEnd);
  STATE.sessions = (sessionsRes.data||[]).map(sessionRowToState);

  if (isOwner()) {
    const [enrRes, pkgRes, closedRes] = await Promise.all([
      sb.from('monthly_enrollments').select('*'),
      sb.from('lesson_packages').select('*'),
      sb.from('closed_dates').select('*')
    ]);
    STATE.enrollments = (enrRes.data||[]).map(rowToCamel);
    STATE.packages = (pkgRes.data||[]).map(rowToCamel);
    STATE.closedDates = (closedRes.data||[]).map(rowToCamel);
    await fetchLogs();
  } else {
    const thisMonth = ym(fromISO(STATE.today));
    const [byslotRes, pkgBulkRes] = await Promise.all([
      sb.rpc('enrollment_status_by_slot', { p_year_month: thisMonth }),
      sb.rpc('package_status_bulk')
    ]);
    STATE.enrollmentStatusBySlot = { [thisMonth]: {} };
    (byslotRes.data||[]).forEach(r=>{ STATE.enrollmentStatusBySlot[thisMonth][r.slot_id] = r.is_registered; });
    STATE.packageStatusByMember = {};
    (pkgBulkRes.data||[]).forEach(r=>{ STATE.packageStatusByMember[r.member_id] = { remainingSessions: r.remaining_sessions, totalSessions: r.total_sessions, pkgStatus: r.pkg_status, defaultCoachId: r.default_coach_id, purchasedAt: r.purchased_at }; });
  }
}

async function fetchLogs(){
  const { data } = await sb.from('change_logs')
    .select('id, actor_role, note, created_at, staff:actor_id(name), members:member_id(name)')
    .order('created_at', { ascending:false }).limit(200);
  STATE.logs = (data||[]).map(r=>({
    id:r.id, actorName: (r.staff&&r.staff.name)||'알수없음', actorRole:r.actor_role,
    memberName: (r.members&&r.members.name)||'', text:r.note, createdAt:(r.created_at||'').replace('T',' ').slice(0,16)
  }));
}

async function refreshMemberSessions(memberId){
  const { data } = await sb.from('class_sessions').select('*').eq('member_id', memberId);
  const others = STATE.sessions.filter(s=>s.memberId!==memberId);
  STATE.sessions = others.concat((data||[]).map(sessionRowToState));
}
async function refreshEnrollments(){
  const { data } = await sb.from('monthly_enrollments').select('*');
  STATE.enrollments = (data||[]).map(rowToCamel);
}
async function refreshPackages(){
  const { data } = await sb.from('lesson_packages').select('*');
  STATE.packages = (data||[]).map(rowToCamel);
}
// 개인레슨 회차권이 새로 생기거나(가등록) 세션이 예약되어 잔여횟수가 바뀔 때마다 호출한다.
// 코치는 lesson_packages를 직접 조회할 권한이 없어 package_status_bulk 요약만 다시 받아온다.
async function refreshMyPackageStatus(){
  if (isOwner()) { await refreshPackages(); return; }
  const { data } = await sb.rpc('package_status_bulk');
  STATE.packageStatusByMember = {};
  (data||[]).forEach(r=>{ STATE.packageStatusByMember[r.member_id] = { remainingSessions: r.remaining_sessions, totalSessions: r.total_sessions, pkgStatus: r.pkg_status, defaultCoachId: r.default_coach_id, purchasedAt: r.purchased_at }; });
}

function toast(msg){
  const el = document.createElement('div'); el.className='toast'; el.textContent = msg;
  document.getElementById('toastLayer').appendChild(el);
  setTimeout(()=>el.remove(), 2600);
}

/* ============================== 조회 헬퍼 ============================== */
function memberById(id){ return STATE.members.find(m=>m.id===id); }
// 전화번호의 '-' 유무와 무관하게 숫자만 비교해서 같은 번호인지 판단한다 (010-1234-5678 = 01012345678)
function normalizePhone(phone){ return (phone||'').replace(/[^0-9]/g,''); }
function findDuplicateMember(name, phone){
  const np = normalizePhone(phone);
  if (!np || !name) return null;
  return STATE.members.find(m=>m.name===name && normalizePhone(m.phone)===np);
}
function openDuplicateMemberConfirm(dup, proceedFnName, cancelFnName){

function staffById(id){ return STATE.staff.find(s=>s.id===id); }
// 코치 선택 목록(코트배정/일괄등록/신규등록 등) — 이동선처럼 관리자를 겸임하는 코치도 포함하되(role이 owner여도
// 실제로 수업을 맡는 코치이므로), 로그인 목록에서 숨긴 순수 관리자 계정("관리자")과 삭제(비활성화)된 코치는 제외한다.
function activeCoaches(){ return STATE.staff.filter(s=>!s.hideFromLogin && s.status!=='inactive'); }
function courtById(id){ return STATE.courts.find(c=>c.id===id); }
function productById(id){ return STATE.products.find(p=>p.id===id); }
function sessionById(id){ return STATE.sessions.find(s=>s.id===id); }
function slotById(id){ return STATE.slots.find(s=>s.id===id); }
function slotsOfMember(memberId){ return STATE.slots.filter(s=>s.memberId===memberId && s.active); }
function packageOfMember(memberId){ return STATE.packages.find(p=>p.memberId===memberId && p.status==='active'); }
function sessionsOnDate(dateStr){ return STATE.sessions.filter(s=>s.date===dateStr).sort((a,b)=> a.startTime.localeCompare(b.startTime)); }
function isOwner(){ return STATE.role==='owner'; }

// 코치를 색으로도 구분(텍스트와 항상 병행 — 색상만으로 구분하지 않음). 데모 때부터 써온 이름 기준 고정 배정을
// 그대로 따른다(김종성 연두/유승우 하늘/김다빈 주황/이동선 노랑/김공수 보라) — UUID 정렬 순서로 배정하면 코치가
// 로그인할 때마다 계정이 재생성되어도 안 바뀌긴 하지만, 데모에서 보던 색과 어긋나 보이는 문제가 있었다.
const COACH_COLOR_BY_NAME = { '김종성':'#bfe0b2', '유승우':'#a9d3ee', '김다빈':'#f7b877', '이동선':'#ffe07a', '김공수':'#c5b6e2' };
const COACH_FALLBACK_PALETTE = ['#9fd6d1','#f2a9c4','#b9dd9a','#dcbfa8','#a8bde3'];
function coachColor(coachId){
  const coach = staffById(coachId);
  if (coach && COACH_COLOR_BY_NAME[coach.name]) return COACH_COLOR_BY_NAME[coach.name];
  const others = [...activeCoaches()].filter(c=>!COACH_COLOR_BY_NAME[c.name]).sort((a,b)=>a.id.localeCompare(b.id));
  const idx = others.findIndex(c=>c.id===coachId);
  return COACH_FALLBACK_PALETTE[idx>=0 ? idx % COACH_FALLBACK_PALETTE.length : 0];
}
function coachTextColor(coachId){ return '#334155'; } // 모든 코치색이 파스텔이라 텍스트는 공통으로 짙은 남색계열 사용

// 코치 화면은 결제 원본 테이블에 접근 권한이 없으므로(RLS), 로그인 시 미리 받아둔 안전한 요약값을 쓴다
function getSlotPaidStatus(slotId, yearMonth){
  if (isOwner()) {
    const e = STATE.enrollments.find(x=>x.slotId===slotId && x.yearMonth===yearMonth);
    return e ? e.paymentStatus==='paid' : false;
  }
  return !!(STATE.enrollmentStatusBySlot[yearMonth] && STATE.enrollmentStatusBySlot[yearMonth][slotId]);
}
function memberHasPackage(memberId){
  if (isOwner()) return !!packageOfMember(memberId);
  return !!STATE.packageStatusByMember[memberId];
}
function getPackageDisplay(memberId){
  if (isOwner()) {
    const p = packageOfMember(memberId);
    return p ? { total:p.totalSessions, used:p.usedSessions, remaining:p.totalSessions-p.usedSessions, coachId:p.defaultCoachId, purchasedAt:p.purchasedAt, amount:p.paymentAmount, method:p.paymentMethod, paymentStatus:p.paymentStatus } : null;
  }
  const r = STATE.packageStatusByMember[memberId];
  return r ? { total:r.totalSessions, used:r.totalSessions-r.remainingSessions, remaining:r.remainingSessions, coachId:r.defaultCoachId, purchasedAt:r.purchasedAt, paymentStatus:r.pkgStatus } : null;
}

async function addLog(memberId, memberName, text){
  const entry = { id:'tmp_'+Math.random().toString(36).slice(2), actorName: STATE.myName, actorRole: STATE.role,
    memberName: memberName||'', text, createdAt: new Date().toISOString().replace('T',' ').slice(0,16) };
  if (STATE.logs) STATE.logs.unshift(entry);
  try {
    await sb.from('change_logs').insert({ actor_id: STATE.myStaffId, actor_role: STATE.role, member_id: memberId||null, action_type:'action', note: text });
  } catch(e){ console.error('log insert failed', e); }
}

/* ============================== 자동생성 (결제완료 → 시간표 생성) ============================== */
async function completeMonthlyPayment(enrollmentId, amount, method, cardCompany){
  const enr = STATE.enrollments.find(e=>e.id===enrollmentId);
  if (!enr) return;
  const { data, error } = await sb.rpc('complete_monthly_payment', { p_enrollment_id: enrollmentId, p_amount: amount, p_method: method, p_card_company: cardCompany||null });
  if (error) { toast('처리 실패: '+error.message); return; }
  await refreshEnrollments();
  await refreshMemberSessions(enr.memberId);
  const m = memberById(enr.memberId);
  const already = data === 0;
  await addLog(m.id, m.name, `${enr.yearMonth} 결제완료 처리(${amount.toLocaleString()}원)${already?' (이미 생성된 등록)':' → 해당 월 수업 자동생성'}`);
  STATE.tab = 'timetable';
  STATE.timetableMode = 'view';
  render();
  toast(already ? '이미 처리된 등록입니다' : `${m.name} 회원 ${monthLabel(enr.yearMonth)} 수업이 자동 생성되었습니다`);
}

async function confirmMakeup(absentSessionId, date, time, courtId, coachId){
  const orig = sessionById(absentSessionId);
  const finalCoachId = coachId || orig.coachId;
  // 이 코트가 그 날짜·시간에 이미 정원이 찼거나(1:4/1:2) 다른 1:1로 사용 중이면 보강을 잡을 수 없다는 경고를 먼저 보여준다
  const existing = STATE.sessions.filter(s=>s.date===date && s.startTime===time && s.courtId===courtId && s.status!=='cancelled');
  const existingProduct = existing[0] ? productForSession(existing[0]) : null;
  if (existingProduct && existing.length >= existingProduct.capacity) {
    toast(`이 코트는 ${date} ${time}에 이미 정원(${existingProduct.capacity}명)이 찼습니다`);

    return;
  }
  const { data, error } = await sb.from('class_sessions').insert(objToSnakeRow({

/* ============================== 잔여석 계산 ============================== */
// 코트배정(class_templates)에 커스텀 정원(customCapacity)이 지정되어 있으면 그 요일·시간·코트·코치의
// 정원은 상품 정원이 아니라 이 값을 따른다 — "동료학습반"처럼 5시간·7명 같은, 기존 1:4/1:2 상품 정원과
// 다른 반을 상품 추가 없이 코트배정 화면에서 바로 만들 수 있게 하기 위함이다.
function findTemplateFor(weekday, courtId, coachId, time){
  return STATE.classTemplates.find(t=>t.weekday===weekday && t.courtId===courtId && t.coachId===coachId && templateHours(t).includes(time));
}
function effectiveCapacity(product, weekday, courtId, coachId, time){
  const tpl = findTemplateFor(weekday, courtId, coachId, time);
  if (tpl && tpl.customCapacity) return tpl.customCapacity;
  return product ? product.capacity : null;
}
// 신규회원 정규수업 등록 시 그 요일·시간·코트가 이미 다른 코치 차지이거나 정원이 찼는지 확인한다.
// 등록 자체를 처음부터 막기 위한 것으로, DB의 add_monthly_slot도 코트 충돌은 한 번 더 막아준다(이중 방어).
// forceOverride가 true면(예: 2시간 1:2 레슨을 3명이 나눠 듣는 특수 배정) 정원초과 체크는
// 건너뛴다 — 단, 다른 코치가 이미 그 코트를 쓰고 있는 경우는 예외 없이 그대로 막는다.
function monthlySlotConflict(weekday, time, courtId, coachId, productId, forceOverride){
  const activeSlots = STATE.slots.filter(s=>s.weekday===weekday && s.time===time && s.courtId===courtId && s.active);
  const otherCoach = activeSlots.find(s=>s.coachId!==coachId);
  if (otherCoach) return { type:'court', detail:`이 코트는 ${WD[weekday]}요일 ${time}에 이미 ${staffById(otherCoach.coachId)?staffById(otherCoach.coachId).name:'다른'} 코치가 사용 중입니다` };
  if (forceOverride) return null;
  const product = productById(productId);
  const cap = effectiveCapacity(product, weekday, courtId, coachId, time);
  const sameGroup = activeSlots.filter(s=>s.coachId===coachId && s.productId===productId);
  if (cap!=null && sameGroup.length >= cap) return { type:'capacity', detail:`이 시간대는 이미 정원(${cap}명)이 찼습니다` };
  return null;
}
function availabilityForWeekday(weekday){
  const rows = [];
  const grouped = {};
  // 관리자가 미리 배정해둔 코트배정 템플릿을 먼저 0명으로 깔아, 회원이 하나도 없어도
  // "이 코치가 이 코트/시간에 이 상품을 한다"가 바로 보이게 한다.
  STATE.classTemplates.filter(t=>t.weekday===weekday).forEach(t=>{
    templateHours(t).forEach(h=>{
      const key = h+'|'+t.courtId+'|'+t.coachId+'|'+t.productId;
      grouped[key] = (grouped[key]||0)+0;
    });
  });
  STATE.slots.filter(s=>s.weekday===weekday && s.active).forEach(s=>{
    const key = s.time+'|'+s.courtId+'|'+s.coachId+'|'+s.productId;
    grouped[key] = (grouped[key]||0)+1;
  });
  Object.keys(grouped).forEach(key=>{
    const [time,courtId,coachId,productId] = key.split('|');
    const used = grouped[key];
    const product = productById(productId);
    if (!product) return;
    const capacity = effectiveCapacity(product, weekday, courtId, coachId, time);
    const remaining = capacity - used;
    rows.push({time, courtId, coachId, productId, used, capacity, remaining});
  });
  rows.sort((a,b)=> a.time.localeCompare(b.time));
  return rows;
}
// "요일 상관없이 몇시만 되면 되는지" 문의에 답하기 위한, 시간 하나 고정 + 7요일 매트릭스
function availabilityForTimeAcrossWeek(time){
  const result = {};
  for (let wd=0; wd<7; wd++){
    availabilityForWeekday(wd).filter(r=>r.time===time).forEach(r=>{
      result[r.coachId] = result[r.coachId] || {};
      result[r.coachId][r.productId] = result[r.coachId][r.productId] || {};
      result[r.coachId][r.productId][wd] = { remaining: r.remaining };
    });
  }
  return result;
}
// 코치별 보기 — 요일·시간 상관없이 이 코치 한 명의 일주일 전체 정규수업 배정을 한눈에 본다.
function availabilityForCoach(coachId){
  const rows = [];
  for (let wd=0; wd<7; wd++){
    availabilityForWeekday(wd).filter(r=>r.coachId===coachId).forEach(r=>rows.push({...r, weekday:wd}));
  }
  rows.sort((a,b)=> a.weekday-b.weekday || a.time.localeCompare(b.time));
  return rows;
}
function availLabel(remaining){
  if (remaining <= 0) return {text:'마감', bg:'#fef2f2', color:'#b91c1c'};
  if (remaining === 1) return {text:'마감임박', bg:'#fffbeb', color:'#b45309'};
  return {text:'여유', bg:'#f0fdf4', color:'#15803d'};
}

// 그 날짜의 코트 중복배정/코치 겹침/정원초과를 시간대(key = 시작시간|코트id) 단위로 모아서 돌려준다.
// 취소(cancelled) 처리된 세션은 자리를 비운 것으로 치므로 여기서 제외한다 — 안 그러면 경고 목록에서
// "취소"로 문제를 없애도 경고가 그대로 남는 버그가 생긴다.
function conflictsForDate(dateISO){
  const daySessions = sessionsOnDate(dateISO).filter(s=>s.status!=='cancelled');
  const groups = {};
  daySessions.forEach(s=>{
    const key = s.startTime+'|'+(s.courtId||'_none');
    groups[key] = groups[key] || [];
    groups[key].push(s);
  });
  const coachTimeCourts = {};
  daySessions.forEach(s=>{
    const k = s.coachId+'|'+s.startTime;
    coachTimeCourts[k] = coachTimeCourts[k] || new Set();
    if (s.courtId) coachTimeCourts[k].add(s.courtId);
  });
  const result = [];
  const weekday = fromISO(dateISO).getDay();
  Object.keys(groups).forEach(key=>{
    const list = groups[key];
    const [time, courtIdRaw] = key.split('|');
    const coaches = new Set(list.map(s=>s.coachId));
    let type = null, detail = '';
    if (coaches.size > 1) { type = 'conflict'; detail = '코트 중복배정 · 코치 겹침'; }
    const doubleBookedCoach = list.find(s=>{ const k=s.coachId+'|'+s.startTime; return coachTimeCourts[k] && coachTimeCourts[k].size>1; });
    if (doubleBookedCoach && !type) { type = 'conflict'; detail = `${staffById(doubleBookedCoach.coachId).name} 코치가 같은 시간 다른 코트에도 배정됨`; }
    const product = list[0] ? productForSession(list[0]) : null;
    const cap = list[0] ? effectiveCapacity(product, weekday, courtIdRaw==='_none'?null:courtIdRaw, list[0].coachId, time) : null;
    // 강제 정원초과(capacityOverride)로 등록된 자리는 의도적인 것이므로 경고 대상에서 뺀다
    // (예: 2시간 1:2 레슨을 3명이 나눠 듣는 경우) — 코트/코치 겹침 문제는 이 예외와 무관하게 그대로 잡는다.
    const allForced = list.length>0 && list.every(s=>s.capacityOverride);
    if (cap!=null && list.length > cap && !allForced) {
      type = type || 'capacity';
      detail = detail || `정원초과 ${list.length}/${cap}`;
    }
    if (type) {
      result.push({ time, courtId: courtIdRaw==='_none'?null:courtIdRaw, type, detail, sessions:list });
    }
  });
  result.sort((a,b)=>a.time.localeCompare(b.time));
  return result;
}

// 시간표에서 "여러 시간에 걸친 하나의 수업"을 테두리로 이어 보여줄지 판정한다.
// 단순히 "같은 코치가 바로 앞/뒤 시간에도 있다"로 묶으면, 코치가 다음 시간에 완전히 별개인
// 수업을 하는 경우까지 잘못 이어져 보이므로 쓰지 않는다. 대신 실제로 "같은 반"임을 나타내는
// 신호만 사용한다 — (1) 관리자가 만든 특수 반(수업추가로 만든 group_id로 묶인 세션들),
// (2) 강제 정원초과(capacityOverride) 배정 — 이동선 코치 1:2반(정원 2명)처럼, 한 명이 추가
// 비용을 내고 여러 시간을 나눠 듣는 특수 케이스. 둘 다 아니면 이어붙이지 않는다.
function courtHourLinkKey(groups, courtId, t){
  const list = (groups[t+'|'+courtId]||[]).filter(s=>s.status!=='cancelled');
  if (!list.length) return null;
  if (list[0].groupId) return 'group:'+list[0].groupId;
  if (list.every(s=>s.capacityOverride)) return 'override:'+list[0].coachId;
  return null;
}function timetableView(){
  const selected = STATE.selectedDate || STATE.today;
  const daySessions = sessionsOnDate(selected);
  const weekday = fromISO(selected).getDay();

  const groups = {};
  const seen = new Set();
  daySessions.forEach(s=>{
    const key = s.startTime+'|'+(s.courtId||'_none');
    groups[key] = groups[key] || [];
    groups[key].push(s);
  });

  const conflicts = conflictsForDate(selected);
  const courtTimeWarn = {};
  const courtTimeWarnDetail = {};
  conflicts.forEach(c=>{
    const key = c.time+'|'+(c.courtId||'_none');
    courtTimeWarn[key] = c.type;
    courtTimeWarnDetail[key] = c.detail;
  });
  const warnCount = conflicts.length;

  let html = `<div style="padding:14px 18px 16px 18px;">
    <div style="font-size:14px;font-weight:800;margin-bottom:8px;">${selected.slice(5).replace('-','월 ')}일(${WD[weekday]}) · ${daySessions.filter(s=>s.status!=='cancelled').length}수업</div>`;

  if (warnCount>0) {
    html += `<div style="display:flex;align-items:center;gap:6px;background:#fef2f2;border:1px solid #fecaca;padding:7px 10px;border-radius:8px;margin-bottom:12px;color:#b91c1c;cursor:pointer;" onclick="openConflictDetail('${selected}')">
      <span style="display:flex;">${ICONS.warn}</span><span style="font-size:12px;font-weight:700;">경고 ${warnCount}건 — 코트 중복배정/정원초과 확인 (눌러서 수정)</span></div>`;
  }

  html += `<div style="margin-bottom:10px;"><span style="color:#4f46e5;font-size:12px;font-weight:800;cursor:pointer;" onclick="openAddExtraHourPicker()">+ 시간 추가</span></div>`;

  // 운영시간이 새벽~밤까지 넓어서, 실제 수업/템플릿이 있는 시간대만 표시한다 (없으면 안내 문구)
  const sessionHours = [...new Set(daySessions.map(s=>s.startTime))];
  const activeHours = OPERATING_HOURS.filter(t=>STATE.courts.some(c=>(groups[t+'|'+c.id]||[]).length>0));
  const templateHoursToday = OPERATING_HOURS.filter(t=>STATE.classTemplates.some(tp=>(tp.specificDate?tp.specificDate===selected:tp.weekday===weekday) && templateHours(tp).includes(t)));
  const manualExtra = [...((STATE._addClassExtraHours && STATE._addClassExtraHours[selected]) || [])];
  const hours = [...new Set([...activeHours, ...templateHoursToday, ...manualExtra, ...sessionHours])].sort();
  if (hours.length===0) {
    html += `<div style="text-align:center;padding:40px 0;color:#94a3b8;font-size:13px;">이 날짜엔 등록된 수업이 없습니다.</div>`;
  }
  hours.forEach(t=>{
    html += `<div style="font-size:12px;font-weight:700;color:#0f172a;margin:14px 0 6px 0;">${t}</div>
    <div style="display:grid;grid-template-columns:repeat(${STATE.courts.length},1fr);gap:6px;align-items:stretch;">`;
    STATE.courts.forEach(court=>{
      const key = t+'|'+court.id;
      const list = groups[key] || [];
      list.forEach(s=>seen.add(s.id));
      const warn = courtTimeWarn[key];
      const tpl = templateForCell(court.id, t, weekday, selected);
      const isOtherTpl = tpl && tpl.classType==='other';
      const isPersonalTpl = tpl && tpl.classType==='personal';
      const product = list[0] ? productForSession(list[0]) : (tpl && tpl.classType==='regular' ? productById(tpl.productId) : null);
      const repCoachId = list[0] ? list[0].coachId : (tpl ? tpl.coachId : null);
      const cap = isOtherTpl ? (tpl.customCapacity||1) : effectiveCapacity(product, weekday, court.id, repCoachId, t);
      const overCap = !!(cap!=null && list.length>cap) && !(list.length>0 && list.every(s=>s.capacityOverride));
      const classLabel = list[0] ? list[0].classLabel : (isPersonalTpl ? '1:1 개인레슨' : null);
      const linkKey = courtHourLinkKey(groups, court.id, t);
      const linkedPrev = linkKey!=null && courtHourLinkKey(groups, court.id, hourMinusOne(t))===linkKey;
      const linkedNext = linkKey!=null && courtHourLinkKey(groups, court.id, hourPlusOne(t))===linkKey;
      let runHours = 1;
      if (linkedNext && !linkedPrev) {
        let probe = hourPlusOne(t);
        while (courtHourLinkKey(groups, court.id, probe)===linkKey) { runHours++; probe = hourPlusOne(probe); }
      }
      html += `<div class="m-card" style="padding:8px;height:100%;box-sizing:border-box;margin-top:0;display:flex;flex-direction:column;${warn?'border-color:#fca5a5;background:#fffafa;':((linkedPrev||linkedNext)?'border:2px solid #c7d2fe;background:#f5f6ff;':'')}">`;
      if (warn) {
        const txt = courtTimeWarnDetail[key] || (warn==='conflict' ? '코트 중복배정 · 코치 겹침' : `정원초과 ${list.length}/${cap!=null?cap:'-'}`);
        html += `<div style="display:flex;align-items:center;gap:3px;background:#fef2f2;border:1px solid #fecaca;border-radius:6px;padding:3px 5px;margin-bottom:6px;color:#b91c1c;cursor:pointer;" onclick="event.stopPropagation();openConflictDetail('${selected}','${key}')">
          <span style="display:flex;flex-shrink:0;">${ICONS.warn}</span><span style="font-size:9px;font-weight:700;line-height:1.3;">${txt} (수정)</span></div>`;
      }
      html += `<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:6px;gap:4px;border-radius:6px;overflow:hidden;${repCoachId?`background:${coachColor(repCoachId)};`:''}">

      html += `</div>`;

    html += `<div style="font-size:12px;font-weight:700;color:#0f172a;margin:14px 0 6px 0;">기타</div><div class="m-card">`;

function statusIcon(status){
  if (status==='scheduled') return ICONS.clock;
  if (status==='attended' || status==='makeup_completed') return ICONS.check;
  if (status==='absent') return ICONS.x;
  if (status==='makeup_scheduled') return ICONS.refresh;
  if (status==='cancelled') return ICONS.ban;
  return '';
}
function productForSession(s){
  if (s.enrollmentId) { const e = STATE.enrollments.find(e=>e.id===s.enrollmentId); if (e) return productById(e.productId); }
  const slot = STATE.slots.find(sl=>sl.id===s.sourceSlotId);
  if (slot) return productById(slot.productId);
  if (s.packageId) { const prod = STATE.products.find(p=>p.mode==='session_pack'); if (prod) return prod; }
  return null;
}
function shiftWeek(n){ STATE.weekStart = toISO(addDays(fromISO(STATE.weekStart), 7*n)); STATE.selectedDate = toISO(addDays(fromISO(STATE.weekStart), 0)); render(); }
function selectDate(iso){ STATE.selectedDate = iso; render(); }

function openMonthPicker(){
  const base = fromISO(STATE.selectedDate || STATE.today);
  STATE._monthPicker = { year: base.getFullYear(), month: base.getMonth() };
  renderMonthPicker();
}
function shiftMonthPicker(n){
  const mp = STATE._monthPicker;
  let m = mp.month+n, y = mp.year;
  while (m>11){ m-=12; y++; }
  while (m<0){ m+=12; y--; }
  mp.month = m; mp.year = y;
  renderMonthPicker();
}
function pickMonthDate(iso){
  STATE.selectedDate = iso;
  STATE.weekStart = toISO(addDays(fromISO(iso), -fromISO(iso).getDay()));
  STATE.templateManagerWeekday = fromISO(iso).getDay();
  closeModal(); render();
}
function renderMonthPicker(){
  const mp = STATE._monthPicker;
  const first = new Date(mp.year, mp.month, 1);
  const startOffset = first.getDay();
  const daysInMonth = new Date(mp.year, mp.month+1, 0).getDate();
  const selected = STATE.selectedDate || STATE.today;
  let cells = '';
  for (let i=0;i<startOffset;i++) cells += `<div></div>`;
  for (let d=1; d<=daysInMonth; d++) {
    const iso = toISO(new Date(mp.year, mp.month, d));
    const has = sessionsOnDate(iso).length>0;
    const sel = iso===selected;
    const isToday = iso===STATE.today;
    cells += `<div onclick="pickMonthDate('${iso}')" style="height:42px;display:flex;flex-direction:column;align-items:center;justify-content:center;border-radius:10px;cursor:pointer;${sel?'background:#4f46e5;':(isToday?'background:#eef0ff;':'')}">
      <span style="font-size:13px;font-weight:${sel?'800':'600'};color:${sel?'#fff':'#0f172a'};">${d}</span>
      <div style="width:4px;height:4px;border-radius:50%;margin-top:2px;background:${has?(sel?'#fff':'#94a3b8'):'transparent'};"></div>
    </div>`;
  }
  const html = `<div class="sheet-handle"></div><div class="sheet-close" onclick="closeModal()">${ICONS.x}</div>
  <div style="padding:6px 20px 20px 20px;">
    <div style="display:flex;align-items:center;justify-content:center;gap:16px;margin-bottom:16px;">
      <span onclick="shiftMonthPicker(-1)" style="cursor:pointer;">${ICONS.chevL}</span>
      <span style="font-size:16px;font-weight:800;">${mp.year}년 ${mp.month+1}월</span>
      <span onclick="shiftMonthPicker(1)" style="cursor:pointer;">${ICONS.chevR}</span>
    </div>
    <div style="display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:6px;">
      ${WD.map((w,i)=>`<div style="text-align:center;font-size:11px;font-weight:700;color:${i===0?'#dc2626':(i===6?'#2563eb':'#94a3b8')};">${w}</div>`).join('')}
    </div>
    <div style="display:grid;grid-template-columns:repeat(7,1fr);gap:4px;">${cells}</div>
    <div class="btn-secondary" style="margin-top:16px;" onclick="pickMonthDate('${STATE.today}')">오늘로 이동</div>
  </div>`;
  openModal(html);
}

// 코트/시간 칸을 눌렀을 때 그 자리 상태에 맞는 작업만 골라 보여준다 (회원 추가/보강 배정/레슨 추가/수업 추가/반 취소 등)
function openCellActionMenu(dateISO, weekday, time, courtId){
  const list = sessionsOnDate(dateISO).filter(s=>s.startTime===time && (s.courtId||'_none')===courtId && s.status!=='cancelled');
  const tpl = templateForCell(courtId, time, weekday, dateISO);
  const isOtherTpl = tpl && tpl.classType==='other';
  const isPersonalTpl = tpl && tpl.classType==='personal';
  const product = list[0] ? productForSession(list[0]) : (tpl && tpl.classType==='regular' ? productById(tpl.productId) : null);
  const repCoachId = list[0] ? list[0].coachId : (tpl ? tpl.coachId : null);
  const cap = isOtherTpl ? (tpl.customCapacity||1) : effectiveCapacity(product, weekday, courtId, repCoachId, time);
  const activeCount = list.filter(s=>s.status!=='absent').length;
  const groupId = list[0] ? list[0].groupId : null;
  const court = courtById(courtId);

  const actions = [];
  if (isOtherTpl) {
    if (list.length < cap) actions.push({label:'회원 추가', danger:false, fn:`openJoinOtherClassPicker('${dateISO}','${time}','${courtId}','${tpl.id}')`});
    if (isOwner() && list.length===0) actions.push({label:'이 반 취소', danger:true, fn:`deleteClassTemplate('${tpl.id}')`});
  } else {
    const canFillMore = !isPersonalTpl && (list.length===0 || (cap!=null && activeCount < cap));
    if (canFillMore) {
      // 이 자리에 배정된 정규수업 템플릿(정원 있는 반)이 있으면, 보강인지 신규/체험인지 몰라도 되는
      // 일반 "회원 추가"를 우선 보여준다 — "보강 회원 배정"은 결석 보강 전용으로 따로 남겨둔다.
      if (tpl && tpl.classType==='regular') actions.push({label:'회원 추가', danger:false, fn:`openAssignMemberToClass('${tpl.id}',${weekday},'${time}','${courtId}')`});
      actions.push({label:'보강 회원 배정', danger:false, fn:`openFillSlotPicker('${dateISO}','${time}','${courtId}',${repCoachId?`'${repCoachId}'`:'null'})`});
    }
    if (list.length===0) actions.push({label:'레슨 추가', danger:false, fn:`openAddLessonChooser('${dateISO}',${weekday},'${time}','${courtId}',${repCoachId?`'${repCoachId}'`:'null'})`});
    if (isOwner() && list.length===0) actions.push({label:'수업 추가', danger:false, fn:`openAddAdhocClassForm('${dateISO}','${time}','${courtId}')`});
    if (isOwner() && groupId) actions.push({label:'이 반 취소', danger:true, fn:`cancelAdhocClass('${groupId}')`});
  }

  const html = `<div class="sheet-handle"></div><div class="sheet-close" onclick="closeModal()">${ICONS.x}</div>
  <div style="padding:6px 20px 20px 20px;">
    <div style="font-size:16px;font-weight:800;margin-bottom:4px;">${WD[weekday]} ${time} · ${court?court.name:''}</div>
    <div style="display:flex;flex-direction:column;gap:8px;margin-top:12px;">
      ${actions.length===0 ? `<div style="font-size:13px;color:#94a3b8;padding:16px 0;text-align:center;">이 자리에서 가능한 작업이 없습니다.</div>` : actions.map(a=>`<div style="padding:12px 14px;border-radius:12px;background:#f8fafc;border:1px solid #e2e8f0;font-size:14px;font-weight:700;cursor:pointer;${a.danger?'color:#b91c1c;':'color:#0f172a;'}" onclick="closeModal();${a.fn}">${a.label}</div>`).join('')}
    </div>
  </div>`;
  openModal(html);
}

function chooseLessonType(type){

/* ---------- 1b-3) 기타 — 시작·종료 시간과 인원을 직접 정하는 1회성(그 날짜만) 수업 ----------

function openAddOtherClassForm(dateISO, courtId, startTime, repCoachId){

function otherClassField(key, val){ STATE._otherClass[key] = val; renderAddOtherClassForm(); }
function renderAddOtherClassForm(){

  <div style="padding:6px 20px 20px 20px;">
    <div style="font-size:16px;font-weight:800;margin-bottom:4px;">기타 수업</div>
    <div style="font-size:12px;color:#94a3b8;font-weight:600;margin-bottom:14px;">${o.dateISO} · ${courtById(o.courtId)?courtById(o.courtId).name:''} · 시간과 인원을 직접 정하는 1회성 수업입니다</div>

    <div class="field-label" style="margin-top:12px;">종료 시간</div>
    <div style="display:flex;gap:6px;flex-wrap:wrap;max-height:100px;overflow-y:auto;">${endOptions.map(h=>`<div class="chip-select ${o.endTime===h?'on':''}" onclick="otherClassField('endTime','${h}')">${h}</div>`).join('')}</div>

  </div>`;
  openModal(html);
}
async function submitOtherClass(){
  const o = STATE._otherClass;
  const capacity = parseInt(o.capacity)||0;
  if (o.endTime<=o.startTime) { toast('종료 시간이 시작 시간보다 늦어야 합니다'); return; }
  if (!capacity) { toast('인원을 입력하세요'); return; }
  if (!o.coachId) { toast('코치를 선택하세요'); return; }
  const payload = { coach_id:o.coachId, weekday:null, start_time:o.startTime, end_time:o.endTime, court_id:o.courtId, product_id:null, custom_capacity:capacity, class_type:'other', specific_date:o.dateISO };
  const { error } = await sb.from('class_templates').insert(payload);
  if (error) { toast('생성 실패: '+error.message); return; }
  await addLog(null, '', `기타 수업 생성: ${o.dateISO} ${o.startTime}~${o.endTime} · ${staffById(o.coachId).name} 코치 · ${courtById(o.courtId).name} · 정원 ${capacity}명`);
  const { data } = await sb.from('class_templates').select('*');
  STATE.classTemplates = (data||[]).map(templateRowToState);
  closeModal(); render();
  toast('기타 수업이 생성되었습니다');
}
function openJoinOtherClassPicker(dateISO, time, courtId, tplId){
  STATE._joinOther = { dateISO, time, courtId, tplId, query:'' };
  renderJoinOtherClassPicker();
}
function joinOtherSearch(el){
  STATE._joinOther.query = el.value;
  const box = document.getElementById('joinOtherResults');
  if (box) box.innerHTML = joinOtherResultsHtml();
}
function joinOtherResultsHtml(){
  const j = STATE._joinOther;
  const q = (j.query||'').trim();
  const results = q ? STATE.members.filter(m=>m.name.includes(q)).slice(0,20) : [];
  return (q && results.length===0 ? `<div style="font-size:12px;color:#94a3b8;padding:6px 0;">일치하는 회원이 없습니다.</div>` : '')
    + results.map(m=>`<div class="m-card" style="display:flex;align-items:center;justify-content:space-between;padding:9px 12px;cursor:pointer;" onclick="joinOtherClass('${m.id}')">
        <span style="min-width:0;"><span style="font-size:13px;font-weight:700;">${m.name}</span><span style="font-size:11px;color:#94a3b8;font-weight:600;margin-left:6px;">${m.phone||'-'}</span></span>
        <span style="font-size:11px;color:#4f46e5;font-weight:700;flex-shrink:0;">+ 추가</span>
      </div>`).join('');
}
function renderJoinOtherClassPicker(){
  const j = STATE._joinOther;
  const tpl = STATE.classTemplates.find(t=>t.id===j.tplId);
  const html = `<div class="sheet-handle"></div><div class="sheet-close" onclick="closeModal()">${ICONS.x}</div>
  <div style="padding:6px 20px 20px 20px;">
    <div style="font-size:16px;font-weight:800;margin-bottom:4px;">회원 추가</div>
    <div style="font-size:12px;color:#94a3b8;font-weight:600;margin-bottom:14px;">${tpl?tpl.startTime+'~'+tpl.endTime:''} · ${courtById(j.courtId)?courtById(j.courtId).name:''} · 정원 ${tpl?tpl.customCapacity:'-'}명</div>
    <input type="text" value="${j.query}" oninput="joinOtherSearch(this)" placeholder="회원 이름 검색" />
    <div id="joinOtherResults" style="display:flex;flex-direction:column;gap:6px;margin-top:8px;max-height:240px;overflow-y:auto;">${joinOtherResultsHtml()}</div>
  </div>`;

}
async function joinOtherClass(memberId){
  const j = STATE._joinOther;
  const tpl = STATE.classTemplates.find(t=>t.id===j.tplId);
  if (!tpl) { toast('반 정보를 찾을 수 없습니다'); return; }
  const hours = templateHours(tpl);
  const rows = hours.map(h=>({ member_id: memberId, date: j.dateISO, start_time: h, coach_id: tpl.coachId, court_id: tpl.courtId, origin_type:'manual', status:'scheduled', capacity_override:true }));
  const { error } = await sb.from('class_sessions').insert(rows);
  if (error) { toast('등록 실패: '+error.message); return; }
  await refreshAllDataQuiet();
  const m = memberById(memberId);
  await addLog(memberId, m.name, `기타 반 참여: ${j.dateISO} ${tpl.startTime}~${tpl.endTime} · ${courtById(tpl.courtId).name}`);
  closeModal(); render();
  toast(`${m.name} 회원이 등록되었습니다`);
}

/* ---------- 1c) 관리자 전용 — 코트가 비어있으면 그 자리에서 바로 특수 반(동료학습반 등)을 만든다 ----------
   정규 상품/코트배정과 무관하게, 하루짜리로 시간(몇 시간이든)·인원(몇 명이든) 자유롭게 정해서 만든다.
   같은 group_id로 묶인 세션들은 courtHourLinkKey 덕분에 시간표에서 자동으로 테두리로 이어져 보인다. */
function openAddAdhocClassForm(dateISO, startTime, courtId){
  if (!isOwner()) return;
  const coaches = activeCoaches();
  STATE._adhocClass = { dateISO, courtId, startTime, endTime: hourPlusOne(startTime), coachId: (coaches[0]||{}).id, label:'', memberQuery:'', selectedMembers: [] };
  renderAddAdhocClassForm();
}
function adhocClassField(key, val){ STATE._adhocClass[key] = val; renderAddAdhocClassForm(); }
function adhocClassSearch(el){
  STATE._adhocClass.memberQuery = el.value;
  const box = document.getElementById('adhocMemberResults');
  if (box) box.innerHTML = adhocMemberResultsHtml();
}
function adhocMemberResultsHtml(){
  const a = STATE._adhocClass;
  const q = (a.memberQuery||'').trim();
  const results = q ? STATE.members.filter(m=>m.name.includes(q) && !a.selectedMembers.includes(m.id)).slice(0,20) : [];
  return (q && results.length===0 ? `<div style="font-size:12px;color:#94a3b8;padding:6px 0;">일치하는 회원이 없습니다.</div>` : '')

        <span style="min-width:0;"><span style="font-size:13px;font-weight:700;">${m.name}</span><span style="font-size:11px;color:#94a3b8;font-weight:600;margin-left:6px;">${m.phone||'-'}</span></span>
        <span style="font-size:11px;color:#4f46e5;font-weight:700;flex-shrink:0;">+ 추가</span>
      </div>`).join('');
}
function adhocAddMember(memberId){
  const a = STATE._adhocClass;
  if (!a.selectedMembers.includes(memberId)) a.selectedMembers.push(memberId);
  a.memberQuery = '';
  renderAddAdhocClassForm();
}
function adhocRemoveMember(memberId){
  const a = STATE._adhocClass;
  a.selectedMembers = a.selectedMembers.filter(id=>id!==memberId);
  renderAddAdhocClassForm();
}
function renderAddAdhocClassForm(){
  const a = STATE._adhocClass;
  const coaches = activeCoaches();
  const endOptions = [...OPERATING_HOURS, hourPlusOne(OPERATING_HOURS[OPERATING_HOURS.length-1])].filter(h=>h>a.startTime);
  const selectedMembers = a.selectedMembers.map(id=>memberById(id)).filter(Boolean);
  const html = `<div class="sheet-handle"></div><div class="sheet-close" onclick="closeModal()">${ICONS.x}</div>
  <div style="padding:6px 20px 20px 20px;">
    <div style="font-size:16px;font-weight:800;margin-bottom:4px;">수업 추가</div>
    <div style="font-size:12px;color:#94a3b8;font-weight:600;margin-bottom:14px;">${a.dateISO} (${WD[fromISO(a.dateISO).getDay()]}) · ${courtById(a.courtId)?courtById(a.courtId).name:''} · 정규 상품과 무관하게 시간·인원을 자유롭게 정하는 특수 반입니다 (예: 동료학습반)</div>
    <div class="field-label">반 이름 (선택)</div>
    <input type="text" value="${a.label}" oninput="adhocClassField('label', this.value)" placeholder="예: 동료학습반" />
    <div class="field-label" style="margin-top:12px;">시작 시간</div>
    <div style="display:flex;gap:6px;flex-wrap:wrap;max-height:100px;overflow-y:auto;">${OPERATING_HOURS.map(h=>`<div class="chip-select ${a.startTime===h?'on':''}" onclick="adhocClassField('startTime','${h}')">${h}</div>`).join('')}</div>
    <div class="field-label" style="margin-top:12px;">종료 시간</div>
    <div style="display:flex;gap:6px;flex-wrap:wrap;max-height:100px;overflow-y:auto;">${endOptions.map(h=>`<div class="chip-select ${a.endTime===h?'on':''}" onclick="adhocClassField('endTime','${h}')">${h}</div>`).join('')}</div>
    <div class="field-label" style="margin-top:12px;">담당 코치</div>
    <div style="display:flex;gap:6px;flex-wrap:wrap;">${coaches.map(c=>`<div class="chip-select ${a.coachId===c.id?'on':''}" onclick="adhocClassField('coachId','${c.id}')">${c.name}</div>`).join('')}</div>
    <div class="field-label" style="margin-top:12px;">회원 추가 (인원 자유)</div>
    ${selectedMembers.length>0 ? `<div style="display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px;">${selectedMembers.map(m=>`<span class="chip-select on" style="display:flex;align-items:center;gap:6px;cursor:pointer;" onclick="adhocRemoveMember('${m.id}')">${m.name} ✕</span>`).join('')}</div>` : ''}
    <input type="text" value="${a.memberQuery}" oninput="adhocClassSearch(this)" placeholder="회원 이름 검색해서 추가" />
    <div id="adhocMemberResults" style="display:flex;flex-direction:column;gap:6px;margin-top:8px;max-height:200px;overflow-y:auto;">${adhocMemberResultsHtml()}</div>
    <div style="font-size:11px;color:#94a3b8;font-weight:600;margin-top:10px;">현재 ${selectedMembers.length}명 선택됨</div>
    <div class="btn-primary ${a.endTime<=a.startTime?'disabled':''}" style="margin-top:16px;" onclick="submitAdhocClass()">수업 만들기</div>
  </div>`;
  openModal(html);
}
async function submitAdhocClass(){
  const a = STATE._adhocClass;
  if (a.endTime<=a.startTime) { toast('종료 시간이 시작 시간보다 늦어야 합니다'); return; }
  if (!a.coachId) { toast('코치를 선택하세요'); return; }
  if (a.selectedMembers.length===0) { toast('최소 1명 이상 회원을 추가하세요'); return; }
  const { error } = await sb.rpc('create_adhoc_class', {
    p_date: a.dateISO, p_start_time: a.startTime, p_end_time: a.endTime, p_coach_id: a.coachId,
    p_court_id: a.courtId, p_member_ids: a.selectedMembers, p_label: a.label||null
  });
  if (error) { toast('생성 실패: '+error.message); return; }
  await refreshAllDataQuiet();
  await addLog(null, '', `수업 추가: ${a.label||'특수 반'} · ${a.dateISO} ${a.startTime}~${a.endTime} · ${staffById(a.coachId).name} 코치 · ${courtById(a.courtId).name} · ${a.selectedMembers.length}명`);
  closeModal(); render();
  toast(`${a.label||'수업'}이 생성되었습니다`);
}
async function cancelAdhocClass(groupId){
  const { error } = await sb.from('class_sessions').update({ status:'cancelled' }).eq('group_id', groupId);
  if (error) { toast('취소 실패: '+error.message); return; }
  STATE.sessions.filter(s=>s.groupId===groupId).forEach(s=>{ s.status = 'cancelled'; });
  render();
  toast('수업이 취소되었습니다');
}

/* ---------- 2) 잔여석 현황판 ---------- */
function availabilityView(){
  const mode = STATE.availMode || 'weekday';
  const coaches = activeCoaches();

  let html = `<div style="padding:14px 18px;">
    <div style="font-size:16px;font-weight:800;">잔여석 현황판</div>
    <div style="font-size:11px;color:#94a3b8;font-weight:600;margin-top:2px;">신규 문의 응대용</div>
    <div style="display:flex;gap:6px;margin-top:12px;">
      <div class="chip-select ${mode==='weekday'?'on':''}" onclick="setAvailMode('weekday')">요일별 보기</div>
      <div class="chip-select ${mode==='time'?'on':''}" onclick="setAvailMode('time')">시간별 보기</div>
      <div class="chip-select ${mode==='coach'?'on':''}" onclick="setAvailMode('coach')">코치별 보기</div>
    </div>
  </div>`;

  if (mode==='weekday') {
    const weekday = STATE.availWeekday || 0;
    const rows = availabilityForWeekday(weekday);
    const totalRemain14 = rows.filter(r=>{ const p=productById(r.productId); return p && p.mode==='monthly' && p.capacity>=3; }).reduce((a,r)=>a+Math.max(r.remaining,0),0);
    const p12rows = rows.filter(r=>{ const p=productById(r.productId); return p && p.mode==='monthly' && p.capacity<3; });
    const p12tight = p12rows.some(r=>r.remaining<=1);

    html += `<div style="padding:0 18px;">
      <div style="display:flex;gap:8px;">
        <div style="flex:1;background:#f0fdf4;border:1px solid #bbf7d0;border-radius:12px;padding:9px 10px;">
          <div style="font-size:10px;font-weight:700;color:#15803d;">1:4 레슨</div>
          <div style="font-size:12px;font-weight:800;color:#15803d;margin-top:2px;">${totalRemain14}자리 여유</div>
        </div>
        <div style="flex:1;background:${p12tight?'#fffbeb':'#f0fdf4'};border:1px solid ${p12tight?'#fde68a':'#bbf7d0'};border-radius:12px;padding:9px 10px;">
          <div style="font-size:10px;font-weight:700;color:${p12tight?'#b45309':'#15803d'};">1:2 레슨</div>
          <div style="font-size:12px;font-weight:800;color:${p12tight?'#b45309':'#15803d'};margin-top:2px;">${p12tight?'마감임박':'여유'}</div>
        </div>
        <div style="flex:1;background:#eff6ff;border:1px solid #bfdbfe;border-radius:12px;padding:9px 10px;">
          <div style="font-size:10px;font-weight:700;color:#1d4ed8;">개인레슨</div>
          <div style="font-size:12px;font-weight:800;color:#1d4ed8;margin-top:2px;">코치 ${coaches.length}명</div>
        </div>
      </div>
      <div style="display:flex;gap:6px;margin-top:14px;">`;
    WD.forEach((w,i)=>{
      const on = i===weekday;
      html += `<div class="day-chip" style="flex:1;background:${on?'#0f172a':'#f1f5f9'};" onclick="setAvailWeekday(${i})"><span style="font-size:11px;font-weight:700;color:${on?'#fff':'#94a3b8'};">${w}</span></div>`;
    });
    html += `</div></div>`;

    html += `<div style="padding:14px 18px 0 18px;">
      <div style="font-size:12px;font-weight:700;color:#94a3b8;margin-bottom:8px;">${WD[weekday]}요일 · 코치 상관없이 전체 잔여석</div>`;
    const byProdAll = {};
    rows.forEach(r=>{ byProdAll[r.productId] = (byProdAll[r.productId]||0) + Math.max(r.remaining,0); });
    if (Object.keys(byProdAll).length===0) {
      html += `<div style="font-size:13px;color:#94a3b8;padding:6px 0 14px 0;">이 요일엔 등록된 정규수업이 없습니다.</div>`;
    } else {
      html += `<div class="m-card" style="display:flex;align-items:center;gap:8px;margin-bottom:14px;flex-wrap:wrap;background:#f8fafc;">
        <span style="font-size:13px;font-weight:800;">전체</span>
        <div style="flex:1;display:flex;gap:6px;justify-content:flex-end;flex-wrap:wrap;">
          ${Object.keys(byProdAll).sort().map(pid=>{
            const p = productById(pid); const remain = byProdAll[pid]; const lab = availLabel(remain);
            return `<span class="avail-pill" style="background:${lab.bg};color:${lab.color};cursor:pointer;" onclick="openSlotMembersList(${weekday}, null, null, '${pid}')">${p.name.split(' ')[0]} 전체 ${remain}자리</span>`;
          }).join('')}
        </div>
      </div>`;
    }

    html += `<div style="font-size:12px;font-weight:700;color:#94a3b8;margin-bottom:8px;">${WD[weekday]}요일 · 코치별 잔여석 (전화 응대용)</div>`;
    const summaryCoaches = coaches.filter(c=>rows.some(r=>r.coachId===c.id));
    if (summaryCoaches.length===0) html += `<div style="font-size:13px;color:#94a3b8;padding:6px 0 14px 0;">이 요일엔 등록된 정규수업이 없습니다.</div>`;

function openSlotMembersList(weekday, time, coachId, productId){
  const slots = STATE.slots.filter(sl=>sl.active && sl.weekday===weekday && sl.productId===productId && (coachId===null || sl.coachId===coachId) && (time===null || sl.time===time));
  const rows = slots.map(sl=>({member: memberById(sl.memberId), slot: sl})).filter(r=>r.member).sort((a,b)=>a.slot.time.localeCompare(b.slot.time));
  const product = productById(productId);
  const coach = coachId ? staffById(coachId) : null;

  const memberRow = r => `<div class="m-card" style="display:flex;align-items:center;justify-content:space-between;cursor:pointer;" onclick="closeModal();openMemberSheet('${r.member.id}')">
    <span style="font-size:13px;font-weight:700;">${r.member.name}</span>
    <span style="font-size:11px;color:#94a3b8;font-weight:600;">${staffById(r.slot.coachId)?staffById(r.slot.coachId).name+' · ':''}${courtById(r.slot.courtId)?courtById(r.slot.courtId).name:''}</span>
  </div>`;

  let body;

    body = `<div style="display:flex;flex-direction:column;gap:6px;">${rows.map(memberRow).join('')}</div>`;
  } else {
    const byTime = {};
    rows.forEach(r=>{ (byTime[r.slot.time] = byTime[r.slot.time]||[]).push(r); });
    body = Object.keys(byTime).sort().map(t=>{
      const group = byTime[t];
      return `<div style="margin-bottom:14px;">
        <div style="display:flex;align-items:center;gap:8px;margin-bottom:6px;">
          <span style="font-size:13px;font-weight:800;">${t}</span>
          <span style="font-size:11px;color:#94a3b8;font-weight:700;">${group.length}명 · 같은 반</span>
        </div>
        <div style="display:flex;flex-direction:column;gap:6px;">${group.map(memberRow).join('')}</div>
      </div>`;
    }).join('');
  }

  const html = `<div class="sheet-handle"></div><div class="sheet-close" onclick="closeModal()">${ICONS.x}</div>

    <div style="font-size:16px;font-weight:800;margin-bottom:4px;">${WD[weekday]}요일 ${time?time+' · ':''}${coach?coach.name+' · ':''}${product?product.name.split(' ')[0]:''}</div>

    ${body}
  </div>`;
  openModal(html);
}

function shiftCoachAvailMonth(coachId, n){
  const mp = STATE._coachAvailMonth;
  let mo = mp.month+n, y = mp.year;
  while (mo>11){ mo-=12; y++; }
  while (mo<0){ mo+=12; y--; }
  mp.month = mo; mp.year = y;
  renderCoachAvailability(coachId);
}

function coachAvailMonthGridHtml(coachId){
  const mp = STATE._coachAvailMonth;

  const startOffset = first.getDay();
  const daysInMonth = new Date(mp.year, mp.month+1, 0).getDate();

function openCoachDayAvailability(coachId, dateIso){

  openModal(html);

function nextDateForWeekday(weekday){
  let d = fromISO(STATE.today);
  while (d.getDay() !== weekday) d = addDays(d, 1);
  return toISO(d);
}
function freeCourtFor(date, time){
  const used = new Set();
  STATE.sessions.filter(s=>s.date===date && s.startTime===time && s.status!=='cancelled' && s.courtId).forEach(s=>used.add(s.courtId));
  STATE.slots.filter(s=>s.active && s.time===time && fromISO(date).getDay()===s.weekday && s.courtId).forEach(s=>used.add(s.courtId));
  return STATE.courts.find(c=>!used.has(c.id));
}

// 시간표/내수업 탭과 같은 방식으로, 회원 검색창+필터는 render()의 sticky-top-wrap 안에 넣어서

// 회원등록현황 그리드에서 쓰는 "요일 표시 순서" — 월~일
const REGSTATUS_WEEKDAYS = [1,2,3,4,5,6,0];
// 특정 (요일,시간,코트) 한 칸의 정규수업 정보를 시간표(timetableView)와 완전히 같은 기준으로 계산한다.
// 템플릿 하나가 여러 시간을 덮어도(예: 17:00~22:00) 각 시간마다 실제 등록된 회원은 다를 수 있으므로,
// 반드시 시간 단위(cell)로 봐야 한다 — 예전에는 템플릿의 시작시간(startTime)에 등록된 회원만 집계해서
// 다른 시간대 회원이 통째로 누락/뭉뚱그려 보이는 문제가 있었다.
function regStatusCell(weekday, time, courtId){
  const tpl = templateForCell(courtId, time, weekday, null);
  if (!tpl || (tpl.classType||'regular')!=='regular') return null;
  const product = productById(tpl.productId);
  const cap = effectiveCapacity(product, weekday, courtId, tpl.coachId, time);
  const members = STATE.slots.filter(s=>s.active && s.weekday===weekday && s.time===time && s.courtId===courtId && s.coachId===tpl.coachId)
    .map(s=>({slotId:s.id, member: memberById(s.memberId)}))
    .filter(x=>x.member);
  return { tpl, product, cap, members, court: courtById(courtId) };
}
function regStatusCoachCell(coachId, weekday, time){
  for (const court of STATE.courts) {
    const cell = regStatusCell(weekday, time, court.id);
    if (cell && cell.tpl.coachId===coachId) return cell;
  }
  return null;
}
// 회원등록현황 — 시간표와 같은 구조(세로=시간, 가로=요일)의 주간 격자로 배정 현황을 보여준다.
// 코치를 고르면 그 코치의 월~일 전체가, "전체"를 고르면 요일×코트가 함께 나온다.
function memberRegistrationStatusView(){
  const coachFilter = STATE.regStatusCoach || 'all';
  const yearMonth = STATE.regStatusMonth || ym(fromISO(STATE.today));
  if (coachFilter==='all') {
    return `<div style="padding:14px 18px;">
      <div class="btn-secondary" style="margin-bottom:12px;" onclick="openAddTemplateForm()">+ 반 개설</div>
      <div style="overflow-x:auto;-webkit-overflow-scrolling:touch;padding-bottom:4px;">${regStatusAllGridHtml(yearMonth)}</div>
    </div>`;
  }
  return `<div style="padding:14px 18px;">
    <div class="btn-secondary" style="margin-bottom:12px;" onclick="openAddTemplateForm()">+ 반 개설</div>
    ${regStatusCoachListHtml(coachFilter, yearMonth)}
  </div>`;
}
// 코치 한 명을 골랐을 때 — 빈 칸 없이, 그 코치가 실제로 배정된 (요일,시간) 수업만 카드로 나열한다.
// 요일×시간 격자를 다 채우면 코치가 안 가르치는 칸이 대부분이라 빈칸투성이가 되므로, 실제 있는 것만 보여준다.
function regStatusCoachListHtml(coachId, yearMonth){
  const items = [];
  REGSTATUS_WEEKDAYS.forEach(wd=>{
    OPERATING_HOURS.forEach(h=>{
      const cell = regStatusCoachCell(coachId, wd, h);
      if (cell) items.push({ wd, h, cell });
    });
  });
  if (items.length===0) return `<div style="text-align:center;padding:40px 0;color:#94a3b8;font-size:13px;">배정된 정규수업이 없습니다.</div>`;
  const cards = items.map(({wd, h, cell})=>{
    const { tpl, product, cap, members, court } = cell;
    const openSlots = cap!=null ? Math.max(0, cap-members.length) : 0;
    return `<div class="m-card" style="padding:10px;">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:6px;gap:4px;">
        <div style="min-width:0;">
          <div style="font-size:12px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${WD[wd]} ${h}</div>
          <div style="font-size:10px;color:#94a3b8;font-weight:600;margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${court?court.name:''}${product?' · '+product.name:''}</div>
        </div>
        <span class="cap-badge" style="font-size:9px;padding:2px 7px;flex-shrink:0;">${members.length}${cap!=null?'/'+cap:''}</span>
      </div>
      <div style="display:flex;flex-direction:column;gap:2px;">
        ${members.map(x=>{
          const enr = STATE.enrollments.find(e=>e.slotId===x.slotId && e.yearMonth===yearMonth);
          const paid = enr ? enr.paymentStatus==='paid' : null;
          const dot = paid===true ? '#22c55e' : (paid===false ? '#ef4444' : '#cbd5e1');
          return `<div style="display:flex;align-items:center;justify-content:space-between;padding:4px 0;border-top:1px solid #f1f5f9;gap:4px;">
            <span style="display:flex;align-items:center;gap:5px;min-width:0;cursor:pointer;" onclick="openMemberSheet('${x.member.id}')">
              <span style="width:6px;height:6px;border-radius:50%;background:${dot};flex-shrink:0;"></span>
              <span style="font-size:11px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${x.member.name}</span>
            </span>
            <span style="font-size:10px;color:#b91c1c;font-weight:700;cursor:pointer;flex-shrink:0;" onclick="confirmCancelMemberSlot('${x.slotId}')">삭제</span>
          </div>`;
        }).join('')}
      </div>
      ${openSlots>0 ? `<div style="color:#4f46e5;font-size:10px;font-weight:800;cursor:pointer;margin-top:6px;" onclick="openAssignMemberToClass('${tpl.id}',${wd},'${h}','${tpl.courtId}')">+ 회원 추가</div>` : ''}
    </div>`;
  }).join('');
  return `<div style="display:grid;grid-template-columns:repeat(2,1fr);gap:8px;">${cards}</div>`;
}
// "전체"를 골랐을 때 — 요일×코트를 가로로 이어붙인 격자. 칸이 좁아 코치 이니셜+인원만 보여주고,
// 눌러야 그 칸의 회원 명단(추가/취소)이 나오는 상세 시트를 연다.
function regStatusAllGridHtml(yearMonth){
  const courts = STATE.courts;
  const cellsByHour = {};
  OPERATING_HOURS.forEach(h=>{
    const row = [];
    REGSTATUS_WEEKDAYS.forEach(wd=>{ courts.forEach(court=>{ row.push(regStatusCell(wd, h, court.id)); }); });
    if (row.some(c=>c)) cellsByHour[h] = row;
  });
  const hours = Object.keys(cellsByHour).sort();
  if (hours.length===0) return `<div style="text-align:center;padding:40px 0;color:#94a3b8;font-size:13px;">배정된 정규수업이 없습니다.</div>`;
  const totalCols = REGSTATUS_WEEKDAYS.length * courts.length;
  const colW = 52;
  let html = `<div style="display:grid;grid-template-columns:36px repeat(${totalCols},${colW}px);gap:3px;min-width:${36+totalCols*colW}px;">
    <div></div>
    ${REGSTATUS_WEEKDAYS.map(wd=>`<div style="grid-column:span ${courts.length};text-align:center;font-size:11px;font-weight:800;color:#64748b;padding:2px 0;">${WD[wd]}</div>`).join('')}
    <div></div>
    ${REGSTATUS_WEEKDAYS.map(()=>courts.map(court=>`<div style="text-align:center;font-size:9px;font-weight:700;color:#cbd5e1;">${court.name.replace('코트','')}</div>`).join('')).join('')}`;
  hours.forEach(h=>{
    html += `<div style="position:sticky;left:0;background:#fff;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:#0f172a;">${h}</div>`;
    let ci = 0;
    REGSTATUS_WEEKDAYS.forEach(wd=>{
      courts.forEach(court=>{
        const cell = cellsByHour[h][ci++];
        if (!cell) { html += `<div style="border:1px dashed #f1f5f9;border-radius:6px;min-height:34px;"></div>`; return; }
        const coach = staffById(cell.tpl.coachId);
        html += `<div style="border-radius:6px;min-height:34px;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;background:${coachColor(cell.tpl.coachId)};" onclick="openRegStatusCellDetail(${wd},'${h}','${court.id}')">

function openMyStatList(kind){

  if (kind==='members') {
    const myMemberIds = new Set(STATE.slots.filter(s=>s.coachId===myId && s.active).map(s=>s.memberId));

    title = '담당 회원';
    rows = [...myMemberIds].map(mid=>memberById(mid)).filter(Boolean).sort((a,b)=>a.name.localeCompare(b.name));
    const html = `<div class="sheet-handle"></div><div class="sheet-close" onclick="closeModal()">${ICONS.x}</div>

          <span style="font-size:11px;color:#4f46e5;font-weight:700;">보기</span>
        </div>`).join('')}
      </div>
    </div>`;
    openModal(html);
    return;
  }
  if (kind==='makeup') {
    const mySessions = STATE.sessions.filter(s=>s.coachId===myId && s.status==='makeup_scheduled' && s.date>=STATE.today).sort((a,b)=>a.date.localeCompare(b.date));
    const html = `<div class="sheet-handle"></div><div class="sheet-close" onclick="closeModal()">${ICONS.x}</div>

        ${mySessions.length===0 ? `<div style="font-size:13px;color:#94a3b8;">예정된 보강이 없습니다.</div>` : mySessions.map(s=>{
          const m = memberById(s.memberId);
          return `<div class="m-card" style="display:flex;align-items:center;justify-content:space-between;cursor:pointer;" onclick="closeModal();openMemberSheet('${s.memberId}')">
            <span style="font-size:13px;font-weight:700;">${m?m.name:'-'}</span>
            <span style="font-size:11px;color:#94a3b8;font-weight:700;">${s.date} ${s.startTime}</span>
          </div>`;
        }).join('')}
      </div>
    </div>`;
    openModal(html);
    return;
  }
  // attended / absent: 이번 달 수업 세션 목록
  const mySessions = STATE.sessions.filter(s=>s.coachId===myId && s.date.slice(0,7)===thisMonth && s.status===kind).sort((a,b)=>a.date.localeCompare(b.date));
  title = kind==='attended' ? '출석 처리한 수업' : '결석 처리한 수업';
  const html = `<div class="sheet-handle"></div><div class="sheet-close" onclick="closeModal()">${ICONS.x}</div>
  <div style="padding:6px 20px 20px 20px;">
    <div style="font-size:16px;font-weight:800;margin-bottom:4px;">${monthLabel(thisMonth)} ${title} ${mySessions.length}건</div>
    <div style="display:flex;flex-direction:column;gap:6px;margin-top:10px;">
      ${mySessions.length===0 ? `<div style="font-size:13px;color:#94a3b8;">해당 내역이 없습니다.</div>` : mySessions.map(s=>{
        const m = memberById(s.memberId);
        return `<div class="m-card" style="display:flex;align-items:center;justify-content:space-between;cursor:pointer;" onclick="closeModal();openMemberSheet('${s.memberId}')">
          <span style="font-size:13px;font-weight:700;">${m?m.name:'-'}</span>
          <span style="font-size:11px;color:#94a3b8;font-weight:700;">${s.date} ${s.startTime}</span>
        </div>`;
      }).join('')}
    </div>
  </div>`;
  openModal(html);
}

/* ---------- 본인 비밀번호 변경 ---------- */
function openChangePasswordModal(){
  STATE._changePw = { next:'', confirm:'', error:'' };
  renderChangePasswordModal();
}
function changePwField(key, el){ STATE._changePw[key] = el.value; }
function renderChangePasswordModal(){
  const c = STATE._changePw;
  const html = `<div class="sheet-handle"></div><div class="sheet-close" onclick="closeModal()">${ICONS.x}</div>
  <div style="padding:6px 20px 20px 20px;">
    <div style="font-size:16px;font-weight:800;margin-bottom:4px;">비밀번호 변경</div>
    <div style="font-size:12px;color:#94a3b8;font-weight:600;margin-bottom:14px;">${STATE.myName} 계정의 비밀번호를 바꿉니다</div>
    <div class="field-label">새 비밀번호</div>
    <input type="password" value="${c.next}" oninput="changePwField('next', this)" placeholder="4자 이상" />
    <div class="field-label" style="margin-top:12px;">새 비밀번호 확인</div>
    <input type="password" value="${c.confirm}" oninput="changePwField('confirm', this)" onkeydown="if(event.key==='Enter')submitChangePassword()" placeholder="다시 입력" />
    ${c.error ? `<div style="font-size:12px;color:#dc2626;font-weight:700;margin-top:8px;">${c.error}</div>` : ''}
    <div class="btn-primary" style="margin-top:16px;" onclick="submitChangePassword()">변경하기</div>
  </div>`;
  openModal(html);
}
async function submitChangePassword(){
  const c = STATE._changePw;
  if (c.next.length < 6) { c.error='비밀번호는 6자 이상으로 해주세요'; renderChangePasswordModal(); return; }
  if (c.next !== c.confirm) { c.error='두 비밀번호가 서로 다릅니다'; renderChangePasswordModal(); return; }
  const { error } = await sb.auth.updateUser({ password: c.next });
  if (error) { c.error = error.message; renderChangePasswordModal(); return; }
  closeModal();
  toast('비밀번호가 변경되었습니다');
}

async function submitAddTemplate(){
  const t = STATE._newTemplate;
  const isEdit = !!t.editId;
  const isRegular = t.classType==='regular';
  if (!t.coachId) { toast('코치를 선택하세요'); return; }
  if (t.startTime >= t.endTime) { toast('종료 시간이 시작 시간보다 늦어야 합니다'); return; }
  if (!isRegular && !t.specificDate) { toast('날짜를 선택하세요'); return; }
  const customCapacity = t.customCapacity ? parseInt(t.customCapacity)||null : null;
  if (isRegular && !t.productId) { toast('상품을 선택하세요'); return; }
  if (t.classType==='other' && !customCapacity) { toast('인원을 입력하세요'); return; }
  const hours = templateHours(t);
  const newWeekday = isRegular ? t.weekday : fromISO(t.specificDate).getDay();
  const conflictTpl = STATE.classTemplates.find(o=>{
    if (o.id===t.editId || o.coachId===t.coachId || o.courtId!==t.courtId) return false;
    if (!templateHours(o).some(h=>hours.includes(h))) return false;
    if (o.classType!=='regular' && !isRegular) return o.specificDate===t.specificDate;
    const oWeekday = (o.classType==='regular'||!o.classType) ? o.weekday : (o.specificDate?fromISO(o.specificDate).getDay():null);
    return oWeekday===newWeekday;
  });
  if (conflictTpl) {
    toast(`${courtById(t.courtId).name}는 그 시간에 이미 ${staffById(conflictTpl.coachId).name} 코치에게 배정되어 있습니다`);
    return;
  }
  const payload = {
    coach_id:t.coachId,
    weekday: isRegular ? t.weekday : null,
    start_time:t.startTime, end_time:t.endTime, court_id:t.courtId,
    product_id: isRegular ? (t.productId||null) : null,
    custom_capacity: isRegular ? null : customCapacity,
    class_type: t.classType,
    specific_date: isRegular ? null : t.specificDate
  };
  if (isEdit) {
    const { error } = await sb.from('class_templates').update(payload).eq('id', t.editId);
    if (error) { toast('저장 실패: '+error.message); return; }
  } else {
    const { error } = await sb.from('class_templates').insert(payload);
    if (error) { toast('저장 실패: '+error.message); return; }
  }
  const label = isRegular ? WD[t.weekday]+'요일 (매주)' : t.specificDate+' (1회성)';
  await addLog(null, '', `수업 배정 ${isEdit?'수정':'추가'}: ${staffById(t.coachId).name} 코치 · ${label} ${t.startTime}~${t.endTime} · ${courtById(t.courtId).name}`);
  const { data } = await sb.from('class_templates').select('*');
  STATE.classTemplates = (data||[]).map(templateRowToState);
  closeModal(); render();
  toast(isEdit ? '수업이 수정되었습니다' : '수업이 배정되었습니다');
}

// 드래그 중에는 전체 render()를 다시 부르지 않고 DOM만 직접 옮기다가, 놓았을 때 한 번만 서버에 저장한다.
function startProductDrag(ev, productId){
  ev.preventDefault();
  ev.stopPropagation();
  const container = document.getElementById('productListBox');
  const item = container.querySelector(`[data-product-id="${productId}"]`);
  if (!item) return;
  item.style.opacity = '0.5';
  function onMove(e){
    const y = e.clientY;
    const siblings = [...container.children].filter(x=>x!==item);
    let target = null;
    for (const sib of siblings) {
      const rect = sib.getBoundingClientRect();
      if (y < rect.top + rect.height/2) { target = sib; break; }
    }
    if (target) container.insertBefore(item, target);
    else container.appendChild(item);
  }
  function onUp(){
    document.removeEventListener('pointermove', onMove);
    document.removeEventListener('pointerup', onUp);
    item.style.opacity = '';
    const orderedIds = [...container.children].map(el=>el.dataset.productId);
    commitProductOrder(orderedIds);
  }
  document.addEventListener('pointermove', onMove);
  document.addEventListener('pointerup', onUp);
}
async function commitProductOrder(orderedIds){
  orderedIds.forEach((id,i)=>{ const p = STATE.products.find(x=>x.id===id); if (p) p.sortOrder = i; });
  STATE.products.sort((a,b)=>(a.sortOrder||0)-(b.sortOrder||0));
  await Promise.all(orderedIds.map((id,i)=>sb.from('products').update({ sort_order: i }).eq('id', id)));
  render();
}

async function submitEditProduct(){
  const p = STATE._editProduct;
  const name = (p.name||'').trim();
  const price = parseInt(p.price)||0;
  const capacity = parseInt(p.capacity)||1;
  const ruleCount = parseInt(p.ruleCount)||1;
  if (!name) { toast('상품명을 입력하세요'); return; }
  let payload;
  if (p.mode==='monthly') payload = { name, price, registration_mode:'monthly', session_rule_type:'fixed_count', session_rule_count: ruleCount, capacity };
  else payload = { name, price, registration_mode:'session_pack', session_rule_count: ruleCount, capacity, pack_valid_days: parseInt(p.validDays)||90 };
  const { data, error } = await sb.from('products').update(payload).eq('id', p.id).select().single();
  if (error) { toast('저장 실패: '+error.message); return; }
  const idx = STATE.products.findIndex(x=>x.id===p.id);
  if (idx>=0) STATE.products[idx] = productRowToState(data);
  await addLog(null, '', `수강상품 수정: ${name} (정원 ${capacity}명)`);
  closeModal(); render();
  toast('저장되었습니다');
}

/* ---------- 휴무일 관리 (월 4주차 운영 — 한 달에 같은 요일이 5번 있으면 마지막 회차를 휴무 처리) ---------- */
function closedDatesView(){
  const dates = [...(STATE.closedDates||[])].sort((a,b)=>a.date.localeCompare(b.date));
  const thisMonth = ym(fromISO(STATE.today));
  const [y,mo] = thisMonth.split('-').map(Number);
  const daysInMonth = new Date(y, mo, 0).getDate();
  const occByWeekday = {};
  for (let d=1; d<=daysInMonth; d++){
    const iso = `${thisMonth}-${String(d).padStart(2,'0')}`;
    const wd = fromISO(iso).getDay();
    (occByWeekday[wd] = occByWeekday[wd]||[]).push(iso);
  }
  const fiveWeekWeekdays = Object.keys(occByWeekday).filter(wd=>occByWeekday[wd].length>=5);

  let html = `<div style="padding:4px 18px 18px 18px;">
    <div style="background:#eff6ff;border:1px solid #bfdbfe;border-radius:12px;padding:12px 14px;margin-bottom:14px;font-size:12px;color:#1d4ed8;font-weight:600;line-height:1.6;">
      여기 등록한 날짜는 정규수업 자동생성 때 건너뜁니다. 더콕은 월 4주차 기준이라, 한 달에 같은 요일이 5번 있을 때 마지막 회차를 휴무로 등록해두면 4회만 생성됩니다.
    </div>`;

  if (fiveWeekWeekdays.length>0) {
    html += `<div style="background:#fffbeb;border:1px solid #fde68a;border-radius:12px;padding:12px 14px;margin-bottom:14px;">
      <div style="font-size:12px;font-weight:800;color:#92400e;margin-bottom:6px;">${monthLabel(thisMonth)} · 이 달에 5번 있는 요일</div>
      ${fiveWeekWeekdays.map(wd=>{
        const occ = occByWeekday[wd];
        const lastDate = occ[occ.length-1];
        const alreadyClosed = dates.some(cd=>cd.date===lastDate);
        return `<div style="display:flex;align-items:center;justify-content:space-between;padding:6px 0;border-top:1px solid #fde68a;">
          <span style="font-size:12px;font-weight:700;color:#78350f;">${WD[wd]}요일 · ${occ.length}회 (마지막 ${lastDate.slice(5)})</span>
          ${alreadyClosed
            ? `<span style="font-size:11px;color:#94a3b8;font-weight:700;">휴무 등록됨</span>`
            : `<span style="font-size:11px;font-weight:800;color:#b45309;cursor:pointer;" onclick="quickAddClosedDate('${lastDate}')">마지막 회차 휴무 등록</span>`}
        </div>`;
      }).join('')}
    </div>`;
  }

  html += `<div class="btn-secondary" style="margin-bottom:14px;" onclick="openAddClosedDateForm()">+ 휴무일 추가</div>`;

  if (dates.length===0) {
    html += `<div style="font-size:13px;color:#94a3b8;padding:10px 0;">등록된 휴무일이 없습니다.</div>`;
  } else {
    dates.forEach(cd=>{
      const court = cd.courtId ? courtById(cd.courtId) : null;
      html += `<div class="m-card" style="display:flex;align-items:center;justify-content:space-between;">
        <div>
          <div style="font-size:13px;font-weight:700;">${cd.date} (${WD[fromISO(cd.date).getDay()]})</div>
          <div style="font-size:11px;color:#94a3b8;font-weight:600;margin-top:2px;">${cd.scope==='court'?(court?court.name:'특정 코트')+' · ':'전체 · '}${cd.reason||'사유 없음'}</div>
        </div>
        <span style="font-size:11px;color:#b91c1c;font-weight:700;cursor:pointer;" onclick="deleteClosedDate('${cd.id}')">삭제</span>
      </div>`;
    });
  }
  html += `</div>`;
  return html;
}

async function submitBulkImport(){
  const b = STATE._bulk;
  const lines = (b.text||'').split('\n').map(l=>l.trim()).filter(Boolean);
  if (lines.length===0) { toast('회원 명단을 입력하세요'); return; }
  const product = productById(b.productId);
  if (!product) { toast('수강상품을 선택하세요'); return; }
  if (!b.coachId) { toast('담당 코치를 선택하세요'); return; }
  // 코트는 따로 고르지 않고, 관리자가 "코트 배정"에서 이미 이 코치·요일·시간에 배정해둔 코트를 그대로 사용한다
  const tpl = STATE.classTemplates.find(t=>t.coachId===b.coachId && t.weekday===b.weekday && templateHours(t).includes(b.time));
  if (!tpl) { toast('이 코치는 해당 요일·시간에 배정된 코트가 없습니다 — 설정 > 코트 배정에서 먼저 배정해주세요'); return; }
  const courtId = tpl.courtId;
  let success=0, fail=0;
  const yearMonth = ym(fromISO(STATE.today));
  for (const line of lines) {
    const parts = line.split(/\t|,/).map(x=>x.trim()).filter(Boolean);
    if (parts.length===0) continue;
    const name = parts[0];
    const phone = parts[1] || '';
    try {
      const { data: newMember, error: mErr } = await sb.from('members').insert({ name, phone, status:'active', memo:'' }).select().single();
      if (mErr) { fail++; continue; }
      STATE.members.push(rowToCamel(newMember));
      if (b.autoPay) {
        const discount = computeBundleDiscount(newMember.id, b.productId);
        const { error } = await sb.rpc('add_monthly_slot', {
          p_member_id: newMember.id, p_weekday: b.weekday, p_start_time: b.time, p_coach_id: b.coachId,
          p_product_id: b.productId, p_court_id: courtId, p_year_month: yearMonth, p_amount: product.price, p_method: '계좌이체',
          p_discount: discount
        });
        if (error) { fail++; continue; }
      } else {
        const { error } = await sb.from('member_slots').insert({
          member_id: newMember.id, weekday: b.weekday, start_time: b.time, coach_id: b.coachId, product_id: b.productId, court_id: courtId
        });
        if (error) { fail++; continue; }
      }
      success++;
    } catch(e) { fail++; }
  }
  await refreshAllDataQuiet();
  STATE._bulk.text = '';
  render();
  toast(`${success}명 등록 완료${fail>0?`, ${fail}명 실패`:''}`);
}

function reportsView(){
  const reportMonth = STATE.reportMonth || ym(fromISO(STATE.today));
  const paidEnrs = STATE.enrollments.filter(e=>e.yearMonth===reportMonth && e.paymentStatus==='paid');
  const pkgThisMonth = STATE.packages.filter(p=>p.purchasedAt && p.purchasedAt.slice(0,7)===reportMonth);
  const totalRevenue = paidEnrs.reduce((a,e)=>a+(e.paymentAmount||0),0) + pkgThisMonth.reduce((a,p)=>a+(p.paymentAmount||0),0);

  const byCoach = {};
  paidEnrs.forEach(e=>{ const slot=slotById(e.slotId); if(!slot) return; byCoach[slot.coachId]=(byCoach[slot.coachId]||0)+(e.paymentAmount||0); });
  pkgThisMonth.forEach(p=>{ byCoach[p.defaultCoachId]=(byCoach[p.defaultCoachId]||0)+(p.paymentAmount||0); });

  const byProduct = {};
  paidEnrs.forEach(e=>{ byProduct[e.productId]=(byProduct[e.productId]||0)+(e.paymentAmount||0); });
  pkgThisMonth.forEach(p=>{ byProduct[p.productId]=(byProduct[p.productId]||0)+(p.paymentAmount||0); });

  const byMethod = {};
  paidEnrs.forEach(e=>{ const k=e.paymentMethod||'미지정'; byMethod[k]=(byMethod[k]||0)+(e.paymentAmount||0); });
  pkgThisMonth.forEach(p=>{ const k=p.paymentMethod||'미지정'; byMethod[k]=(byMethod[k]||0)+(p.paymentAmount||0); });

  const trend = [];
  for (let i=5;i>=0;i--) {
    const mth = addMonths(ym(fromISO(STATE.today)), -i);
    const amt = STATE.enrollments.filter(e=>e.yearMonth===mth && e.paymentStatus==='paid').reduce((a,e)=>a+(e.paymentAmount||0),0)
              + STATE.packages.filter(p=>p.purchasedAt && p.purchasedAt.slice(0,7)===mth).reduce((a,p)=>a+(p.paymentAmount||0),0);
    trend.push({mth, amt});
  }
  const maxTrend = Math.max(1, ...trend.map(t=>t.amt));

  let html = `<div style="padding:4px 18px 18px 18px;">

      <span onclick="shiftReportMonth(1)" style="cursor:pointer;">${ICONS.chevR}</span>
    </div>
    <div class="m-card" style="text-align:center;">
      <div style="font-size:11px;font-weight:700;color:#94a3b8;">이 달 총 매출</div>
      <div style="font-size:24px;font-weight:800;margin-top:4px;">${totalRevenue.toLocaleString()}원</div>
    </div>

    <div style="font-size:12px;font-weight:700;color:#94a3b8;margin:16px 0 8px 0;">코치별 매출 (눌러서 상세보기)</div>`;
  const coachEntries = Object.keys(byCoach).sort((a,b)=>byCoach[b]-byCoach[a]);
  if (coachEntries.length===0) html += `<div style="font-size:13px;color:#94a3b8;">이 달 매출 내역이 없습니다.</div>`;
  coachEntries.forEach(cid=>{
    const coach = staffById(cid);
    const rate = coach ? COACH_COMMISSION_RATES[coach.name] : null;
    const salary = rate!=null ? Math.round(byCoach[cid]*rate) : null;
    html += `<div class="m-card" style="cursor:pointer;" onclick="openCoachRevenueDetail('${cid}')">
