function shiftReportMonth(n){ STATE.reportMonth = addMonths(STATE.reportMonth || ym(fromISO(STATE.today)), n); render(); }
// 코치별 급여율 (매출 대비 %) — 이름 기준. 목록에 없는 코치는 급여를 표시하지 않는다.
const COACH_COMMISSION_RATES = { '유승우':0.32, '김다빈':0.32, '김공수':0.42, '이동선':1.0, '김종성':0.28 };
function openCoachRevenueDetail(coachId){
  const reportMonth = STATE.reportMonth || ym(fromISO(STATE.today));
  const paidEnrs = STATE.enrollments.filter(e=>e.yearMonth===reportMonth && e.paymentStatus==='paid').filter(e=>{ const slot=slotById(e.slotId); return slot && slot.coachId===coachId; });
  const pkgThisMonth = STATE.packages.filter(p=>p.purchasedAt && p.purchasedAt.slice(0,7)===reportMonth && p.defaultCoachId===coachId);
  const byProduct = {};
  paidEnrs.forEach(e=>{ byProduct[e.productId]=(byProduct[e.productId]||0)+(e.paymentAmount||0); });
  pkgThisMonth.forEach(p=>{ byProduct[p.productId]=(byProduct[p.productId]||0)+(p.paymentAmount||0); });
  const total = Object.values(byProduct).reduce((a,b)=>a+b,0);
  const coach = staffById(coachId);
  const rate = coach ? COACH_COMMISSION_RATES[coach.name] : null;
  const salary = rate!=null ? Math.round(total*rate) : null;
  const html = `<div class="sheet-handle"></div><div class="sheet-close" onclick="closeModal()">${ICONS.x}</div>
  <div style="padding:6px 20px 20px 20px;">
    <div style="font-size:16px;font-weight:800;margin-bottom:4px;">${coach?coach.name:'-'} 코치 매출 상세</div>
    <div style="font-size:12px;color:#94a3b8;font-weight:600;margin-bottom:14px;">${monthLabel(reportMonth)}</div>
    <div style="display:flex;flex-direction:column;gap:2px;">
      ${Object.keys(byProduct).length===0 ? `<div style="font-size:13px;color:#94a3b8;">내역이 없습니다.</div>` :
        Object.keys(byProduct).sort((a,b)=>byProduct[b]-byProduct[a]).map(pid=>`
        <div style="display:flex;align-items:center;justify-content:space-between;padding:8px 0;border-top:1px solid #f1f5f9;">
          <span style="font-size:13px;font-weight:700;">${productById(pid)?productById(pid).name:'-'}</span>
          <span style="font-size:13px;font-weight:800;">${byProduct[pid].toLocaleString()}원</span>
        </div>`).join('')}
    </div>
    <div style="display:flex;align-items:center;justify-content:space-between;margin-top:14px;padding-top:10px;border-top:2px solid #0f172a;">
      <span style="font-size:13px;font-weight:800;">합계</span>
      <span style="font-size:14px;font-weight:800;">${total.toLocaleString()}원</span>
    </div>
    ${salary!=null ? `<div style="display:flex;align-items:center;justify-content:space-between;margin-top:8px;">
      <span style="font-size:12px;color:#4f46e5;font-weight:700;">급여 (${Math.round(rate*100)}%)</span>
      <span style="font-size:13px;color:#4f46e5;font-weight:800;">${salary.toLocaleString()}원</span>
    </div>` : ''}
  </div>`;
  openModal(html);
}

function closeModal(){ document.getElementById('modalLayer').innerHTML=''; }
function openModal(html){ document.getElementById('modalLayer').innerHTML = `<div class="sheet-overlay" onclick="if(event.target===this)closeModal()"><div class="sheet" style="position:relative;">${html}</div></div>`; }

function openSessionSheet(sessionId){

  <div style="padding:6px 20px 20px 20px;">

    <div style="margin-top:10px;"><span class="status-badge st-${s.status}">${statusIcon(s.status)}${STATUS_LABEL[s.status]}</span></div>

// 잘못 잡은 보강을 취소한다 — 취소만 하면 끝이 아니라, 원래 있던 결석 건이 이 보강으로
// 연결(linkedSessionId)돼 있었으므로 그 연결도 끊어서 보강자명단에 다시 "보강 대기"로 뜨게 한다.
async function cancelMakeupSession(sessionId){
  const s = sessionById(sessionId); const m = memberById(s.memberId);
  const { error } = await sb.from('class_sessions').update({ status:'cancelled' }).eq('id', sessionId);
  if (error) { toast('취소 실패: '+error.message); return; }
  s.status = 'cancelled';
  const orig = STATE.sessions.find(x=>x.linkedSessionId===s.id);
  if (orig) {
    await sb.from('class_sessions').update({ linked_session_id: null }).eq('id', orig.id);
    orig.linkedSessionId = null;
  }
  await addLog(m?m.id:null, m?m.name:'', `${s.date} ${s.startTime} 보강 취소${orig?` (${orig.date} ${orig.startTime} 결석 → 다시 보강대기)`:''}`);
  closeModal(); render();
  toast('보강이 취소되었습니다');
}

// 시간표의 "경고" 배너/뱃지를 누르면 그날 코트 중복배정·코치 겹침·정원초과 문제를 한 곳에 모아 보여주고,
// 각 수업을 바로 이동하거나 취소해서 해결할 수 있게 한다. focusKey를 주면 그 시간대 카드를 위로 올려 보여준다.
function openConflictDetail(dateISO, focusKey){
  const conflicts = conflictsForDate(dateISO);
  if (conflicts.length===0) { toast('해결할 경고가 없습니다'); closeModal(); return; }
  if (focusKey) conflicts.sort((a,b)=> ((a.time+'|'+(a.courtId||'_none'))===focusKey ? -1 : 0) - ((b.time+'|'+(b.courtId||'_none'))===focusKey ? -1 : 0));
  let html = `<div class="sheet-handle"></div><div class="sheet-close" onclick="closeModal()">${ICONS.x}</div>
  <div style="padding:6px 20px 20px 20px;">
    <div style="font-size:16px;font-weight:800;margin-bottom:4px;">경고 ${conflicts.length}건</div>
    <div style="font-size:12px;color:#94a3b8;font-weight:600;margin-bottom:14px;">${dateISO} · 코트 중복배정 · 코치 겹침 · 정원초과</div>
    <div style="display:flex;flex-direction:column;gap:10px;">`;
  conflicts.forEach(c=>{
    const key = c.time+'|'+(c.courtId||'_none');
    const court = c.courtId ? courtById(c.courtId) : null;
    html += `<div class="m-card" style="${key===focusKey?'border-color:#4f46e5;':'border-color:#fca5a5;'}background:#fffafa;">
      <div style="display:flex;align-items:center;gap:6px;margin-bottom:6px;">
        <span style="display:flex;flex-shrink:0;">${ICONS.warn}</span>
        <span style="font-size:13px;font-weight:800;">${c.time} · ${court?court.name:'코트 미지정'}</span>
      </div>
      <div style="font-size:12px;color:#b91c1c;font-weight:700;margin-bottom:8px;">${c.detail}</div>
      <div style="display:flex;flex-direction:column;">`;
    c.sessions.forEach(s=>{
      const m = memberById(s.memberId); const coach = staffById(s.coachId);
      html += `<div style="display:flex;align-items:center;justify-content:space-between;gap:8px;padding:6px 0;border-top:1px solid #f1f5f9;">
        <span style="min-width:0;font-size:12px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${m?m.name:'(삭제된 회원)'} <span style="color:#94a3b8;font-weight:600;">· ${coach?coach.name:'-'} 코치</span></span>
        <span style="display:flex;gap:12px;flex-shrink:0;">
          <span style="font-size:11px;font-weight:800;color:#4f46e5;cursor:pointer;" onclick="closeModal();openMoveSession('${s.id}')">이동</span>
          <span style="font-size:11px;font-weight:800;color:#b91c1c;cursor:pointer;" onclick="cancelConflictSession('${s.id}','${dateISO}')">취소</span>
        </span>
      </div>`;
    });
    html += `</div></div>`;
  });
  html += `</div></div>`;
  openModal(html);
}
async function cancelConflictSession(sessionId, dateISO){
  const s = sessionById(sessionId); const m = memberById(s.memberId);
  const { error } = await sb.from('class_sessions').update({ status:'cancelled' }).eq('id', sessionId);
  if (error) { toast('취소 실패: '+error.message); return; }
  const before = s.status;
  s.status = 'cancelled';
  await addLog(m?m.id:null, m?m.name:'', `${s.date} ${s.startTime} 수업 ${STATUS_LABEL[before]} → 취소 (중복배정 경고 해결)`);
  render();
  openConflictDetail(dateISO);
}

// 회원 상세의 "9월 수업 현황" 통계 타일들 — 총수업/출석/결석/예정/보강예정을 눌렀을 때 그 날짜 목록을 보여준다.
// kind==='makeup'인 경우는 이미 잡힌 보강 날짜뿐 아니라, 아직 보강 배정이 안 된 결석 건도 같이 보여주고 바로 배정할 수 있게 한다.
const MEMBER_STAT_KIND_LABEL = { all:'전체 수업', attended:'출석일', absent:'결석일', scheduled:'예정일', makeup:'보강' };
function openMemberStatDatesList(memberId, kind){
  const m = memberById(memberId);
  const thisMonth = ym(fromISO(STATE.today));
  const monthSessions = STATE.sessions.filter(s=>s.memberId===memberId && s.date.slice(0,7)===thisMonth);
  let html = `<div class="sheet-handle"></div><div class="sheet-close" onclick="closeModal()">${ICONS.x}</div>
  <div style="padding:6px 20px 20px 20px;">
    <div style="font-size:16px;font-weight:800;margin-bottom:4px;">${m?m.name:''} · ${monthLabel(thisMonth)} ${MEMBER_STAT_KIND_LABEL[kind]}</div>`;

  if (kind==='makeup') {
    const scheduled = monthSessions.filter(s=>s.status==='makeup_scheduled').sort((a,b)=>a.date.localeCompare(b.date));
    const unresolved = STATE.sessions.filter(s=>s.memberId===memberId && s.status==='absent' && !STATE.sessions.some(x=>x.linkedSessionId===s.id)).sort((a,b)=>a.date.localeCompare(b.date));
    html += `<div style="font-size:12px;color:#94a3b8;font-weight:600;margin-bottom:14px;">잡힌 보강 ${scheduled.length}건 · 보강 대기 중인 결석 ${unresolved.length}건</div>
    <div style="display:flex;flex-direction:column;gap:6px;">`;
    if (unresolved.length===0 && scheduled.length===0) html += `<div style="font-size:13px;color:#94a3b8;">보강 관련 내역이 없습니다.</div>`;
    unresolved.forEach(s=>{
      html += `<div class="m-card" style="display:flex;align-items:center;justify-content:space-between;">
        <span style="font-size:13px;font-weight:700;">${s.date} (${WD[fromISO(s.date).getDay()]}) ${s.startTime} 결석</span>
        <span style="font-size:12px;font-weight:800;color:#c2410c;cursor:pointer;" onclick="closeModal();openMakeupPicker('${s.id}')">보강 배정</span>
      </div>`;
    });
    scheduled.forEach(s=>{
      html += `<div class="m-card" style="display:flex;align-items:center;justify-content:space-between;">
        <span style="font-size:13px;font-weight:700;">${s.date} (${WD[fromISO(s.date).getDay()]}) ${s.startTime}</span>
        <span class="status-badge st-makeup_scheduled">${statusIcon('makeup_scheduled')}${STATUS_LABEL.makeup_scheduled}</span>
      </div>`;
    });
    html += `</div></div>`;
    openModal(html);
    return;
  }

  const statusFilter = kind==='all' ? null : (kind==='attended' ? 'attended' : (kind==='absent' ? 'absent' : 'scheduled'));
  const dates = (statusFilter ? monthSessions.filter(s=>s.status===statusFilter) : monthSessions).sort((a,b)=>a.date.localeCompare(b.date));
  html += `<div style="font-size:12px;color:#94a3b8;font-weight:600;margin-bottom:14px;">${dates.length}건</div>
  <div style="display:flex;flex-direction:column;gap:6px;">`;
  if (dates.length===0) html += `<div style="font-size:13px;color:#94a3b8;">해당 내역이 없습니다.</div>`;
  dates.forEach(s=>{
    html += `<div class="m-card" style="display:flex;align-items:center;justify-content:space-between;">
      <span style="font-size:13px;font-weight:700;">${s.date} (${WD[fromISO(s.date).getDay()]}) ${s.startTime}</span>
      <span class="status-badge st-${s.status}">${statusIcon(s.status)}${STATUS_LABEL[s.status]}</span>
    </div>`;
  });
  html += `</div></div>`;
  openModal(html);
}

function openMemberFullHistory(memberId){
  const m = memberById(memberId);
  const all = STATE.sessions.filter(s=>s.memberId===memberId);
  const byMonth = {};
  all.forEach(s=>{ const mo = s.date.slice(0,7); (byMonth[mo]=byMonth[mo]||[]).push(s); });
  const months = Object.keys(byMonth).sort().reverse();
  let html = `<div class="sheet-handle"></div><div class="sheet-close" onclick="closeModal()">${ICONS.x}</div>
  <div style="padding:6px 20px 20px 20px;">
    <div style="font-size:16px;font-weight:800;margin-bottom:4px;">${m?m.name:''} 전체 이력</div>
    <div style="font-size:12px;color:#94a3b8;font-weight:600;margin-bottom:14px;">등록 이후 월별 수업 현황</div>
    <div style="display:flex;flex-direction:column;gap:10px;">`;
  if (months.length===0) html += `<div style="font-size:13px;color:#94a3b8;">수업 기록이 없습니다.</div>`;
  months.forEach(mo=>{
    const sessions = byMonth[mo];
    const attended = sessions.filter(s=>s.status==='attended').length;
    const absent = sessions.filter(s=>s.status==='absent').length;
    const makeupSched = sessions.filter(s=>s.status==='makeup_scheduled').length;
    const makeupDone = sessions.filter(s=>s.status==='makeup_completed').length;
    const enrPaid = STATE.enrollments.filter(e=>e.memberId===memberId && e.yearMonth===mo && e.paymentStatus==='paid').reduce((a,e)=>a+(e.paymentAmount||0)-(e.discount||0),0);
    html += `<div class="m-card">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;">
        <span style="font-size:13px;font-weight:800;">${monthLabel(mo)}</span>
        ${isOwner() && enrPaid>0 ? `<span style="font-size:12px;font-weight:800;color:#4f46e5;">${enrPaid.toLocaleString()}원</span>` : ''}
      </div>
      <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:6px;">
        <div class="stat-tile"><div style="font-size:15px;font-weight:800;">${sessions.length}</div><div style="font-size:9px;color:#94a3b8;font-weight:700;margin-top:2px;">총 수업</div></div>
        <div class="stat-tile"><div style="font-size:15px;font-weight:800;color:#15803d;">${attended}</div><div style="font-size:9px;color:#94a3b8;font-weight:700;margin-top:2px;">출석</div></div>
        <div class="stat-tile"><div style="font-size:15px;font-weight:800;color:#b91c1c;">${absent}</div><div style="font-size:9px;color:#94a3b8;font-weight:700;margin-top:2px;">결석</div></div>
      </div>
      ${(makeupSched>0||makeupDone>0) ? `<div style="font-size:11px;color:#c2410c;font-weight:700;margin-top:8px;">보강예정 ${makeupSched}건 · 보강완료 ${makeupDone}건</div>` : ''}
    </div>`;
  });
  html += `</div></div>`;
  openModal(html);
}

async function confirmDeleteMember(memberId, name){
  const { error } = await sb.from('members').update({ status:'withdrawn' }).eq('id', memberId);

  STATE.members = STATE.members.filter(m=>m.id!==memberId);

  toast(`${name} 회원이 삭제되었습니다`);
}

    <select onchange="slotEditField('courtId', this.value)">${STATE.courts.map(c=>`<option value="${c.id}" ${c.id===se.courtId?'selected':''}>${c.name}</option>`).join('')}</select>
    <div style="background:#fffbeb;border:1px solid #fde68a;border-radius:12px;padding:12px;font-size:11px;color:#92400e;margin-top:14px;line-height:1.6;">
      앞으로 계속 이 요일·시간·코치로 바뀝니다. 이미 생성된 이번 달 수업은 그대로 유지되고, 다음 결제완료 시부터 새 시간으로 생성됩니다.
    </div>
    <div class="btn-primary" style="margin-top:16px;" onclick="updateSlotDefaults('${se.slotId}', ${se.weekday}, '${se.time}', '${se.coachId}', '${se.courtId}')">기본 수업시간 저장</div>
  </div>`;
  openModal(html);
}

function openAddSlotForm(memberId){
  STATE._addSlot = {memberId, weekday:2, time:'19:00', coachId:(activeCoaches()[0]||{}).id, productId:(STATE.products.find(p=>p.mode==='monthly')||{}).id, courtId: STATE.courts[0]?.id, forceOverride:false};
  renderAddSlotForm();
}
function addSlotField(key, val){ STATE._addSlot[key]=val; renderAddSlotForm(); }
function renderAddSlotForm(){
  const a = STATE._addSlot;
  const m = memberById(a.memberId);
  const coaches = activeCoaches();
  const products = STATE.products.filter(p=>p.mode==='monthly');
  const html = `<div class="sheet-handle"></div><div class="sheet-close" onclick="closeModal()">${ICONS.x}</div>
  <div style="padding:6px 20px 20px 20px;">
    <div style="font-size:16px;font-weight:800;margin-bottom:4px;">정규수업 추가 등록</div>
    <div style="font-size:12px;color:#94a3b8;font-weight:600;margin-bottom:14px;">${m.name} 회원 — 이미 있는 등록과 별개로 새 슬롯이 추가됩니다</div>
    <div class="field-label">요일</div>
    <div style="display:flex;gap:6px;flex-wrap:wrap;">${WD.map((d,i)=>`<div class="chip-select ${a.weekday===i?'on':''}" onclick="addSlotField('weekday',${i})">${d}</div>`).join('')}</div>
    <div class="field-label" style="margin-top:12px;">시간</div>
    <div style="display:flex;gap:6px;flex-wrap:wrap;">${OPERATING_HOURS.map(t=>`<div class="chip-select ${a.time===t?'on':''}" onclick="addSlotField('time','${t}')">${t}</div>`).join('')}</div>
    <div class="field-label" style="margin-top:12px;">담당 코치</div>
    <div style="display:flex;gap:6px;flex-wrap:wrap;">${coaches.map(c=>`<div class="chip-select ${a.coachId===c.id?'on':''}" onclick="addSlotField('coachId','${c.id}')">${c.name}</div>`).join('')}</div>
    <div class="field-label" style="margin-top:12px;">수강상품</div>
    <div style="display:flex;flex-direction:column;gap:8px;">${products.map(p=>{
      const disc = computeBundleDiscount(a.memberId, p.id);
      return `<div class="choice-card ${a.productId===p.id?'picked':''}" style="padding:12px 14px;" onclick="addSlotField('productId','${p.id}')">
        <div style="flex:1;"><div style="font-size:13px;font-weight:800;">${p.name}</div><div style="font-size:12px;color:#64748b;font-weight:600;margin-top:2px;">${p.price.toLocaleString()}원 / 월${disc?` <span style="color:#dc2626;">-${disc.toLocaleString()}원 주2회할인</span>`:''}</div></div>
        ${a.productId===p.id?ICONS.check.replace(/width="12" height="12"/,'width="16" height="16"').replace('currentColor','#4f46e5'):''}
      </div>`;}).join('')}</div>
    <div class="field-label" style="margin-top:12px;">코트</div>
    <select onchange="addSlotField('courtId', this.value)">${STATE.courts.map(c=>`<option value="${c.id}" ${c.id===a.courtId?'selected':''}>${c.name}</option>`).join('')}</select>
    <div style="display:flex;align-items:center;gap:8px;margin-top:14px;">
      <input type="checkbox" ${a.forceOverride?'checked':''} onchange="addSlotField('forceOverride', this.checked)" style="width:16px;height:16px;flex-shrink:0;" />
      <span style="font-size:12px;color:#334155;font-weight:600;">정원 초과를 허용합니다 (예: 2시간 동안 인원을 나눠 받는 특수 배정)</span>
    </div>
    ${(()=>{ const conflict = monthlySlotConflict(a.weekday, a.time, a.courtId, a.coachId, a.productId, a.forceOverride); return conflict ? `<div style="background:#fef2f2;border:1px solid #fecaca;border-radius:12px;padding:12px 14px;margin-top:14px;font-size:12px;color:#b91c1c;font-weight:700;line-height:1.6;">${conflict.detail} — 다른 요일·시간·코트를 선택해주세요.</div>` : ''; })()}
    <div class="btn-primary ${monthlySlotConflict(a.weekday, a.time, a.courtId, a.coachId, a.productId, a.forceOverride)?'disabled':''}" style="margin-top:18px;" onclick="addMonthlySlot('${a.memberId}', ${a.weekday}, '${a.time}', '${a.coachId}', '${a.productId}', '${a.courtId}', ${!!a.forceOverride})">결제완료 처리 → 시간표 자동 등록</div>
  </div>`;
  openModal(html);
}

/* ---------- 신규회원 등록 위저드 (관리자 전용) ---------- */
// 회원명단은 코치/반과 무관한 순수 인적사항만 다루므로, 신규 등록도 이름/연락처와 이력 정보만 받는다
// (수업 배정은 회원등록현황에서 별도로 한다). "실제 수강 시작 시기"·"특이사항 메모"는 수강신청서의
// 핵심 이력 항목을 반영한 것이다.
function openNewMemberWizard(){
  STATE._newMember = { name:'', phone:'', memberSince:'', memo:'' };
  renderNewMemberWizard();
}
// 여기서 절대 renderNewMemberWizard()로 다시 그리지 않는다 — 입력할 때마다 전체를 다시 그리면
// 한글 조합 중 커서/조합상태가 깨져서 자모가 풀어져 나오는 문제가 있었다(예: 백정미 → ㅂㅐㄱㅈㅓㅇㅁㅣ).
// "등록하기" 버튼의 활성/비활성만 직접 DOM에서 토글해서 입력창 자체는 다시 그리지 않는다.
function newMemberWizardInput(key, el){
  STATE._newMember[key] = el.value;
  if (key === 'name') {
    const btn = document.querySelector('.sheet .btn-primary');
    if (btn) btn.classList.toggle('disabled', el.value.trim().length===0);
  }
}
function renderNewMemberWizard(){
  const w = STATE._newMember;
  const html = `<div class="sheet-handle"></div><div class="sheet-close" onclick="closeModal()">${ICONS.x}</div>
  <div style="padding:6px 20px 20px 20px;">
    <div style="font-size:16px;font-weight:800;margin-bottom:14px;">신규 회원 등록</div>
    <div class="field-label">이름</div>
    <input id="wz_name" type="text" value="${w.name}" oninput="newMemberWizardInput('name', this)" placeholder="예: 김하늘" />
    <div class="field-label" style="margin-top:12px;">연락처</div>
    <input type="tel" value="${w.phone}" oninput="newMemberWizardInput('phone', this)" placeholder="010-0000-0000" />
    <div class="field-label" style="margin-top:12px;">실제 수강 시작 시기</div>
    <input type="text" value="${w.memberSince}" oninput="newMemberWizardInput('memberSince', this)" placeholder="예: 2019년부터, 2021-03" />
    <div class="field-label" style="margin-top:12px;">특이사항 메모</div>
    <textarea rows="3" oninput="newMemberWizardInput('memo', this)" placeholder="배드민턴/기타 운동 경력, 병력, 목적 등">${w.memo}</textarea>
    <div class="btn-primary ${w.name.trim()?'':'disabled'}" style="margin-top:16px;" onclick="submitNewMemberWizard()">등록하기</div>
  </div>`;
  openModal(html);
}
async function submitNewMemberWizard(){
  const w = STATE._newMember;
  if (!w.name.trim()) { toast('이름을 입력하세요'); return; }
  const dup = findDuplicateMember(w.name.trim(), w.phone);
  if (dup) { openDuplicateMemberConfirm(dup, 'proceedSubmitNewMemberWizard', 'renderNewMemberWizard'); return; }
  await proceedSubmitNewMemberWizard();
}
async function proceedSubmitNewMemberWizard(){
  const w = STATE._newMember;
  await createNewMember({ name: w.name.trim(), phone: (w.phone||'').trim(), memberSince: (w.memberSince||'').trim(), memo: (w.memo||'').trim() });
}

/* ============================== 시작 ============================== */
showAuthScreen();
</script>
</body>
</html>
